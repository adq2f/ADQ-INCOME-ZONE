<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password — ADQ Income Zone</title>
  <link rel="stylesheet" href="style.css?v=36">
  <style>
    /* Premium Reset Password Design */
    .reset-wrapper {
      min-height: 100vh;
      background: linear-gradient(165deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
      display: flex; align-items: center; justify-content: center;
      padding: 24px 16px; position: relative; overflow: hidden;
    }
    .reset-wrapper::before {
      content: ''; position: absolute; top: -100px; right: -100px;
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(139,92,246,0.3), transparent 70%);
      border-radius: 50%;
    }
    .reset-box {
      background: white; border-radius: 28px; padding: 36px 28px;
      width: 100%; max-width: 420px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.4);
      position: relative; z-index: 1; text-align: center;
      animation: slideUp 0.5s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

    .reset-icon {
      width: 80px; height: 80px; margin: 0 auto 20px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border-radius: 24px; display: flex; align-items: center; justify-content: center;
      font-size: 40px; box-shadow: 0 16px 32px rgba(245,158,11,0.4);
      animation: pulseGlow 2s infinite alternate;
    }
    @keyframes pulseGlow {
      0% { box-shadow: 0 16px 32px rgba(245,158,11,0.4); transform: scale(1); }
      100% { box-shadow: 0 20px 48px rgba(245,158,11,0.8); transform: scale(1.05); }
    }

    .reset-title { font-size: 24px; font-weight: 900; color: #0f172a; margin-bottom: 8px; }
    .reset-sub { font-size: 14px; color: #64748b; margin-bottom: 24px; font-weight: 500; }

    .reset-email-badge {
      display: inline-block; background: #eef2ff; color: #4f46e5;
      padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 700;
      margin-bottom: 24px; word-break: break-all;
    }

    /* Loading State */
    .loading-state { display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px 0; }
    .loading-state.show { display: flex; }
    .spinner-large {
      width: 50px; height: 50px; border: 4px solid #e2e8f0; border-top-color: #6366f1;
      border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Error State */
    .error-state { display: none; flex-direction: column; align-items: center; padding: 20px 0; }
    .error-state.show { display: flex; }
    .error-icon {
      width: 70px; height: 70px; border-radius: 50%; background: #fee2e2;
      display: flex; align-items: center; justify-content: center; font-size: 32px; margin-bottom: 16px;
    }

    /* Form State */
    .form-state { display: none; }
    .form-state.show { display: block; animation: fadeInUp 0.5s ease; }

    .input-group { text-align: left; margin-bottom: 18px; position: relative; }
    .input-group label { font-size: 12px; font-weight: 800; color: #475569; margin-bottom: 8px; display: block; text-transform: uppercase; letter-spacing: 0.5px; }
    .input-group input {
      width: 100%; padding: 16px; border: 2px solid #e2e8f0; border-radius: 14px;
      font-size: 16px; font-weight: 600; color: #0f172a; transition: 0.3s; outline: none; background: #f8fafc;
    }
    .input-group input:focus { border-color: #6366f1; background: white; box-shadow: 0 0 0 4px rgba(99,102,241,0.1); }
    .input-group .toggle-pass {
      position: absolute; right: 16px; top: 42px; background: none; border: none;
      font-size: 20px; cursor: pointer; color: #94a3b8;
    }

    .btn-reset {
      width: 100%; padding: 16px; border-radius: 14px; border: none;
      background: linear-gradient(135deg, #10b981, #059669); color: white;
      font-size: 16px; font-weight: 800; cursor: pointer; transition: 0.3s;
      box-shadow: 0 8px 24px rgba(16,185,129,0.4); margin-top: 10px;
    }
    .btn-reset:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(16,185,129,0.6); }
    .btn-reset:disabled { background: #cbd5e1; box-shadow: none; cursor: not-allowed; transform: none; }

    .success-state { display: none; flex-direction: column; align-items: center; padding: 20px 0; }
    .success-state.show { display: flex; }
    .success-icon {
      width: 70px; height: 70px; border-radius: 50%; background: #d1fae5;
      display: flex; align-items: center; justify-content: center; font-size: 32px; margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <div class="reset-wrapper">
    <div class="reset-box">
      
      <!-- 1. Loading State -->
      <div class="loading-state show" id="loadingState">
        <div class="spinner-large"></div>
        <div style="font-weight: 700; color: #475569;">যাচাই করা হচ্ছে...</div>
      </div>

      <!-- 2. Error State -->
      <div class="error-state" id="errorState">
        <div class="error-icon">❌</div>
        <h2 class="reset-title" style="font-size: 20px;">লিংকটি সঠিক নয়!</h2>
        <p class="reset-sub" id="errorMsg" style="margin-bottom: 20px;">লিংকটির মেয়াদ শেষ হয়ে গেছে অথবা এটি ভুল।</p>
        <a href="reset-request.html" class="btn btn-primary btn-full" style="text-decoration:none; padding: 14px; border-radius: 12px;">আবার রিকোয়েস্ট করুন</a>
      </div>

      <!-- 3. Form State -->
      <div class="form-state" id="formState">
        <div class="reset-icon">🔐</div>
        <h2 class="reset-title">নতুন পাসওয়ার্ড দিন</h2>
        <p class="reset-sub">আপনার অ্যাকাউন্টের জন্য একটি শক্তিশালী পাসওয়ার্ড সেট করুন।</p>
        
        <div class="reset-email-badge" id="userEmail">লোড হচ্ছে...</div>

        <div class="input-group">
          <label>New Password</label>
          <input type="password" id="newPass" placeholder="কমপক্ষে ৬ অক্ষর">
          <button type="button" class="toggle-pass" onclick="togglePass('newPass')">👁️</button>
        </div>

        <div class="input-group">
          <label>Confirm Password</label>
          <input type="password" id="confirmPass" placeholder="আবার পাসওয়ার্ডটি লিখুন">
          <button type="button" class="toggle-pass" onclick="togglePass('confirmPass')">👁️</button>
        </div>

        <button class="btn-reset" id="submitBtn">পাসওয়ার্ড সেভ করুন</button>
      </div>

      <!-- 4. Success State -->
      <div class="success-state" id="successState">
        <div class="success-icon">✅</div>
        <h2 class="reset-title" style="font-size: 22px;">সফল হয়েছে!</h2>
        <p class="reset-sub">আপনার পাসওয়ার্ড সফলভাবে পরিবর্তন করা হয়েছে।</p>
        <a href="login.html" class="btn btn-primary btn-full" style="text-decoration:none; padding: 14px; border-radius: 12px; margin-top: 10px;">লগইন পেজে যান</a>
      </div>

    </div>
  </div>

  <script type="module">
    import { auth } from "./firebase.js";
    import { verifyPasswordResetCode, confirmPasswordReset } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // UI Elements
    const loadingState = document.getElementById("loadingState");
    const errorState = document.getElementById("errorState");
    const formState = document.getElementById("formState");
    const successState = document.getElementById("successState");
    const errorMsg = document.getElementById("errorMsg");
    const userEmail = document.getElementById("userEmail");
    const submitBtn = document.getElementById("submitBtn");

    let actionCode = null;

    // পাসওয়ার্ড শো/হাইড করার ফাংশন
    window.togglePass = function(id) {
      const input = document.getElementById(id);
      input.type = input.type === "password" ? "text" : "password";
    };

    // ১. URL থেকে কোড চেক করা
    const urlParams = new URLSearchParams(window.location.search);
    const mode = urlParams.get('mode');
    actionCode = urlParams.get('oobCode');

    if (!actionCode || mode !== 'resetPassword') {
      loadingState.classList.remove("show");
      errorState.classList.add("show");
      errorMsg.textContent = "লিংকটি সঠিক নয় অথবা মেয়াদ শেষ হয়ে গেছে।";
    } else {
      // ২. কোড ভেরিফাই করা
      verifyPasswordResetCode(auth, actionCode)
        .then((email) => {
          // সফল হলে ইমেইল দেখানো এবং ফর্ম ওপেন করা
          loadingState.classList.remove("show");
          formState.classList.add("show");
          userEmail.textContent = "📧 " + email;
        })
        .catch((error) => {
          // কোড ভুল বা মেয়াদ শেষ
          loadingState.classList.remove("show");
          errorState.classList.add("show");
          errorMsg.textContent = "লিংকটির মেয়াদ শেষ হয়ে গেছে। আবার রিকোয়েস্ট করুন।";
        });
    }

    // ৩. নতুন পাসওয়ার্ড সাবমিট করা
    submitBtn.onclick = async () => {
      const newPass = document.getElementById("newPass").value;
      const confirmPass = document.getElementById("confirmPass").value;

      if (!newPass || newPass.length < 6) return alert("পাসওয়ার্ড কমপক্ষে ৬ অক্ষর হতে হবে!");
      if (newPass !== confirmPass) return alert("দুটি পাসওয়ার্ড মিলছে না!");

      submitBtn.disabled = true;
      submitBtn.textContent = "সেভ হচ্ছে...";

      try {
        // Firebase-এ নতুন পাসওয়ার্ড সেভ করা
        await confirmPasswordReset(auth, actionCode, newPass);
        
        // সফল হলে সাকসেস স্ক্রিন দেখানো
        formState.classList.remove("show");
        successState.classList.add("show");
      } catch (error) {
        alert("❌ পাসওয়ার্ড সেভ করা যায়নি: " + error.message);
        submitBtn.disabled = false;
        submitBtn.textContent = "পাসওয়ার্ড সেভ করুন";
      }
    };
  </script>
</body>
</html>
