<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Data Cleanup — Admin — ADQ Income Zone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#06060f;--ink:#f4f4ff;--muted:#9a9bb8;--dim:#6f7090;--line:rgba(255,255,255,.09);--cyan:#22d3ee}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
html,body{background:var(--bg)!important}
body{font-family:'Hind Siliguri','Inter',system-ui,sans-serif!important;color:var(--ink);margin:0;padding:0!important;min-height:100vh;min-height:100dvh;overflow-x:hidden;position:relative}
a{text-decoration:none;color:inherit}button{font-family:inherit}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(90px);will-change:transform}
.orb.o1{width:420px;height:420px;background:#4f46e5;top:-140px;left:-120px;opacity:.5;animation:dr1 20s ease-in-out infinite}
.orb.o2{width:380px;height:380px;background:#9333ea;bottom:-160px;right:-120px;opacity:.42;animation:dr2 24s ease-in-out infinite}
@keyframes dr1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,40px) scale(1.1)}}
@keyframes dr2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-40px,-50px) scale(1.08)}}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 20%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 0%,#000 20%,transparent 70%)}
.top{position:sticky;top:0;z-index:50;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;background:rgba(6,6,15,.65);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border-bottom:1px solid var(--line)}
.top-in{max-width:520px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.mark{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#6366f1,#8b5cf6 55%,#22d3ee);color:#fff;font-family:'Inter';font-weight:900;font-size:16px;box-shadow:0 8px 20px -6px rgba(139,92,246,.8),inset 0 1px 0 rgba(255,255,255,.35)}
.ibtn{width:40px;height:40px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;flex:0 0 40px}
.ibtn:hover{color:#fff;background:rgba(255,255,255,.1)}
.ibtn.danger:hover{background:rgba(239,68,68,.18);border-color:rgba(239,68,68,.45)}
.ibtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.page{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:20px 16px calc(130px + env(safe-area-inset-bottom,0px))}
.sec{margin:26px 2px 12px;font-size:17px;font-weight:700;letter-spacing:-.2px;display:flex;align-items:center;justify-content:space-between}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.025));border:1px solid var(--line)}
.empty{text-align:center;padding:30px 16px;border-radius:22px;border:1.5px dashed rgba(255,255,255,.14);color:var(--muted);font-size:13.5px;font-weight:600}
.empty .em{font-size:30px;margin-bottom:6px}
.skel{height:92px;border-radius:22px;margin-bottom:10px;border:1px solid var(--line);background:linear-gradient(100deg,rgba(255,255,255,.04) 30%,rgba(255,255,255,.1) 50%,rgba(255,255,255,.04) 70%);background-size:200% 100%;animation:shim 1.4s infinite linear}
.skel.big{height:170px;border-radius:28px}
@keyframes shim{to{background-position:-200% 0}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.dock{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:calc(100% - 24px);max-width:500px;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:8px;background:rgba(18,18,40,.78);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);border:1px solid rgba(255,255,255,.12);border-radius:26px;box-shadow:0 20px 50px -10px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.1)}
.dock a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 6px;border-radius:18px;color:var(--dim);font-size:10.5px;font-weight:600;transition:.25s}
.dock a svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:.25s}
.dock a:hover{color:#fff}
.dock a.active{color:#fff;background:linear-gradient(135deg,rgba(99,102,241,.5),rgba(139,92,246,.35));box-shadow:inset 0 0 0 1px rgba(167,139,250,.5),0 8px 20px -8px rgba(139,92,246,.9)}
.dock a.active svg{transform:translateY(-1px) scale(1.08)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.orb,.skel{animation:none}}

.atag{font-style:normal;font-size:10px;font-weight:800;letter-spacing:.8px;color:#2a1700;background:linear-gradient(135deg,#fde68a,#f59e0b);padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:2px}
.top .mark{background:linear-gradient(135deg,#fbbf24,#f59e0b 55%,#d97706);color:#2a1700;box-shadow:0 8px 20px -6px rgba(245,158,11,.8),inset 0 1px 0 rgba(255,255,255,.4)}
.switch{position:relative;width:54px;height:30px;flex:0 0 54px;display:inline-block}
.switch input{opacity:0;width:0;height:0;position:absolute;margin:0}
.slider{position:absolute;inset:0;cursor:pointer;background:rgba(255,255,255,.14);border:1px solid var(--line);border-radius:30px;transition:.3s}
.slider::before{content:"";position:absolute;height:22px;width:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.3s;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.switch input:checked+.slider{background:linear-gradient(135deg,#10b981,#0d9488);border-color:transparent;box-shadow:0 0 18px -2px rgba(16,185,129,.8)}
.switch input:checked+.slider::before{transform:translateX(24px)}
.inp{display:block;width:100%;padding:15px 16px;margin:0 0 12px;border-radius:16px;border:1.5px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);font-family:inherit;font-size:15px;font-weight:500;outline:none;transition:.25s;color-scheme:dark}
.inp::placeholder{color:#6f7090;font-weight:400}
.inp:focus{border-color:rgba(139,92,246,.9);background:rgba(139,92,246,.08);box-shadow:0 0 0 4px rgba(139,92,246,.18)}
.inp:disabled{opacity:.55;cursor:not-allowed}
select.inp option{background:#12122a;color:#fff}
.lab{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:2px 2px 7px}
.acard{border-radius:26px;padding:20px;margin-bottom:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.acard h3{margin:0 0 6px;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.acard .hi{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;background:rgba(99,102,241,.22)}
.acard .sub{margin:0 0 16px;font-size:12.5px;line-height:1.6;color:var(--muted)}
.cta.red{background:linear-gradient(135deg,#ef4444,#b91c1c);box-shadow:0 16px 32px -12px rgba(239,68,68,.9),inset 0 1px 0 rgba(255,255,255,.3)}
.cta.amber{background:linear-gradient(135deg,#fbbf24,#f59e0b 55%,#d97706);box-shadow:0 16px 34px -10px rgba(245,158,11,.9),inset 0 1px 0 rgba(255,255,255,.4);color:#2a1700}
.cta.outline{background:rgba(255,255,255,.05);border:1.5px solid rgba(139,92,246,.55);color:#c4b5fd;box-shadow:none}
.cta+.cta{margin-top:10px}
.tabs2{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px}
.tabs2::-webkit-scrollbar{display:none}
.tabs2 button{padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted);font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer;transition:.25s}
.tabs2 button:hover{color:#fff}
.tabs2 button.active{color:#fff;border-color:transparent;background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 10px 22px -8px rgba(139,92,246,.9)}
.page{max-width:640px}

.warn{display:flex;gap:12px;align-items:flex-start;padding:15px 16px;border-radius:22px;margin-bottom:16px;font-size:13px;line-height:1.65;color:#fde9a8;background:linear-gradient(135deg,rgba(251,191,36,.15),rgba(245,158,11,.04));border:1px solid rgba(251,191,36,.38);border-left:4px solid #fbbf24}
.warn b{color:#fde68a}.warn .wi{font-size:22px}
.grp{border-radius:26px;padding:18px;margin-bottom:14px;animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.grp-h{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.grp-ic{width:46px;height:46px;flex:0 0 46px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:22px;background:rgba(99,102,241,.22)}
.grp-t h3{margin:0;font-size:16.5px;font-weight:700}
.grp-t p{margin:2px 0 0;font-size:12.5px;color:var(--muted);line-height:1.5}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.opt{padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted);font-size:12.5px;font-weight:700;cursor:pointer;transition:.2s;display:inline-flex;gap:7px;align-items:center}
.opt:hover{color:#fff}
.opt .c{font-family:'Inter';font-size:11.5px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.1);color:#fff}
.opt.on{color:#fff;border-color:rgba(239,68,68,.8);background:rgba(239,68,68,.16);box-shadow:0 8px 20px -10px rgba(239,68,68,.9)}
.opt.on .c{background:#ef4444}
.will{padding:12px 14px;border-radius:16px;background:rgba(0,0,0,.2);font-size:12.5px;line-height:1.7;margin-bottom:12px}
.will .no{color:#fca5a5;font-weight:700}.will .ok{color:#6ee7b7;font-weight:700}
.all{border-radius:28px;padding:20px;margin-bottom:16px;border:1.5px solid rgba(239,68,68,.6);background:linear-gradient(135deg,rgba(239,68,68,.2),rgba(190,24,93,.1))}
.all h3{margin:0 0 4px;font-size:18px;color:#fecaca;display:flex;align-items:center;gap:8px}
.all .sub{margin:0 0 14px;font-size:12.5px;color:#fecaca;opacity:.9}
.chk{list-style:none;padding:0;margin:0 0 14px}
.chk li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:rgba(0,0,0,.22);margin-bottom:6px;font-size:13px;font-weight:600}
.chk li b{font-family:'Inter';color:#fff}
.chk li.keep{background:rgba(16,185,129,.1);color:#a7f3d0}
.usr{border-radius:26px;padding:18px;margin-bottom:14px;border:1.5px dashed rgba(239,68,68,.55);background:rgba(239,68,68,.06)}
.p-modal{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-end;justify-content:center;background:rgba(3,3,10,.75);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.p-modal.show{opacity:1;visibility:visible}
.p-sheet{width:100%;max-width:560px;max-height:90vh;max-height:90dvh;display:flex;flex-direction:column;border-radius:28px 28px 0 0;background:linear-gradient(180deg,#17172f,#0d0d1f);border:1px solid rgba(255,255,255,.12);border-bottom:none;box-shadow:0 -20px 60px -10px rgba(0,0,0,.7);transform:translateY(40px);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.p-modal.show .p-sheet{transform:none}
.p-sheet::before{content:'';width:42px;height:4px;border-radius:4px;background:rgba(255,255,255,.2);margin:10px auto 0;flex:0 0 4px}
.p-body{overflow-y:auto;padding:14px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.p-body h3{margin:0 0 4px;font-size:19px;font-weight:700}
.big-n{font-family:'Inter';font-size:34px;font-weight:900;color:#fca5a5;line-height:1;margin:6px 0 12px}
.box{padding:12px 14px;border-radius:16px;margin-bottom:10px;font-size:13px;line-height:1.7}
.box.del{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4)}
.box.keep{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.35);color:#a7f3d0}
.box b{display:block;margin-bottom:4px}
.box ul{margin:0;padding-left:18px}
.pbar{height:10px;border-radius:10px;background:rgba(255,255,255,.1);overflow:hidden;margin:12px 0 6px}
.pfill{height:100%;width:0;border-radius:10px;background:linear-gradient(90deg,#ef4444,#f59e0b);transition:width .25s}
.ptxt{font-size:13px;color:var(--muted);font-weight:600;min-height:20px}
.cinput{text-align:center;font-family:'Inter';font-weight:800;letter-spacing:1px}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="orb o1"></div><div class="orb o2"></div><div class="grid"></div></div><header class="top"><div class="top-in"><button class="ibtn" onclick="location.href='admin.html'" aria-label="Back"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button><div class="brand"><div class="mark">⚡</div><span>Data Cleanup<em class="atag">ADMIN</em></span></div><div style="width:40px"></div></div></header>
<main class="page" style="padding-bottom:calc(60px + env(safe-area-inset-bottom,0px))">
  <div class="warn glass"><div class="wi">⚠️</div><div>
    <b>এখান থেকে delete করলে data আর ফেরত আসবে না।</b><br>
    প্রতিটা কার্ডে স্পষ্ট লেখা আছে <b>কী কী মুছবে</b> আর <b>কী থাকবে</b>। Delete চাপলে confirm করতে একটা শব্দ টাইপ করতে হবে। User-দের balance ও Good/Bad সংখ্যা এতে বদলাবে না।
  </div></div>

  <div id="groups"><div class="skel big"></div><div class="skel big"></div></div>
</main>

<div class="p-modal" id="cModal"><div class="p-sheet"><div class="p-body" id="cBody"></div></div></div>


<script type="module">
    import { auth, db } from "./firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { doc, getDoc, collection, query, where, getDocs, getCountFromServer, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    
    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    const SESSION_DURATION = 12 * 60 * 60 * 1000;
    async function requireAdmin(user) {
      const snap = await getDoc(doc(db, "users", user.uid));
      if (!snap.exists() || snap.data().role !== "admin") { alert("❌ Admin না!"); location.href = "dashboard.html"; return null; }
      const sessionTime = sessionStorage.getItem("admin_verified");
      if (!sessionTime || (Date.now() - parseInt(sessionTime)) > SESSION_DURATION) {
        sessionStorage.setItem("admin_return", location.pathname + location.search);
        sessionStorage.removeItem("admin_verified");
        location.href = "admin-login.html";
        return null;
      }
      return snap.data();
    }

    window.goBack = () => { location.href = "admin.html"; };
    let currentAdmin = null;

    // ---------- helpers ----------
    const C = (name) => collection(db, name);
    async function cnt(q) {
      try { return (await getCountFromServer(q)).data().count; }
      catch (e) { return (await getDocs(q)).size; }
    }
    const refsOf = async (q) => (await getDocs(q)).docs.map(d => d.ref);

    async function completedTaskDocs() {
      const now = new Date();
      const snap = await getDocs(C("tasks"));
      return snap.docs.filter(d => {
        const t = d.data();
        const end = t.endTime?.toDate?.();
        return t.active === false || (end && end < now);
      });
    }
    async function chatRefs() {
      const refs = [];
      const chats = await getDocs(C("chats"));
      for (const c of chats.docs) {
        const msgs = await getDocs(collection(db, "chats", c.id, "messages"));
        msgs.docs.forEach(m => refs.push(m.ref));
        refs.push(c.ref);
      }
      return refs;
    }
    async function chatCount() {
      // chat সংখ্যা (messages আলাদা করে গোনা হয় না)
      return cnt(C("chats"));
    }
    async function nonAdminUserDocs() {
      const snap = await getDocs(C("users"));
      return snap.docs.filter(d => d.data().role !== "admin" && d.id !== currentAdmin.uid);
    }

    // ---------- definitions: একটা group = একটা delete এর জায়গা ----------
    const GROUPS = [
      {
        id: "wd", icon: "💸", title: "Withdraw History",
        desc: "Approved ও Rejected withdraw এর পুরনো record",
        keep: "Pending request গুলো থাকবে (কারণ ওই user-দের টাকা আগেই কাটা হয়েছে)। Payment method on/off setting থাকবে।",
        options: [
          { key: "processed", label: "Approved + Rejected", words: "Approved ও Rejected সব withdraw record",
            count: () => cnt(query(C("withdrawals"), where("status", "in", ["approved", "rejected"]))),
            refs: () => refsOf(query(C("withdrawals"), where("status", "in", ["approved", "rejected"]))) },
          { key: "approved", label: "শুধু Approved", words: "শুধু Approved withdraw record",
            count: () => cnt(query(C("withdrawals"), where("status", "==", "approved"))),
            refs: () => refsOf(query(C("withdrawals"), where("status", "==", "approved"))) },
          { key: "rejected", label: "শুধু Rejected", words: "শুধু Rejected withdraw record",
            count: () => cnt(query(C("withdrawals"), where("status", "==", "rejected"))),
            refs: () => refsOf(query(C("withdrawals"), where("status", "==", "rejected"))) }
        ]
      },
      {
        id: "sub", icon: "📤", title: "Submissions (Good / Bad / Pending)",
        desc: "User-দের জমা দেওয়া account এর history — status বেছে নিন",
        keep: "User account, balance, Good/Bad সংখ্যা (counter) আর task গুলো থাকবে।",
        options: [
          { key: "good", label: "✅ Good", words: "সব Good submission",
            count: () => cnt(query(C("submissions"), where("status", "==", "good"))),
            refs: () => refsOf(query(C("submissions"), where("status", "==", "good"))) },
          { key: "bad", label: "❌ Bad", words: "সব Bad submission",
            count: () => cnt(query(C("submissions"), where("status", "==", "bad"))),
            refs: () => refsOf(query(C("submissions"), where("status", "==", "bad"))) },
          { key: "pending", label: "⏳ Pending", words: "সব Pending submission (⚠️ এগুলোর payment এখনো হয়নি)",
            count: () => cnt(query(C("submissions"), where("status", "==", "pending"))),
            refs: () => refsOf(query(C("submissions"), where("status", "==", "pending"))) },
          { key: "all", label: "🗂️ সব একসাথে", words: "Good + Bad + Pending সব submission",
            count: () => cnt(C("submissions")),
            refs: () => refsOf(C("submissions")) }
        ]
      },
      {
        id: "task", icon: "🎯", title: "Completed Tasks",
        desc: "সময় শেষ হয়ে যাওয়া অথবা বন্ধ (inactive) করা task",
        keep: "চালু (active) task আর এগুলোর submission গুলো থাকবে।",
        options: [
          { key: "done", label: "সময় শেষ / বন্ধ task", words: "সময় শেষ হওয়া বা inactive সব task",
            count: async () => (await completedTaskDocs()).length,
            refs: async () => (await completedTaskDocs()).map(d => d.ref) }
        ]
      },
      {
        id: "rep", icon: "📊", title: "Daily Reports",
        desc: "Admin যে daily result publish করেছে সেগুলো",
        keep: "Task, submission, user কিছুই বদলাবে না।",
        options: [{ key: "all", label: "সব Report", words: "সব published daily report",
          count: () => cnt(C("reports")), refs: () => refsOf(C("reports")) }]
      },
      {
        id: "ref", icon: "🎁", title: "Refer Earnings History",
        desc: "Refer commission এর লেনদেনের তালিকা",
        keep: "User-দের মোট refer earning ও balance বদলাবে না।",
        options: [{ key: "all", label: "সব Refer Earning record", words: "refer_earnings এর সব record",
          count: () => cnt(C("refer_earnings")), refs: () => refsOf(C("refer_earnings")) }]
      },
      {
        id: "chat", icon: "💬", title: "Live Chat History",
        desc: "সব user এর সাথে chat এর মেসেজ",
        keep: "Admin Online/Offline setting থাকবে। User নতুন করে chat শুরু করতে পারবে।",
        options: [{ key: "all", label: "সব Chat ও মেসেজ", words: "সব chat conversation ও তাদের সব মেসেজ",
          count: chatCount, refs: chatRefs }]
      },
      {
        id: "notice", icon: "🔔", title: "Old Notices",
        desc: "বন্ধ (inactive) করা পুরনো নোটিশ",
        keep: "চালু (active) নোটিশ থাকবে।",
        options: [{ key: "off", label: "Inactive নোটিশ", words: "সব inactive notice",
          count: () => cnt(query(C("notices"), where("active", "==", false))),
          refs: () => refsOf(query(C("notices"), where("active", "==", false))) }]
      }
    ];

    // সব History একসাথে — এখানে যা যা আছে ঠিক সেগুলোই মুছবে
    const ALL_PARTS = [
      { g: "wd", o: "processed", label: "💸 Withdraw History (Approved + Rejected)" },
      { g: "sub", o: "all", label: "📤 সব Submission (Good + Bad + Pending)" },
      { g: "task", o: "done", label: "🎯 Completed Tasks" },
      { g: "rep", o: "all", label: "📊 Daily Reports" },
      { g: "ref", o: "all", label: "🎁 Refer Earnings History" },
      { g: "chat", o: "all", label: "💬 Live Chat History" }
    ];
    const findOpt = (g, o) => GROUPS.find(x => x.id === g).options.find(x => x.key === o);

    const selected = {};   // group id -> option key
    const counts = {};     // "g:o" -> number

    // ---------- render ----------
    function render() {
      const box = document.getElementById("groups");
      let html = "";

      // সব History একসাথে
      let total = 0;
      html += `<div class="all"><h3>🧹 সব History একসাথে Delete</h3>
        <p class="sub">নিচের তালিকার সবকিছু একবারে মুছবে। ঠিক কী কী যাবে তা এখানেই দেখুন।</p>
        <ul class="chk">` + ALL_PARTS.map(p => {
          const n = counts[p.g + ":" + p.o];
          if (typeof n === "number") total += n;
          return `<li><span>${p.label}</span><b>${typeof n === "number" ? n : "…"}</b></li>`;
        }).join("") + `
          <li class="keep"><span>✅ থাকবে: User account, balance, চালু Task, Pending Withdraw, Admin settings</span></li>
        </ul>
        <button class="cta red" id="btnAll">🧹 সব History Delete করুন (${total})</button></div>`;

      html += `<div class="sec" style="margin-top:6px"><span>📂 আলাদা আলাদা Delete</span></div>`;

      html += GROUPS.map((g, i) => {
        const sel = selected[g.id] || g.options[0].key;
        const o = g.options.find(x => x.key === sel);
        const n = counts[g.id + ":" + sel];
        return `<div class="grp glass" style="animation-delay:${i * 0.05}s">
          <div class="grp-h"><div class="grp-ic">${g.icon}</div><div class="grp-t"><h3>${g.title}</h3><p>${g.desc}</p></div></div>
          ${g.options.length > 1 ? `<div class="opts">` + g.options.map(op => {
            const c = counts[g.id + ":" + op.key];
            return `<button class="opt ${op.key === sel ? 'on' : ''}" data-g="${g.id}" data-o="${op.key}">${op.label}<span class="c">${typeof c === "number" ? c : "…"}</span></button>`;
          }).join("") + `</div>` : ``}
          <div class="will"><span class="no">🗑️ মুছবে:</span> ${o.words}${g.options.length === 1 ? ` (<b>${typeof n === "number" ? n : "…"}</b> টা)` : ``}<br><span class="ok">✅ থাকবে:</span> ${g.keep}</div>
          <button class="cta red" data-del="${g.id}" ${n === 0 ? "disabled" : ""}>🗑️ Delete — ${o.label}${typeof n === "number" ? " (" + n + ")" : ""}</button>
        </div>`;
      }).join("");

      html += `<div class="sec"><span>👥 User Delete</span></div>
        <div class="usr">
          <div class="grp-h"><div class="grp-ic" style="background:rgba(239,68,68,.22)">👥</div><div class="grp-t"><h3>সব User (Admin বাদে)</h3><p>সবচেয়ে বিপজ্জনক option</p></div></div>
          <div class="will"><span class="no">🗑️ মুছবে:</span> Admin ছাড়া সব user-এর account document (<b id="uCount">${typeof counts["users"] === "number" ? counts["users"] : "…"}</b> জন)।<br>
          <span class="ok">✅ থাকবে:</span> Admin account, Task, অন্য সব history।<br>
          <span class="no">⚠️ মনে রাখুন:</span> Firebase Authentication-এর login account এখান থেকে মুছে না — সেটা Firebase Console → Authentication থেকে আলাদা মুছতে হবে।</div>
          <button class="cta red" id="btnUsers">☠️ সব User Delete করুন</button>
        </div>`;

      box.innerHTML = html;
    }

    async function loadCounts() {
      const jobs = [];
      GROUPS.forEach(g => g.options.forEach(o => jobs.push(
        o.count().then(n => { counts[g.id + ":" + o.key] = n; }).catch(() => { counts[g.id + ":" + o.key] = 0; })
      )));
      jobs.push(nonAdminUserDocs().then(a => { counts["users"] = a.length; }).catch(() => { counts["users"] = 0; }));
      await Promise.all(jobs);
      render();
    }

    // ---------- confirm modal ----------
    const modal = document.getElementById("cModal");
    const cBody = document.getElementById("cBody");
    modal.addEventListener("click", (e) => { if (e.target === modal && !modal.dataset.busy) modal.classList.remove("show"); });

    function confirmDelete({ icon, title, total, deletes, keeps, word, providers }) {
      cBody.innerHTML = `
        <h3>${icon} ${title}</h3>
        <div class="big-n">${total} <span style="font-size:15px;font-weight:700;color:var(--muted)">টা document মুছবে</span></div>
        <div class="box del"><b>🗑️ যা যা মুছবে:</b><ul>${deletes.map(x => `<li>${x}</li>`).join("")}</ul></div>
        <div class="box keep"><b>✅ যা থাকবে:</b>${keeps}</div>
        <label class="lab" style="margin-top:14px">নিশ্চিত করতে নিচে <b style="color:#fff">${word}</b> টাইপ করুন</label>
        <input class="inp cinput" id="cWord" placeholder="${word}" autocomplete="off">
        <div class="pbar" style="display:none" id="cBar"><div class="pfill" id="cFill"></div></div>
        <div class="ptxt" id="cTxt"></div>
        <button class="cta red" id="cGo" disabled>🗑️ হ্যাঁ, Delete করুন</button>
        <button class="cta outline" id="cCancel">বাতিল</button>`;
      modal.classList.add("show");
      const inp = document.getElementById("cWord");
      const go = document.getElementById("cGo");
      inp.oninput = () => { go.disabled = inp.value.trim().toUpperCase() !== word.toUpperCase(); };
      document.getElementById("cCancel").onclick = () => { if (!modal.dataset.busy) modal.classList.remove("show"); };
      go.onclick = async () => {
        modal.dataset.busy = "1";
        go.disabled = true; inp.disabled = true;
        document.getElementById("cCancel").disabled = true;
        document.getElementById("cBar").style.display = "block";
        const txt = document.getElementById("cTxt");
        const fill = document.getElementById("cFill");
        try {
          txt.textContent = "Document খোঁজা হচ্ছে...";
          const seen = new Map();
          for (const p of providers) (await p()).forEach(r => seen.set(r.path, r));
          const refs = [...seen.values()];
          let done = 0;
          let batch = writeBatch(db), c = 0;
          for (const r of refs) {
            batch.delete(r); c++; done++;
            if (c >= 400) {
              await batch.commit(); batch = writeBatch(db); c = 0;
              fill.style.width = Math.round(done / refs.length * 100) + "%";
              txt.textContent = `${done} / ${refs.length} মুছে গেছে...`;
            }
          }
          if (c > 0) await batch.commit();
          fill.style.width = "100%";
          txt.textContent = `✅ সম্পন্ন! ${refs.length} টা document মুছে গেছে।`;
          delete modal.dataset.busy;
          document.getElementById("cCancel").disabled = false;
          document.getElementById("cCancel").textContent = "বন্ধ করুন";
          document.getElementById("cCancel").onclick = () => { modal.classList.remove("show"); };
          go.style.display = "none";
          loadCounts();
        } catch (e) {
          delete modal.dataset.busy;
          txt.textContent = "❌ " + e.message;
          document.getElementById("cCancel").disabled = false;
        }
      };
    }

    // ---------- clicks ----------
    document.getElementById("groups").addEventListener("click", (e) => {
      const opt = e.target.closest(".opt");
      if (opt) { selected[opt.dataset.g] = opt.dataset.o; render(); return; }

      const del = e.target.closest("[data-del]");
      if (del) {
        const g = GROUPS.find(x => x.id === del.dataset.del);
        const o = g.options.find(x => x.key === (selected[g.id] || g.options[0].key));
        const n = counts[g.id + ":" + o.key] || 0;
        if (!n) return;
        confirmDelete({
          icon: g.icon, title: `${g.title} — ${o.label}`, total: n,
          deletes: [o.words + ` (${n} টা)`], keeps: g.keep,
          word: "DELETE", providers: [o.refs]
        });
        return;
      }

      if (e.target.closest("#btnAll")) {
        let total = 0;
        const deletes = ALL_PARTS.map(p => {
          const n = counts[p.g + ":" + p.o] || 0; total += n;
          return `${p.label} — <b>${n}</b> টা`;
        });
        if (!total) return alert("মুছার মতো কোনো history নেই।");
        confirmDelete({
          icon: "🧹", title: "সব History Delete", total, deletes,
          keeps: "User account, balance, চালু Task, Pending Withdraw, Admin settings, Payment method setting।",
          word: "DELETE ALL", providers: ALL_PARTS.map(p => findOpt(p.g, p.o).refs)
        });
        return;
      }

      if (e.target.closest("#btnUsers")) {
        const n = counts["users"] || 0;
        if (!n) return alert("মুছার মতো কোনো user নেই।");
        confirmDelete({
          icon: "☠️", title: "সব User Delete", total: n,
          deletes: [`Admin ছাড়া সব user-এর account document (${n} জন)`],
          keeps: "Admin account, Task এবং অন্য সব history। (Firebase Authentication account আলাদা — Console থেকে মুছতে হবে)",
          word: "DELETE USERS", providers: [async () => (await nonAdminUserDocs()).map(d => d.ref)]
        });
      }
    });

    onAuthStateChanged(auth, async (user) => {
      if (!user) { location.href = "login.html"; return; }
      currentAdmin = user;
      try {
        const ok = await requireAdmin(user);
        if (!ok) return;
      } catch (e) { location.href = "dashboard.html"; return; }
      render();
      loadCounts();
    });
  </script>

</body>
</html>
