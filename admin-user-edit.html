<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>User Edit — Admin — ADQ Income Zone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
<script src="alerts.js"></script> <!-- ✅ Premium Alert System -->
<style>
:root{--bg:#06060f;--ink:#f4f4ff;--muted:#9a9bb8;--dim:#6f7090;--line:rgba(255,255,255,.09);--cyan:#22d3ee}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
html,body{background:var(--bg)!important}
body{font-family:'Hind Siliguri','Inter',system-ui,sans-serif!important;color:var(--ink);margin:0;padding:0!important;min-height:100vh;min-height:100dvh;overflow-x:hidden;position:relative}
a{text-decoration:none;color:inherit}button{font-family:inherit}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(90px);will-change:transform}
.orb.o1{width:420px;height:420px;background:#4f46e5;top:-140px;left:-120px;opacity:.5;animation:dr1 20s ease-in-out infinite}
.orb.o2{width:380px;height:380px;background:#9333ea;bottom:-160px;right:-120px;opacity:.42;animation:dr2 24s ease-in-out infinite}
@keyframes dr1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,40px) scale(1.1)}}
@keyframes dr2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-40px,-50px) scale(1.08)}}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 20%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 0%,#000 20%,transparent 70%)}
.top{position:sticky;top:0;z-index:50;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;background:rgba(6,6,15,.65);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border-bottom:1px solid var(--line)}
.top-in{max-width:520px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.mark{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#6366f1,#8b5cf6 55%,#22d3ee);color:#fff;font-family:'Inter';font-weight:900;font-size:16px;box-shadow:0 8px 20px -6px rgba(139,92,246,.8),inset 0 1px 0 rgba(255,255,255,.35)}
.ibtn{width:40px;height:40px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;flex:0 0 40px}
.ibtn:hover{color:#fff;background:rgba(255,255,255,.1)}
.ibtn.danger:hover{background:rgba(239,68,68,.18);border-color:rgba(239,68,68,.45)}
.ibtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.page{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:20px 16px calc(130px + env(safe-area-inset-bottom,0px))}
.sec{margin:26px 2px 12px;font-size:17px;font-weight:700;letter-spacing:-.2px;display:flex;align-items:center;justify-content:space-between}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.025));border:1px solid var(--line)}
.empty{text-align:center;padding:30px 16px;border-radius:22px;border:1.5px dashed rgba(255,255,255,.14);color:var(--muted);font-size:13.5px;font-weight:600}
.empty .em{font-size:30px;margin-bottom:6px}
.skel{height:92px;border-radius:22px;margin-bottom:10px;border:1px solid var(--line);background:linear-gradient(100deg,rgba(255,255,255,.04) 30%,rgba(255,255,255,.1) 50%,rgba(255,255,255,.04) 70%);background-size:200% 100%;animation:shim 1.4s infinite linear}
.skel.big{height:170px;border-radius:28px}
@keyframes shim{to{background-position:-200% 0}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.dock{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:calc(100% - 24px);max-width:500px;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:8px;background:rgba(18,18,40,.78);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);border:1px solid rgba(255,255,255,.12);border-radius:26px;box-shadow:0 20px 50px -10px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.1)}
.dock a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 6px;border-radius:18px;color:var(--dim);font-size:10.5px;font-weight:600;transition:.25s}
.dock a svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:.25s}
.dock a:hover{color:#fff}
.dock a.active{color:#fff;background:linear-gradient(135deg,rgba(99,102,241,.5),rgba(139,92,246,.35));box-shadow:inset 0 0 0 1px rgba(167,139,250,.5),0 8px 20px -8px rgba(139,92,246,.9)}
.dock a.active svg{transform:translateY(-1px) scale(1.08)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.orb,.skel{animation:none}}

.atag{font-style:normal;font-size:10px;font-weight:800;letter-spacing:.8px;color:#2a1700;background:linear-gradient(135deg,#fde68a,#f59e0b);padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:2px}
.top .mark{background:linear-gradient(135deg,#fbbf24,#f59e0b 55%,#d97706);color:#2a1700;box-shadow:0 8px 20px -6px rgba(245,158,11,.8),inset 0 1px 0 rgba(255,255,255,.4)}
.switch{position:relative;width:54px;height:30px;flex:0 0 54px;display:inline-block}
.switch input{opacity:0;width:0;height:0;position:absolute;margin:0}
.slider{position:absolute;inset:0;cursor:pointer;background:rgba(255,255,255,.14);border:1px solid var(--line);border-radius:30px;transition:.3s}
.slider::before{content:"";position:absolute;height:22px;width:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.3s;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.switch input:checked+.slider{background:linear-gradient(135deg,#10b981,#0d9488);border-color:transparent;box-shadow:0 0 18px -2px rgba(16,185,129,.8)}
.switch input:checked+.slider::before{transform:translateX(24px)}
.inp{display:block;width:100%;padding:15px 16px;margin:0 0 12px;border-radius:16px;border:1.5px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);font-family:inherit;font-size:15px;font-weight:500;outline:none;transition:.25s;color-scheme:dark}
.inp::placeholder{color:#6f7090;font-weight:400}
.inp:focus{border-color:rgba(139,92,246,.9);background:rgba(139,92,246,.08);box-shadow:0 0 0 4px rgba(139,92,246,.18)}
.inp:disabled{opacity:.55;cursor:not-allowed}
select.inp option{background:#12122a;color:#fff}
.lab{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:2px 2px 7px}
.acard{border-radius:26px;padding:20px;margin-bottom:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.acard h3{margin:0 0 6px;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px}
.acard .hi{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;background:rgba(99,102,241,.22)}
.acard .sub{margin:0 0 16px;font-size:12.5px;line-height:1.6;color:var(--muted)}
.cta.red{background:linear-gradient(135deg,#ef4444,#b91c1c);box-shadow:0 16px 32px -12px rgba(239,68,68,.9),inset 0 1px 0 rgba(255,255,255,.3)}
.cta.amber{background:linear-gradient(135deg,#fbbf24,#f59e0b 55%,#d97706);box-shadow:0 16px 34px -10px rgba(245,158,11,.9),inset 0 1px 0 rgba(255,255,255,.4);color:#2a1700}
.cta.outline{background:rgba(255,255,255,.05);border:1.5px solid rgba(139,92,246,.55);color:#c4b5fd;box-shadow:none}
.cta+.cta{margin-top:10px}
.tabs2{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px}
.tabs2::-webkit-scrollbar{display:none}
.tabs2 button{padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted);font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer;transition:.25s}
.tabs2 button:hover{color:#fff}
.tabs2 button.active{color:#fff;border-color:transparent;background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 10px 22px -8px rgba(139,92,246,.9)}
.page{max-width:640px}

.hero-u{position:relative;overflow:hidden;text-align:center;border-radius:28px;padding:26px 20px 22px;margin-bottom:14px}
.hero-u::before{content:'';position:absolute;top:-50%;left:-20%;width:90%;height:150%;background:radial-gradient(circle,rgba(139,92,246,.35),transparent 62%);pointer-events:none}
.hero-u>*{position:relative}
.big-av{width:92px;height:92px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:38px;font-family:'Inter';border:4px solid var(--bg)}
.big-av.admin{background:linear-gradient(135deg,#f87171,#b91c1c);box-shadow:0 0 0 3px rgba(239,68,68,.5),0 16px 36px -8px #ef4444}
.big-av.user{background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 0 0 3px rgba(139,92,246,.5),0 16px 36px -8px #8b5cf6}
.hero-u h2{margin:0 0 4px;font-size:22px;font-weight:700;word-break:break-word}
.hero-u p{margin:0;font-size:13px;color:var(--muted);word-break:break-all}
.role{display:inline-block;margin-top:10px;padding:4px 14px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase}
.role.admin{background:rgba(239,68,68,.2);color:#fca5a5}.role.user{background:rgba(99,102,241,.22);color:#c4b5fd}
.bprev{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:999px;font-size:11.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:#fff;box-shadow:0 10px 22px -8px currentColor}
.bwrap{margin-top:10px;min-height:28px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sw-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.sw{width:38px;height:38px;border-radius:12px;border:3px solid transparent;cursor:pointer;transition:.2s;box-shadow:0 8px 16px -6px rgba(0,0,0,.6)}
.sw:hover{transform:scale(1.1)}
.sw.on{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.2),0 8px 16px -6px rgba(0,0,0,.6)}
.stg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stt{padding:13px 12px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.stt .k{font-size:11.5px;color:var(--muted);font-weight:600}
.stt .v{font-family:'Inter';font-size:17px;font-weight:900;margin-top:4px}
.dz{border-radius:26px;padding:20px;margin-top:6px;margin-bottom:14px;border:1.5px dashed rgba(239,68,68,.55);background:linear-gradient(135deg,rgba(239,68,68,.14),rgba(239,68,68,.04))}
.dz h3{margin:0 0 6px;font-size:17px;color:#fca5a5;display:flex;align-items:center;gap:8px}
.dz-i{padding:13px 14px;border-radius:16px;background:rgba(0,0,0,.2);margin-top:12px}
.dz-i b{display:block;font-size:14px;margin-bottom:4px}
.dz-i p{margin:0 0 12px;font-size:12.5px;line-height:1.6;color:var(--text,#cfd0e6)}
.dz-i .ok{color:#6ee7b7}.dz-i .no{color:#fca5a5}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="orb o1"></div><div class="orb o2"></div><div class="grid"></div></div><header class="top"><div class="top-in"><button class="ibtn" onclick="goBack()" aria-label="Back"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button><div class="brand"><div class="mark">⚡</div><span>User Edit<em class="atag">ADMIN</em></span></div><div style="width:40px"></div></div></header>
<main class="page"><div id="content"><div class="skel big"></div><div class="skel"></div><div class="skel"></div></div></main>
<nav class="dock"><a href="dashboard.html" data-page="dash"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg><span>Dashboard</span></a><a href="index.html#tasks" data-page="submit"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg><span>Submit</span></a><a href="wallet.html" data-page="wallet"><svg viewBox="0 0 24 24"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></svg><span>Wallet</span></a><a href="task-history.html" data-page="history"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3"/></svg><span>History</span></a><a href="profile.html" data-page="profile"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Profile</span></a></nav>

<script type="module">
    import { auth, db } from "./firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { doc, getDoc, updateDoc, collection, query, where, getDocs, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    
    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    // ✅ 24 HOUR SESSION CHECK
    const SESSION_DURATION = 24 * 60 * 60 * 1000;
    async function requireAdmin(user) {
      const snap = await getDoc(doc(db, "users", user.uid));
      if (!snap.exists() || snap.data().role !== "admin") { 
        await window.showError("Admin ছাড়া এই পেজে ঢোকা যাবে না।"); 
        location.href = "dashboard.html"; 
        return null; 
      }
      const sessionTime = localStorage.getItem("admin_verified");
      if (!sessionTime || (Date.now() - parseInt(sessionTime)) > SESSION_DURATION) {
        sessionStorage.setItem("admin_return", location.pathname + location.search);
        localStorage.removeItem("admin_verified");
        location.href = "admin-login.html";
        return null;
      }
      return snap.data();
    }

    window.goBack = function() { location.href = "admin.html"; };

    const params = new URLSearchParams(location.search);
    const userId = params.get("id");
    let currentAdmin = null;
    const COLORS = ["#fbbf24", "#ef4444", "#10b981", "#6366f1", "#8b5cf6", "#ec4899", "#06b6d4", "#64748b"];

    onAuthStateChanged(auth, async (user) => {
      if (!user) { location.href = "login.html"; return; }
      currentAdmin = user;
      try {
        const ok = await requireAdmin(user);
        if (!ok) return;
      } catch (e) { location.href = "dashboard.html"; return; }

      if (!userId) {
        document.getElementById("content").innerHTML = `<div class="empty"><div class="em">❌</div>User ID নেই</div><button class="cta purple" style="margin-top:14px" onclick="goBack()">← Back</button>`;
        return;
      }
      loadUser();
    });

    async function batchDelete(refs) {
      let batch = writeBatch(db);
      let c = 0;
      for (const r of refs) {
        batch.delete(r);
        c++;
        if (c >= 400) { await batch.commit(); batch = writeBatch(db); c = 0; }
      }
      if (c > 0) await batch.commit();
    }

    async function loadUser() {
      try {
        const snap = await getDoc(doc(db, "users", userId));
        if (!snap.exists()) {
          document.getElementById("content").innerHTML = `<div class="empty"><div class="em">❌</div>User পাওয়া যায়নি</div><button class="cta purple" style="margin-top:14px" onclick="goBack()">← Back</button>`;
          return;
        }
        const targetUser = { id: userId, ...snap.data() };
        const role = targetUser.role === "admin" ? "admin" : "user";
        const curColor = targetUser.customBadgeColor || "#6366f1";

        document.getElementById("content").innerHTML = `
          <div class="hero-u glass">
            <div class="big-av ${role}">${esc((targetUser.username || "U").charAt(0).toUpperCase())}</div>
            <h2>${esc(targetUser.username || "User")}</h2>
            <p>${esc(targetUser.email || "")}</p>
            <span class="role ${role}">${role}</span>
            <div class="bwrap"><span class="bprev" id="badgePrev" style="background:${esc(curColor)};color:#fff;${targetUser.customBadge ? '' : 'display:none'}">🎖️ <span id="badgePrevTxt">${esc(targetUser.customBadge || '')}</span></span></div>
          </div>

          <div class="acard glass">
            <h3><span class="hi">📝</span>Basic Info</h3>
            <p class="sub">নাম ও role পরিবর্তন করো।</p>
            <label class="lab">Username</label>
            <input type="text" id="editUsername" class="inp" value="${esc(targetUser.username || '')}">
            <label class="lab">Email (read-only)</label>
            <input type="text" id="editEmail" class="inp" value="${esc(targetUser.email || '')}" disabled>
            <label class="lab">Role</label>
            <select id="editRole" class="inp">
              <option value="user" ${role !== 'admin' ? 'selected' : ''}>User</option>
              <option value="admin" ${role === 'admin' ? 'selected' : ''}>Admin</option>
            </select>
            <button class="cta purple" id="saveBasicBtn">💾 Save Basic Info</button>
          </div>

          <div class="acard glass">
            <h3><span class="hi" style="background:rgba(16,185,129,.22)">💰</span>Balance &amp; Stats</h3>
            <p class="sub">Balance ও Good/Bad/Pending সংখ্যা সরাসরি বদলানো যাবে।</p>
            <label class="lab">Balance (৳)</label>
            <input type="number" id="editBalance" class="inp" value="${targetUser.balance || 0}">
            <div class="g3">
              <div><label class="lab">✅ Good</label><input type="number" id="editGood" class="inp" value="${targetUser.totalGood || 0}"></div>
              <div><label class="lab">❌ Bad</label><input type="number" id="editBad" class="inp" value="${targetUser.totalBad || 0}"></div>
              <div><label class="lab">⏳ Pending</label><input type="number" id="editPending" class="inp" value="${targetUser.totalPending || 0}"></div>
            </div>
            <button class="cta green" id="saveBalanceBtn">💾 Save Balance</button>
          </div>

          <div class="acard glass">
            <h3><span class="hi" style="background:rgba(251,191,36,.22)">🎖️</span>Custom Badge</h3>
            <p class="sub">বিশেষ badge দাও (যেমন: CHAMPION, VIP, PRO)। নিচে live preview দেখবে।</p>
            <label class="lab">Badge Name</label>
            <input type="text" id="editBadgeName" class="inp" placeholder="যেমন: CHAMPION" value="${esc(targetUser.customBadge || '')}" maxlength="20">
            <label class="lab">Badge Color</label>
            <div class="sw-row" id="swRow">${COLORS.map(c => `<button type="button" class="sw ${c === curColor ? 'on' : ''}" data-color="${c}" style="background:${c}" aria-label="${c}"></button>`).join("")}</div>
            <input type="text" id="editBadgeColor" class="inp" placeholder="#6366f1" value="${esc(curColor)}">
            <button class="cta purple" id="saveBadgeBtn">🎖️ Save Badge</button>
            <button class="cta red" id="removeBadgeBtn">🗑️ Remove Badge</button>
          </div>

          <div class="acard glass">
            <h3><span class="hi" style="background:rgba(236,72,153,.22)">🎁</span>Custom Refer Commission</h3>
            <p class="sub">এই user-এর জন্য আলাদা refer commission। খালি রাখলে task-এর default প্রযোজ্য হবে।</p>
            <label class="lab">Override Refer Commission (৳ per good account)</label>
            <input type="number" id="editCustomReferCommission" class="inp" placeholder="খালি = default use করবে" step="0.01" min="0" value="${targetUser.customReferCommission !== null && targetUser.customReferCommission !== undefined ? targetUser.customReferCommission : ''}">
            <button class="cta purple" id="saveCustomReferBtn">💾 Save Custom Commission</button>
            <button class="cta outline" id="removeCustomReferBtn">✕ Remove Override</button>
          </div>

          <div class="acard glass">
            <h3><span class="hi" style="background:rgba(14,165,233,.22)">📊</span>Stats</h3>
            <p class="sub">এই user-এর সারসংক্ষেপ।</p>
            <div class="stg">
              <div class="stt"><div class="k">Total Submissions</div><div class="v" id="subCount">…</div></div>
              <div class="stt"><div class="k">Total Withdrawals</div><div class="v" id="wdCount">…</div></div>
              <div class="stt"><div class="k">Total Referrals</div><div class="v" id="refCount">${targetUser.referCount || 0}</div></div>
              <div class="stt"><div class="k">Refer Earning</div><div class="v" id="refEarning">৳${(targetUser.totalReferEarning || 0).toFixed(2)}</div></div>
            </div>
          </div>

          <div class="dz">
            <h3>⚠️ Danger Zone</h3>
            <p class="sub" style="margin:0">নিচের কাজগুলো undo হবে না। কোনটা কী মুছবে স্পষ্ট লেখা আছে।</p>
            <div class="dz-i">
              <b>🗑️ Delete All History</b>
              <p><span class="no">মুছবে:</span> শুধু এই user-এর সব Submission (Good, Bad, Pending)।<br><span class="ok">থাকবে:</span> User account, balance, withdraw history।</p>
              <button class="cta red" id="deleteHistoryBtn">🗑️ Delete All History</button>
            </div>
            <div class="dz-i">
              <b>☠️ Delete User</b>
              <p><span class="no">মুছবে:</span> User account + তার সব Submission + সব Withdraw record।<br><span class="ok">থাকবে:</span> অন্য user-দের data।</p>
              <button class="cta red" id="deleteUserBtn">☠️ Delete User</button>
            </div>
          </div>

          <button class="cta outline" onclick="goBack()">← Back to Admin</button>
        `;

        try {
          const q1 = query(collection(db, "submissions"), where("userId", "==", userId));
          const s1 = await getDocs(q1);
          document.getElementById("subCount").textContent = s1.size + " টা";
          const q2 = query(collection(db, "withdrawals"), where("userId", "==", userId));
          const s2 = await getDocs(q2);
          document.getElementById("wdCount").textContent = s2.size + " টা";
        } catch (e) {}

        // Save Basic Info
        document.getElementById("saveBasicBtn").onclick = async () => {
          const username = document.getElementById("editUsername").value.trim();
          const newRole = document.getElementById("editRole").value;
          if (!username) return window.showWarning("Username দাও!");
          if (userId === currentAdmin.uid && newRole !== "admin") return window.showWarning("নিজের role user করা যাবে না!");
          try {
            await updateDoc(doc(db, "users", userId), { username, role: newRole });
            window.showSuccess("✅ Basic Info Saved!");
          } catch (e) { window.showError("❌ " + e.message); }
        };

        // Save Balance
        document.getElementById("saveBalanceBtn").onclick = async () => {
          const balance = parseFloat(document.getElementById("editBalance").value) || 0;
          const totalGood = parseInt(document.getElementById("editGood").value) || 0;
          const totalBad = parseInt(document.getElementById("editBad").value) || 0;
          const totalPending = parseInt(document.getElementById("editPending").value) || 0;
          try {
            await updateDoc(doc(db, "users", userId), { balance, totalGood, totalBad, totalPending });
            window.showSuccess("✅ Balance & Stats Saved!");
          } catch (e) { window.showError("❌ " + e.message); }
        };

        // Badge live preview + color picker
        const prev = document.getElementById("badgePrev");
        const prevTxt = document.getElementById("badgePrevTxt");
        function syncPreview() {
          const name = document.getElementById("editBadgeName").value.trim().toUpperCase();
          const color = document.getElementById("editBadgeColor").value.trim() || "#6366f1";
          prev.style.display = name ? "inline-flex" : "none";
          prev.style.background = color;
          prevTxt.textContent = name;
        }
        document.querySelectorAll(".sw").forEach(btn => {
          btn.onclick = () => {
            document.getElementById("editBadgeColor").value = btn.dataset.color;
            document.querySelectorAll(".sw").forEach(b => b.classList.remove("on"));
            btn.classList.add("on");
            syncPreview();
          };
        });
        document.getElementById("editBadgeColor").oninput = () => {
          document.querySelectorAll(".sw").forEach(b => b.classList.remove("on"));
          syncPreview();
        };
        document.getElementById("editBadgeName").oninput = syncPreview;

        document.getElementById("saveBadgeBtn").onclick = async () => {
          const badgeName = document.getElementById("editBadgeName").value.trim().toUpperCase();
          const badgeColor = document.getElementById("editBadgeColor").value.trim() || "#6366f1";
          if (!badgeName) return window.showWarning("Badge name দাও!");
          try {
            await updateDoc(doc(db, "users", userId), { customBadge: badgeName, customBadgeColor: badgeColor });
            window.showSuccess("✅ Badge Saved!");
          } catch (e) { window.showError("❌ " + e.message); }
        };

        document.getElementById("removeBadgeBtn").onclick = async () => {
          if (!(await window.showCustomConfirm("Badge remove করবে?", { title: "Remove Badge" }))) return;
          try {
            await updateDoc(doc(db, "users", userId), { customBadge: null, customBadgeColor: null });
            window.showSuccess("✅ Badge Removed!");
            setTimeout(() => location.reload(), 1000);
          } catch (e) { window.showError("❌ " + e.message); }
        };

        // Custom Refer Commission
        document.getElementById("saveCustomReferBtn").onclick = async () => {
          const val = document.getElementById("editCustomReferCommission").value.trim();
          const customRef = val === "" ? null : parseFloat(val);
          if (customRef !== null && (isNaN(customRef) || customRef < 0)) return window.showWarning("সঠিক value দাও!");
          try {
            await updateDoc(doc(db, "users", userId), { customReferCommission: customRef });
            window.showSuccess("✅ Custom refer commission saved!");
          } catch (e) { window.showError("❌ " + e.message); }
        };

        document.getElementById("removeCustomReferBtn").onclick = async () => {
          try {
            await updateDoc(doc(db, "users", userId), { customReferCommission: null });
            document.getElementById("editCustomReferCommission").value = "";
            window.showSuccess("✅ Override removed! এখন task-এর default প্রযোজ্য।");
          } catch (e) { window.showError("❌ " + e.message); }
        };

        // Delete History (শুধু এই user-এর submissions)
        document.getElementById("deleteHistoryBtn").onclick = async () => {
          if (!(await window.showCustomConfirm("এই user-এর সব submission delete হবে। চালিয়ে যাবে?", { title: "Delete History" }))) return;
          if (!(await window.showCustomConfirm("💀 সত্যিই? Undo হবে না!", { title: "Final Warning", okText: "Yes, Delete", okClass: "adq-alert-btn-danger" }))) return;
          try {
            const s = await getDocs(query(collection(db, "submissions"), where("userId", "==", userId)));
            await batchDelete(s.docs.map(d => d.ref));
            window.showSuccess(`✅ ${s.size} টা submission delete হয়েছে!`);
            setTimeout(() => location.reload(), 1000);
          } catch (e) { window.showError("❌ " + e.message); }
        };

        // Delete User (user + submissions + withdrawals)
        document.getElementById("deleteUserBtn").onclick = async () => {
          if (userId === currentAdmin.uid) return window.showWarning("নিজেকে delete করা যাবে না!");
          if (!(await window.showCustomConfirm("সম্পূর্ণ user delete? (account + submissions + withdrawals)", { title: "Delete User", okClass: "adq-alert-btn-danger" }))) return;
          if (!(await window.showCustomConfirm("💀 সত্যিই? Undo হবে না!", { title: "Final Warning", okText: "Yes, Delete", okClass: "adq-alert-btn-danger" }))) return;
          try {
            const s1 = await getDocs(query(collection(db, "submissions"), where("userId", "==", userId)));
            await batchDelete(s1.docs.map(d => d.ref));
            const s2 = await getDocs(query(collection(db, "withdrawals"), where("userId", "==", userId)));
            await batchDelete(s2.docs.map(d => d.ref));
            await deleteDoc(doc(db, "users", userId));
            window.showSuccess("✅ User Deleted!");
            setTimeout(() => location.href = "admin.html", 1000);
          } catch (e) { window.showError("❌ " + e.message); }
        };
      } catch (e) {
        document.getElementById("content").innerHTML = `<div class="empty" style="color:#fca5a5">❌ ${esc(e.message)}</div><button class="cta purple" style="margin-top:14px" onclick="goBack()">← Back</button>`;
      }
    }
  </script>

</body>
</html>
