<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Edit — Admin</title>
  <link rel="stylesheet" href="style.css?v=22">
  <style>
    body { background: #f1f5f9; }
    .navbar { background: linear-gradient(135deg, #1e1b4b, #312e81); }
    .navbar .logo span { color: white; }
    .navbar .mark { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .big-avatar {
      width: 90px; height: 90px; border-radius: 50%;
      margin: 0 auto 14px;
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: 800; font-size: 36px;
    }
    .big-avatar.admin { background: linear-gradient(135deg, #ef4444, #dc2626); }
    .big-avatar.user { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
    .info-label {
      font-size: 11px; font-weight: 700; color: #64748b;
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 6px; display: block;
    }
    .info-value {
      font-size: 15px; color: #0f172a;
      font-weight: 600; margin-bottom: 14px;
      padding: 12px 14px; background: #f8fafc;
      border-radius: 10px; border: 1px solid #e2e8f0;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <button class="nav-back" onclick="goBack()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="logo">
      <div class="mark">⚡</div>
      <span>User Edit</span>
    </div>
    <div style="width:40px"></div>
  </div>

  <div class="container">
    <div id="content" class="loading"><div class="spinner"></div>লোড হচ্ছে...</div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { doc, getDoc, updateDoc, collection, query, where, getDocs, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    window.goBack = function() {
      location.href = "admin.html";
    };

    const params = new URLSearchParams(location.search);
    const userId = params.get("id");
    let currentAdmin = null;

    // ===== ADMIN SESSION CHECK (FIXED) =====
    // Session না থাকলে admin-login এ redirect, কিন্তু URL-এ session info pass করো
    const sessionTime = sessionStorage.getItem("admin_verified");
    if (!sessionTime) {
      // Silent redirect — no password prompt
      location.href = "admin-login.html";
    } else if ((Date.now() - parseInt(sessionTime)) > 30 * 60 * 1000) {
      sessionStorage.removeItem("admin_verified");
      location.href = "admin-login.html";
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) { location.href = "login.html"; return; }
      currentAdmin = user;

      // Verify admin role from Firestore
      try {
        const snap = await getDoc(doc(db, "users", user.uid));
        if (!snap.exists() || snap.data().role !== "admin") {
          alert("❌ Admin না!");
          location.href = "dashboard.html";
          return;
        }
      } catch (e) {
        location.href = "dashboard.html";
        return;
      }

      if (!userId) {
        document.getElementById("content").innerHTML = "<div class='card'><p>❌ User ID নেই</p><button class='btn btn-primary btn-full' onclick='goBack()'>← Back</button></div>";
        return;
      }
      loadUser();
    });

    async function loadUser() {
      try {
        const snap = await getDoc(doc(db, "users", userId));
        if (!snap.exists()) {
          document.getElementById("content").innerHTML = "<div class='card'><p>❌ User পাওয়া যায়নি</p><button class='btn btn-primary btn-full' onclick='goBack()'>← Back</button></div>";
          return;
        }
        const targetUser = { id: userId, ...snap.data() };

        document.getElementById("content").innerHTML = `
          <div class="card" style="text-align:center">
            <div class="big-avatar ${targetUser.role === 'admin' ? 'admin' : 'user'}">${(targetUser.username || "U").charAt(0).toUpperCase()}</div>
            <h2 style="font-size:20px;color:#0f172a;margin-bottom:4px">${targetUser.username || "User"}</h2>
            <p style="font-size:13px;color:#64748b">${targetUser.email || ""}</p>
            <div style="display:inline-block;background:${targetUser.role === 'admin' ? '#fee2e2' : '#eef2ff'};color:${targetUser.role === 'admin' ? '#991b1b' : '#4f46e5'};padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;margin-top:8px">${targetUser.role || 'user'}</div>
          </div>

          <div class="card">
            <h3 style="margin-bottom:16px">📝 Basic Info</h3>
            <label class="info-label">Username</label>
            <input type="text" id="editUsername" class="admin-input" value="${targetUser.username || ''}">

            <label class="info-label" style="margin-top:14px">Email (read-only)</label>
            <input type="text" id="editEmail" class="admin-input" value="${targetUser.email || ''}" disabled style="opacity:0.6">

            <label class="info-label" style="margin-top:14px">Role</label>
            <select id="editRole" class="admin-input">
              <option value="user" ${targetUser.role !== 'admin' ? 'selected' : ''}>User</option>
              <option value="admin" ${targetUser.role === 'admin' ? 'selected' : ''}>Admin</option>
            </select>

            <button class="btn btn-primary btn-full" id="saveBasicBtn" style="margin-top:14px">💾 Save</button>
          </div>

          <div class="card">
            <h3 style="margin-bottom:16px">💰 Balance & Stats</h3>
            <label class="info-label">Balance (৳)</label>
            <input type="number" id="editBalance" class="admin-input" value="${targetUser.balance || 0}">

            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px">
              <div><label class="info-label">✅ Good</label><input type="number" id="editGood" class="admin-input" value="${targetUser.totalGood || 0}"></div>
              <div><label class="info-label">❌ Bad</label><input type="number" id="editBad" class="admin-input" value="${targetUser.totalBad || 0}"></div>
              <div><label class="info-label">⏳ Pending</label><input type="number" id="editPending" class="admin-input" value="${targetUser.totalPending || 0}"></div>
            </div>

            <button class="btn btn-success btn-full" id="saveBalanceBtn" style="margin-top:14px">💾 Save Balance</button>
          </div>

          <div class="card">
            <h3 style="margin-bottom:16px">📊 Stats</h3>
            <label class="info-label">Total Submissions</label>
            <div class="info-value" id="subCount">Loading...</div>
            <label class="info-label">Total Withdrawals</label>
            <div class="info-value" id="wdCount">Loading...</div>
          </div>

          <div class="danger-card">
            <h3>⚠️ Danger Zone</h3>
            <p>এই user-এর সব data delete হবে — undo হবে না!</p>
            <button class="btn btn-danger btn-full" id="deleteHistoryBtn" style="margin-bottom:8px">🗑️ Delete All History</button>
            <button class="btn btn-danger btn-full" id="deleteUserBtn">☠️ Delete User</button>
          </div>

          <button class="btn btn-outline btn-full" onclick="goBack()" style="margin-top:16px">← Back to Admin</button>
        `;

        // Load counts
        try {
          const q1 = query(collection(db, "submissions"), where("userId", "==", userId));
          const s1 = await getDocs(q1);
          document.getElementById("subCount").textContent = s1.size + " টা";

          const q2 = query(collection(db, "withdrawals"), where("userId", "==", userId));
          const s2 = await getDocs(q2);
          document.getElementById("wdCount").textContent = s2.size + " টা";
        } catch (e) {}

        document.getElementById("saveBasicBtn").onclick = async () => {
          const username = document.getElementById("editUsername").value.trim();
          const role = document.getElementById("editRole").value;
          if (!username) return alert("Username দাও!");
          if (userId === currentAdmin.uid && role !== "admin") return alert("নিজের role user করা যাবে না!");
          try {
            await updateDoc(doc(db, "users", userId), { username, role });
            alert("✅ Saved!");
          } catch (e) { alert("❌ " + e.message); }
        };

        document.getElementById("saveBalanceBtn").onclick = async () => {
          const balance = parseFloat(document.getElementById("editBalance").value) || 0;
          const totalGood = parseInt(document.getElementById("editGood").value) || 0;
          const totalBad = parseInt(document.getElementById("editBad").value) || 0;
          const totalPending = parseInt(document.getElementById("editPending").value) || 0;
          try {
            await updateDoc(doc(db, "users", userId), { balance, totalGood, totalBad, totalPending });
            alert("✅ Saved!");
          } catch (e) { alert("❌ " + e.message); }
        };

        document.getElementById("deleteHistoryBtn").onclick = async () => {
          if (!confirm("সব submission delete?")) return;
          if (!confirm("💀 সত্যিই?")) return;
          try {
            const q = query(collection(db, "submissions"), where("userId", "==", userId));
            const s = await getDocs(q);
            let batch = writeBatch(db);
            let c = 0;
            for (const d of s.docs) {
              batch.delete(d.ref);
              c++;
              if (c >= 400) { await batch.commit(); batch = writeBatch(db); c = 0; }
            }
            if (c > 0) await batch.commit();
            alert(`✅ ${s.size} টা delete!`);
            location.reload();
          } catch (e) { alert("❌ " + e.message); }
        };

        document.getElementById("deleteUserBtn").onclick = async () => {
          if (userId === currentAdmin.uid) return alert("নিজেকে delete করা যাবে না!");
          if (!confirm("সম্পূর্ণ user delete?")) return;
          if (!confirm("💀 সত্যিই?")) return;
          try {
            const q1 = query(collection(db, "submissions"), where("userId", "==", userId));
            const s1 = await getDocs(q1);
            let b1 = writeBatch(db);
            let c1 = 0;
            for (const d of s1.docs) {
              b1.delete(d.ref);
              c1++;
              if (c1 >= 400) { await b1.commit(); b1 = writeBatch(db); c1 = 0; }
            }
            if (c1 > 0) await b1.commit();

            const q2 = query(collection(db, "withdrawals"), where("userId", "==", userId));
            const s2 = await getDocs(q2);
            let b2 = writeBatch(db);
            let c2 = 0;
            for (const d of s2.docs) {
              b2.delete(d.ref);
              c2++;
              if (c2 >= 400) { await b2.commit(); b2 = writeBatch(db); c2 = 0; }
            }
            if (c2 > 0) await b2.commit();

            await deleteDoc(doc(db, "users", userId));
            alert("✅ User deleted!");
            location.href = "admin.html";
          } catch (e) { alert("❌ " + e.message); }
        };
      } catch (e) {
        document.getElementById("content").innerHTML = `<div class="card" style="color:red"><p>❌ ${e.message}</p><button class="btn btn-primary btn-full" onclick="goBack()">← Back</button></div>`;
      }
    }
  </script>
</body>
</html>
