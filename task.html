<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>সাবমিট — ADQ Income Zone</title>
  <link rel="stylesheet" href="style.css?v=9">
  <style>
    .task-info-header {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white; padding: 22px; border-radius: 18px;
      margin-bottom: 16px;
      box-shadow: 0 12px 32px rgba(99,102,241,0.3);
      position: relative; overflow: hidden;
    }
    .task-info-header::before {
      content: ''; position: absolute;
      top: -50%; right: -30%; width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(255,255,255,0.15), transparent);
      border-radius: 50%;
    }
    .task-info-header .platform-tag {
      display: inline-block;
      background: rgba(255,255,255,0.2);
      padding: 4px 12px; border-radius: 20px;
      font-size: 12px; font-weight: 600; margin-bottom: 10px;
      position: relative;
    }
    .task-info-header h2 {
      font-size: 20px; margin-bottom: 8px; position: relative;
    }
    .task-info-header .price-big {
      font-size: 26px; font-weight: 800;
      font-family: 'Inter'; position: relative;
    }
    .task-info-header .time-info {
      font-size: 12px; opacity: 0.95;
      margin-top: 10px; position: relative;
      background: rgba(255,255,255,0.15);
      padding: 8px 12px; border-radius: 8px;
      display: inline-block;
    }
    .rules-box {
      background: linear-gradient(135deg, #fef3c7, #fde68a);
      border-left: 4px solid #f59e0b;
      padding: 14px 16px; border-radius: 12px;
      margin-bottom: 14px; font-size: 13px;
      color: #78350f; line-height: 1.6;
    }
    .rules-box b { color: #92400e; }
    .time-status {
      padding: 16px; border-radius: 14px;
      text-align: center; font-weight: 700;
      margin-bottom: 14px; font-size: 14px;
    }
    .time-status.open {
      background: linear-gradient(135deg, #d1fae5, #a7f3d0);
      color: #065f46;
      border: 2px solid #10b981;
    }
    .time-status.upcoming {
      background: linear-gradient(135deg, #fef3c7, #fde68a);
      color: #92400e;
      border: 2px solid #f59e0b;
    }
    .time-status.closed {
      background: linear-gradient(135deg, #fee2e2, #fecaca);
      color: #991b1b;
      border: 2px solid #ef4444;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <div class="logo">
      <div class="mark">A</div>
      <span>ADQ Income Zone</span>
    </div>
    <button class="nav-logout" id="logoutBtn" title="Logout">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </div>

  <div class="container">
    <div id="taskInfo" class="loading"><div class="spinner"></div>লোড হচ্ছে...</div>
    <div id="timeStatusBox"></div>

    <div id="singleSection" style="display:none">
      <div class="admin-form-card">
        <h3>📝 Single Submit</h3>
        <div id="dynamicFields"></div>
        <button class="btn btn-success btn-full" id="singleSubmitBtn">✅ Submit</button>
      </div>
    </div>

    <div class="admin-form-card" style="margin-top:16px" id="bulkSection">
      <h3>📋 Bulk Submit</h3>
      <div class="bulk-hint">
        <b>Format:</b> <span id="bulkFormatHint">UID | Password | 2FA</span><br>
        (প্রতি লাইনে একটা) — Google Sheet থেকে copy-paste
      </div>
      <textarea id="bulkInput" class="bulk-textarea" placeholder="Loading..."></textarea>
      <div id="bulkCount" class="bulk-count">📊 Detected: 0</div>
      <button class="btn btn-success btn-full" id="bulkSubmitBtn">🚀 Submit All</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" data-page="home"><span class="nav-ic"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span><span class="nav-label">Home</span></a>
    <a href="dashboard.html" data-page="dashboard"><span class="nav-ic"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg></span><span class="nav-label">Dashboard</span></a>
    <a href="index.html#tasks" data-page="submit" class="active"><span class="nav-ic"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></span><span class="nav-label">Submit</span></a>
    <a href="wallet.html" data-page="wallet"><span class="nav-ic"><svg viewBox="0 0 24 24"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></svg></span><span class="nav-label">Wallet</span></a>
    <a href="profile.html" data-page="profile"><span class="nav-ic"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><span class="nav-label">Profile</span></a>
  </nav>

  <script type="module">
    import { auth, db } from "./firebase.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { doc, getDoc, collection, addDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const params = new URLSearchParams(location.search);
    const taskId = params.get("id");
    let task = null, currentUser = null, isOpen = false;

    document.getElementById("logoutBtn").onclick = async () => {
      if (!confirm("লগআউট?")) return;
      await signOut(auth);
      location.href = "index.html";
    };

    onAuthStateChanged(auth, async (user) => {
      if (!user) { location.href = "login.html"; return; }
      currentUser = user;
      if (!taskId) {
        document.getElementById("taskInfo").innerHTML = "<p>❌ Task ID নেই</p>";
        return;
      }
      const snap = await getDoc(doc(db, "tasks", taskId));
      if (!snap.exists()) {
        document.getElementById("taskInfo").innerHTML = "<p>❌ Task পাওয়া যায়নি</p>";
        return;
      }
      task = snap.data();

      const icons = { Facebook: "📘", Twitter: "🐦", Instagram: "📷", LinkedIn: "💼", TikTok: "🎵", Gmail: "📧", WhatsApp: "💬", Other: "🔗" };
      const pIcon = icons[task.platform] || "🔗";

      const now = new Date();
      const start = task.startTime?.toDate?.();
      const end = task.endTime?.toDate?.();

      let timeStatus = "open";
      let statusMsg = "";
      if (start && end) {
        if (now < start) {
          timeStatus = "upcoming";
          statusMsg = `⏳ শুরু হবে: ${start.toLocaleString("bn-BD", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}`;
          isOpen = false;
        } else if (now > end) {
          timeStatus = "closed";
          statusMsg = `🔴 সময় শেষ হয়েছে: ${end.toLocaleString("bn-BD", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}`;
          isOpen = false;
        } else {
          timeStatus = "open";
          const timeLeft = Math.floor((end - now) / 1000);
          const hrs = Math.floor(timeLeft / 3600);
          const mins = Math.floor((timeLeft % 3600) / 60);
          statusMsg = `🟢 Submit Open! বাকি: ${hrs}ঘ ${mins}মি`;
          isOpen = true;
        }
      } else {
        isOpen = true;
        statusMsg = "🟢 Submit Open";
      }

      const startStr = start ? start.toLocaleString("bn-BD", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "";
      const endStr = end ? end.toLocaleString("bn-BD", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "";

      document.getElementById("taskInfo").innerHTML = `
        <div class="task-info-header">
          <div class="platform-tag">${pIcon} ${task.platform || "Task"}</div>
          <h2>${task.title}</h2>
          <div class="price-big">৳${task.pricePerAccount} <span style="font-size:13px;font-weight:500">/ account</span></div>
          ${start && end ? `<div class="time-info">⏰ ${startStr} → ${endStr}</div>` : ''}
        </div>
        ${task.rules ? `<div class="rules-box"><b>📋 Rules:</b><br>${task.rules}</div>` : ''}
      `;

      document.getElementById("timeStatusBox").innerHTML = `
        <div class="time-status ${timeStatus}">${statusMsg}</div>
      `;

      if (!isOpen) {
        document.getElementById("singleSection").style.display = "none";
        document.getElementById("bulkSection").style.display = "none";
        return;
      }

      const fields = task.fields || [
        { key: "uid", label: "UID" },
        { key: "password", label: "Password" },
        { key: "twoFA", label: "2FA Key" }
      ];

      document.getElementById("dynamicFields").innerHTML = fields.map(f => `
        <input type="text" id="dyn_${f.key}" class="admin-input" placeholder="${f.label}">
      `).join("");

      document.getElementById("singleSection").style.display = "block";

      document.getElementById("bulkFormatHint").textContent = fields.map(f => f.label).join(" | ");
      document.getElementById("bulkInput").placeholder = fields.map(f => `${f.label}`).join("\t");
    });

    function parseBulk(text) {
      if (!task) return [];
      const fields = task.fields || [{ key: "uid" }, { key: "password" }, { key: "twoFA" }];
      const fieldCount = fields.length;
      const lines = text.trim().split("\n");
      const result = [];
      for (const line of lines) {
        if (!line.trim()) continue;
        const parts = line.split(/[\t,|]+|\s{2,}/).map(p => p.trim()).filter(Boolean);
        if (parts.length >= fieldCount) {
          const item = {};
          fields.forEach((f, i) => { item[f.key] = parts[i] || ""; });
          result.push(item);
        }
      }
      return result;
    }

    document.getElementById("bulkInput").addEventListener("input", (e) => {
      const items = parseBulk(e.target.value);
      document.getElementById("bulkCount").textContent = `📊 Detected: ${items.length} accounts`;
    });

    document.getElementById("singleSubmitBtn").onclick = async () => {
      if (!task || !isOpen) return alert("সময় শেষ!");
      const fields = task.fields || [{ key: "uid" }, { key: "password" }, { key: "twoFA" }];
      const submission = {};
      for (const f of fields) {
        const val = document.getElementById(`dyn_${f.key}`).value.trim();
        if (!val) return alert(`${f.label || f.key} দাও!`);
        submission[f.key] = val;
      }

      const btn = document.getElementById("singleSubmitBtn");
      btn.disabled = true; btn.textContent = "Submitting...";
      try {
        await addDoc(collection(db, "submissions"), {
          taskId, taskTitle: task.title, taskPlatform: task.platform,
          userId: currentUser.uid, ...submission,
          status: "pending", price: task.pricePerAccount, earned: 0,
          submittedAt: new Date(), checkedAt: null
        });
        await updateDoc(doc(db, "users", currentUser.uid), { totalPending: increment(1) });
        alert("✅ Submit সফল! Status: ⏳ Pending");
        fields.forEach(f => { document.getElementById(`dyn_${f.key}`).value = ""; });
      } catch (e) { alert("❌ " + e.message); }
      btn.disabled = false; btn.textContent = "✅ Submit";
    };

    document.getElementById("bulkSubmitBtn").onclick = async () => {
      if (!task || !isOpen) return alert("সময় শেষ!");
      const text = document.getElementById("bulkInput").value;
      const items = parseBulk(text);
      const btn = document.getElementById("bulkSubmitBtn");

      if (items.length === 0) return alert("কোনো account পাওয়া যায়নি!");
      if (items.length > 500) return alert("সর্বোচ্চ ৫০০ account!");
      if (!confirm(`${items.length} টা account submit করবে?`)) return;

      btn.disabled = true; btn.textContent = `Submitting ${items.length}...`;
      let success = 0;
      try {
        for (const item of items) {
          await addDoc(collection(db, "submissions"), {
            taskId, taskTitle: task.title, taskPlatform: task.platform,
            userId: currentUser.uid, ...item,
            status: "pending", price: task.pricePerAccount, earned: 0,
            submittedAt: new Date(), checkedAt: null
          });
          success++;
        }
        await updateDoc(doc(db, "users", currentUser.uid), { totalPending: increment(success) });
        alert(`✅ ${success} টা submit সফল!`);
        document.getElementById("bulkInput").value = "";
        document.getElementById("bulkCount").textContent = "📊 Detected: 0 accounts";
      } catch (e) {
        alert(`❌ ${e.message}\n${success} টা submit হয়েছে।`);
      }
      btn.disabled = false; btn.textContent = "🚀 Submit All";
    };
  </script>
</body>
</html>
