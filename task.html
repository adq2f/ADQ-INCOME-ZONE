<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>সাবমিট — ADQ Income Zone</title>
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>

  <div class="navbar">
    <div class="logo">
      <div class="mark">A</div>
      <span>ADQ Income Zone</span>
    </div>
    <button class="nav-logout" id="logoutBtn" title="Logout">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </div>

  <div class="container">
    <div id="taskInfo" class="loading"><div class="spinner"></div>লোড হচ্ছে...</div>

    <div class="tabs">
      <button id="tabSingle" class="active">📝 Single Submit</button>
      <button id="tabBulk">📋 Bulk Submit</button>
    </div>

    <div id="singleSection" class="card">
      <h3>Submit One Account</h3>
      <input type="text" id="uid" class="admin-input" placeholder="Facebook UID">
      <input type="text" id="password" class="admin-input" placeholder="Password">
      <input type="text" id="twoFA" class="admin-input" placeholder="2FA Key">
      <button class="btn btn-success btn-full" id="singleSubmitBtn">✅ Submit</button>
    </div>

    <div id="bulkSection" class="card" style="display:none">
      <h3>Bulk Submit</h3>
      <div class="bulk-hint">
        Format: <b>UID | Password | 2FA</b> (প্রতি লাইনে একটা)<br>
        Google Sheet থেকে সরাসরি copy-paste করতে পারো
      </div>
      <textarea id="bulkInput" class="bulk-textarea" placeholder="100001	pass123	2FAKEY1
100002	pass456	2FAKEY2"></textarea>
      <div id="bulkCount" class="bulk-count">📊 Detected: 0 accounts</div>
      <button class="btn btn-success btn-full" id="bulkSubmitBtn">🚀 Submit All</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" data-page="home"><span class="nav-ic"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span><span class="nav-label">Home</span></a>
    <a href="dashboard.html" data-page="dashboard"><span class="nav-ic"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg></span><span class="nav-label">Dashboard</span></a>
    <a href="index.html#tasks" data-page="submit" class="active"><span class="nav-ic"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></span><span class="nav-label">Submit</span></a>
    <a href="wallet.html" data-page="wallet"><span class="nav-ic"><svg viewBox="0 0 24 24"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></svg></span><span class="nav-label">Wallet</span></a>
    <a href="profile.html" data-page="profile"><span class="nav-ic"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><span class="nav-label">Profile</span></a>
  </nav>

  <script type="module">
    import { auth, db } from "./firebase.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { doc, getDoc, collection, addDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    (function() {
      document.querySelectorAll('.bottom-nav a').forEach(a => {
        if (a.dataset.page === 'submit') a.classList.add('active');
      });
    })();

    const params = new URLSearchParams(location.search);
    const taskId = params.get("id");
    let task = null, currentUser = null;

    document.getElementById("logoutBtn").onclick = async () => {
      if (!confirm("লগআউট?")) return;
      await signOut(auth);
      location.href = "index.html";
    };

    document.getElementById("tabSingle").onclick = () => {
      document.getElementById("singleSection").style.display = "block";
      document.getElementById("bulkSection").style.display = "none";
      document.getElementById("tabSingle").classList.add("active");
      document.getElementById("tabBulk").classList.remove("active");
    };
    document.getElementById("tabBulk").onclick = () => {
      document.getElementById("singleSection").style.display = "none";
      document.getElementById("bulkSection").style.display = "block";
      document.getElementById("tabBulk").classList.add("active");
      document.getElementById("tabSingle").classList.remove("active");
    };

    onAuthStateChanged(auth, async (user) => {
      if (!user) { location.href = "login.html"; return; }
      currentUser = user;
      if (!taskId) {
        document.getElementById("taskInfo").innerHTML = "<p>❌ Task ID নেই</p>";
        return;
      }
      const snap = await getDoc(doc(db, "tasks", taskId));
      if (!snap.exists()) {
        document.getElementById("taskInfo").innerHTML = "<p>❌ Task পাওয়া যায়নি</p>";
        return;
      }
      task = snap.data();
      const isFB = /facebook|fb/i.test(task.title || "");
      const cls = isFB ? "task-card-logo" : "task-card-logo default";
      const txt = isFB ? "f" : (task.title || "T").charAt(0).toUpperCase();
      document.getElementById("taskInfo").innerHTML = `
        <div class="task-card" style="margin-bottom:16px">
          <div class="${cls}">${txt}</div>
          <div class="task-card-body">
            <h3>${task.title}</h3>
            <span class="price">৳${task.pricePerAccount}/account</span>
            <p>${task.description || ""}</p>
          </div>
        </div>
      `;
    });

    function parseBulk(text) {
      const lines = text.trim().split("\n");
      const result = [];
      for (const line of lines) {
        if (!line.trim()) continue;
        const parts = line.split(/[\t,|]+|\s{2,}/).map(p => p.trim()).filter(Boolean);
        if (parts.length >= 3) {
          result.push({ uid: parts[0], password: parts[1], twoFA: parts[2] });
        }
      }
      return result;
    }

    document.getElementById("bulkInput").addEventListener("input", (e) => {
      const items = parseBulk(e.target.value);
      document.getElementById("bulkCount").textContent = `📊 Detected: ${items.length} accounts`;
    });

    document.getElementById("singleSubmitBtn").onclick = async () => {
      const uid = document.getElementById("uid").value.trim();
      const password = document.getElementById("password").value.trim();
      const twoFA = document.getElementById("twoFA").value.trim();
      const btn = document.getElementById("singleSubmitBtn");

      if (!uid || !password || !twoFA) return alert("সব ঘর পূরণ করুন!");
      if (!task) return alert("Task load হয়নি!");

      btn.disabled = true; btn.textContent = "Submitting...";
      try {
        await addDoc(collection(db, "submissions"), {
          taskId, taskTitle: task.title, userId: currentUser.uid,
          uid, password, twoFA,
          status: "pending", price: task.pricePerAccount, earned: 0,
          submittedAt: new Date(), checkedAt: null
        });
        await updateDoc(doc(db, "users", currentUser.uid), {
          totalPending: increment(1)
        });
        alert("✅ Submit সফল! Status: ⏳ Pending");
        document.getElementById("uid").value = "";
        document.getElementById("password").value = "";
        document.getElementById("twoFA").value = "";
      } catch (e) { alert("❌ " + e.message); }
      btn.disabled = false; btn.textContent = "✅ Submit";
    };

    document.getElementById("bulkSubmitBtn").onclick = async () => {
      const text = document.getElementById("bulkInput").value;
      const items = parseBulk(text);
      const btn = document.getElementById("bulkSubmitBtn");

      if (items.length === 0) return alert("কোনো account পাওয়া যায়নি!");
      if (items.length > 500) return alert("সর্বোচ্চ ৫০০ account!");
      if (!task) return alert("Task load হয়নি!");
      if (!confirm(`${items.length} টা account submit করবে?`)) return;

      btn.disabled = true; btn.textContent = `Submitting ${items.length}...`;
      let success = 0;
      try {
        for (const item of items) {
          await addDoc(collection(db, "submissions"), {
            taskId, taskTitle: task.title, userId: currentUser.uid,
            uid: item.uid, password: item.password, twoFA: item.twoFA,
            status: "pending", price: task.pricePerAccount, earned: 0,
            submittedAt: new Date(), checkedAt: null
          });
          success++;
        }
        await updateDoc(doc(db, "users", currentUser.uid), {
          totalPending: increment(success)
        });
        alert(`✅ ${success} টা account submit সফল!`);
        document.getElementById("bulkInput").value = "";
        document.getElementById("bulkCount").textContent = "📊 Detected: 0 accounts";
      } catch (e) {
        alert(`❌ Error: ${e.message}\n${success} টা submit হয়েছে।`);
      }
      btn.disabled = false; btn.textContent = "🚀 Submit All";
    };
  </script>
</body>
</html>
