<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>সাবমিট — ADQ Income Zone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
<script src="app-shell.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#06060f;--ink:#f4f4ff;--muted:#9a9bb8;--dim:#6f7090;--line:rgba(255,255,255,.09);--cyan:#22d3ee}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
html,body{background:var(--bg)!important}
body{font-family:'Hind Siliguri','Inter',system-ui,sans-serif!important;color:var(--ink);margin:0;padding:0!important;height:100vh;height:100dvh;overflow:hidden;position:relative}
a{text-decoration:none;color:inherit}button{font-family:inherit}
svg{display:block}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(90px);will-change:transform}
.orb.o1{width:420px;height:420px;background:#4f46e5;top:-140px;left:-120px;opacity:.5;animation:dr1 20s ease-in-out infinite}
.orb.o2{width:380px;height:380px;background:#9333ea;bottom:-160px;right:-120px;opacity:.42;animation:dr2 24s ease-in-out infinite}
@keyframes dr1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,40px) scale(1.1)}}
@keyframes dr2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-40px,-50px) scale(1.08)}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes shim{to{background-position:-200% 0}}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 20%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 0%,#000 20%,transparent 70%)}

/* FIXED LAYOUT */
.page-wrapper{position:relative;z-index:1;height:100vh;height:100dvh;max-width:520px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}

/* HEADER */
.top{flex:0 0 auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;background:rgba(6,6,15,.7);backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.mark{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#6366f1,#8b5cf6 55%,#22d3ee);color:#fff;font-family:'Inter';font-weight:900;font-size:14px;box-shadow:0 8px 20px -6px rgba(139,92,246,.8),inset 0 1px 0 rgba(255,255,255,.35)}
.ibtn{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;flex:0 0 36px}
.ibtn:hover{color:#fff;background:rgba(255,255,255,.1)}
.ibtn.danger:hover{background:rgba(239,68,68,.18);border-color:rgba(239,68,68,.45)}
.ibtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* SCROLLABLE CONTENT */
.content{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:12px 14px calc(150px + env(safe-area-inset-bottom,0px));scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.025));border:1px solid var(--line)}
.empty{text-align:center;padding:26px 16px;border-radius:20px;border:1.5px dashed rgba(255,255,255,.14);color:var(--muted);font-size:13.5px;font-weight:600}
.skel{height:76px;border-radius:20px;border:1px solid var(--line);background:linear-gradient(100deg,rgba(255,255,255,.04) 30%,rgba(255,255,255,.1) 50%,rgba(255,255,255,.04) 70%);background-size:200% 100%;animation:shim 1.4s infinite linear}

/* TASK HEADER CARD */
.hd{display:flex;align-items:center;gap:12px;padding:14px;border-radius:22px;margin-bottom:12px;background:linear-gradient(135deg,rgba(67,56,202,.55),rgba(124,58,237,.4) 55%,rgba(192,38,211,.3));border:1px solid rgba(255,255,255,.16);box-shadow:0 18px 40px -20px rgba(124,58,237,.9),inset 0 1px 0 rgba(255,255,255,.2);animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
.hd-logo{width:46px;height:46px;flex:0 0 46px;border-radius:15px;padding:10px;box-shadow:0 10px 22px -8px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.3)}
.hd-logo svg{width:100%;height:100%}
.hd-main{flex:1;min-width:0}
.hd-title{font-size:15px;font-weight:700;line-height:1.3;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hd-sub{display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap}
.pr{font-family:'Inter';font-size:13px;font-weight:900;color:#fde68a}
.pr small{font-family:'Hind Siliguri';font-weight:600;font-size:11px;color:rgba(255,255,255,.75);margin-left:2px}
.pl{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff}

/* TIMER */
.hd-time{flex:0 0 auto;text-align:center;padding:8px 12px;border-radius:14px;min-width:85px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.12)}
.hd-time .t{font-family:'Inter';font-size:15px;font-weight:900;line-height:1.1;color:#6ee7b7;white-space:nowrap;font-variant-numeric:tabular-nums}
.hd-time .l{font-size:10.5px;font-weight:700;color:var(--muted);margin-top:3px}
.hd-time.upcoming .t{color:#fcd34d}
.hd-time.closed .t{color:#fca5a5}
.hd-time.open{border-color:rgba(16,185,129,.4);box-shadow:0 0 15px rgba(16,185,129,.2)}
.hd-time.upcoming{border-color:rgba(245,158,11,.45)}
.hd-time.closed{border-color:rgba(239,68,68,.45)}

/* RULES ACCORDION */
.acc{border-radius:18px;margin-bottom:12px;overflow:hidden;background:linear-gradient(135deg,rgba(251,191,36,.12),rgba(245,158,11,.03));border:1px solid rgba(251,191,36,.32)}
.acc summary{list-style:none;display:flex;align-items:center;gap:9px;padding:12px 14px;cursor:pointer;font-size:13.5px;font-weight:700;color:#fde68a;user-select:none}
.acc summary::-webkit-details-marker{display:none}
.acc summary svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 17px}
.acc summary .sm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc summary .hint{font-size:11px;font-weight:600;color:rgba(253,230,138,.7);margin-left:auto}
.acc summary .chev{width:8px;height:8px;border-right:2px solid #fde68a;border-bottom:2px solid #fde68a;transform:rotate(45deg);transition:.25s;flex:0 0 8px;margin:-3px 2px 0 4px}
.acc[open] summary .chev{transform:rotate(-135deg);margin-top:3px}
.acc-body{padding:0 14px 14px;font-size:13px;line-height:1.65;color:#fde9a8;word-break:break-word}
.acc-body .rl{margin-bottom:8px}
.acc-body ul{margin:0;padding-left:18px;color:#bae6fd}
.acc-body .tm{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:12px;font-weight:600;color:var(--muted)}
.acc-body .tm svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* TABS */
.tab-bar{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:12px;padding:4px;background:rgba(255,255,255,.04);border-radius:16px;border:1px solid var(--line)}
.tab-btn{display:flex;align-items:center;justify-content:center;gap:7px;padding:10px 4px;border-radius:12px;border:none;background:transparent;color:var(--muted);font-size:12.5px;font-weight:700;cursor:pointer;transition:.25s;white-space:nowrap}
.tab-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 16px}
.tab-btn:hover{color:#fff;background:rgba(255,255,255,.06)}
.tab-btn.active{color:#fff;background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 10px 22px -8px rgba(139,92,246,.9),inset 0 1px 0 rgba(255,255,255,.3)}
.tab-content{display:none}
.tab-content.active{display:block;animation:rise .3s ease both}
.locked .tab-content{opacity:.45;pointer-events:none;filter:grayscale(.4)}

/* FORM AREA */
.fc{border-radius:22px;padding:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);margin-bottom:10px}
.fc-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;font-size:13px;font-weight:700;color:var(--muted)}
.fc-h b{color:#fff;font-size:14px}
.fmt{font-size:11px;font-weight:700;color:#c4b5fd;background:rgba(99,102,241,.18);padding:3px 9px;border-radius:999px;max-width:62%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inp{display:block;width:100%;padding:13px 14px;margin:0 0 10px;border-radius:14px;border:1.5px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);font-family:inherit;font-size:14.5px;font-weight:500;outline:none;transition:.25s}
.inp::placeholder{color:#6f7090;font-weight:400}
.inp:focus{border-color:rgba(139,92,246,.9);background:rgba(139,92,246,.08);box-shadow:0 0 0 4px rgba(139,92,246,.18)}
textarea.inp{height:140px;min-height:100px;font-family:'Courier New',monospace;font-size:13px;line-height:1.55;resize:vertical;margin-bottom:6px}
.dup{display:none;background:rgba(239,68,68,.14);border:1px solid rgba(239,68,68,.4);color:#fca5a5;padding:9px 12px;border-radius:12px;margin-bottom:8px;font-size:12.5px;font-weight:700;word-break:break-word}

/* STATS & CHIPS */
.statrow{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:999px;white-space:nowrap}
.chip.g{background:rgba(16,185,129,.16);color:#6ee7b7}
.chip.r{background:rgba(239,68,68,.16);color:#fca5a5}
.chip.y{background:rgba(245,158,11,.16);color:#fcd34d}
.chip.n{background:rgba(255,255,255,.07);color:var(--muted)}
.lnks{display:flex;gap:6px;flex:0 0 auto}
.lnk{border:1px solid var(--line);background:rgba(255,255,255,.05);color:#c4b5fd;padding:6px 12px;border-radius:10px;font-size:11.5px;font-weight:700;cursor:pointer;transition:.2s}
.lnk:hover{background:rgba(255,255,255,.1);color:#fff}
.lnk.red{color:#fca5a5}

/* PREVIEW */
.bprev{display:none;max-height:150px;overflow-y:auto;padding:10px;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid var(--line);font-family:'Courier New',monospace;font-size:11.5px;line-height:1.55;margin-top:10px}
.bprev.open{display:block}
.bprev .row{padding:5px 9px;border-radius:8px;margin-bottom:3px;word-break:break-all}
.bprev .row.ok{background:rgba(16,185,129,.14);color:#6ee7b7}
.bprev .row.duplicate{background:rgba(239,68,68,.14);color:#fca5a5}
.bprev .row.warn{background:rgba(245,158,11,.14);color:#fcd34d}
.bprev .row.more{background:rgba(255,255,255,.06);color:var(--muted);text-align:center}

/* PROGRESS BAR */
.prog{display:none;padding:12px;border-radius:14px;margin-top:10px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.prog.show{display:block}
.prog .t{font-size:13px;font-weight:700;color:#c4b5fd}
.pbar{height:8px;border-radius:8px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:8px}
.pfill{height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#6366f1,#22d3ee);transition:width .3s}

/* FILE DROP */
.drop-zone{display:flex;align-items:center;gap:12px;border:2px dashed rgba(139,92,246,.5);border-radius:16px;padding:14px;text-align:left;transition:.3s;cursor:pointer;background:rgba(139,92,246,.06);margin-bottom:10px}
.drop-zone:hover,.drop-zone.dragover{border-color:rgba(139,92,246,.9);background:rgba(139,92,246,.15)}
.drop-zone .dz-ic{width:44px;height:44px;flex:0 0 44px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 10px 22px -8px rgba(139,92,246,.9)}
.drop-zone .dz-ic svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.drop-zone h4{margin:0 0 2px;font-size:14px;font-weight:700;color:#fff}
.drop-zone p{margin:0;font-size:11.5px;color:var(--muted);line-height:1.5}
.drop-zone input[type="file"]{display:none}
.file-info{display:none;white-space:pre-line;padding:10px 12px;border-radius:12px;background:rgba(16,185,129,.14);border:1px solid rgba(16,185,129,.4);margin-bottom:10px;font-size:12.5px;line-height:1.55;color:#6ee7b7;font-weight:600;word-break:break-word}
.file-info.show{display:block}

/* FIXED SUBMIT BAR */
.sbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 82px);width:calc(100% - 24px);max-width:496px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px 10px 18px;background:rgba(18,18,42,.94);backdrop-filter:blur(24px) saturate(170%);border:1.5px solid rgba(139,92,246,.6);border-radius:20px;box-shadow:0 20px 50px -10px rgba(0,0,0,.85),0 0 25px rgba(139,92,246,.3);z-index:58}
.sb-info{font-size:12.5px;font-weight:700;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-info b{font-family:'Inter';font-size:15px;color:#fff;margin:0 3px}
.sb-btn{display:flex;align-items:center;gap:8px;padding:12px 22px;border-radius:14px;border:none;font-size:14.5px;font-weight:800;color:#fff;background:linear-gradient(135deg,#10b981,#0d9488);cursor:pointer;box-shadow:0 10px 24px -8px rgba(16,185,129,.9),inset 0 1px 0 rgba(255,255,255,.3);transition:.2s;white-space:nowrap}
.sb-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.sb-btn:hover:not(:disabled){transform:translateY(-2px)}
.sb-btn:disabled{background:rgba(255,255,255,.1);color:var(--dim);box-shadow:none;cursor:not-allowed}

.closed-box{border-radius:20px;padding:18px;text-align:center;border:1.5px dashed rgba(239,68,68,.5);background:rgba(239,68,68,.08);margin-top:10px}
.closed-box h3{margin:0 0 4px;font-size:16px;color:#fca5a5}
.closed-box p{margin:0;font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="orb o1"></div><div class="orb o2"></div><div class="grid"></div></div>

<div class="page-wrapper">
  <!-- Header -->
  <header class="top">
    <div class="top-in">
      <button class="ibtn" onclick="history.back()" aria-label="Back">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="brand"><div class="mark">A</div><span>Submit Task</span></div>
      <button class="ibtn danger" id="logoutBtn" aria-label="Logout">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </header>

  <!-- Scrollable Content -->
  <main class="content">
    <div id="taskInfo"><div class="skel"></div></div>
    <div id="rulesWrap"></div>

    <div id="submitSections" class="locked">
      <div class="tab-bar" role="tablist">
        <button type="button" class="tab-btn active" data-tab="single" role="tab" aria-selected="true">
          <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span>Single Submit</span>
        </button>
        <button type="button" class="tab-btn" data-tab="file" role="tab" aria-selected="false">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><span>File Submit</span>
        </button>
      </div>

      <!-- Single Submit -->
      <div id="tab-single" class="tab-content active">
        <div class="fc glass">
          <div class="fc-h"><b>Single Submit</b><span class="fmt" id="singleFmt"></span></div>
          <div id="dynamicFields"></div>
          <div class="dup" id="singleDupWarning">Duplicate Detect হয়েছে! <span id="singleDupMsg"></span></div>
          <button class="hidden-btn" id="singleSubmitBtn" style="display:none;">Submit</button>
        </div>
      </div>

      <!-- File Submit -->
      <div id="tab-file" class="tab-content">
        <div class="fc glass">
          <div class="fc-h"><b>File Submit</b><span class="fmt" id="fileFormatHint">—</span></div>
          <div class="drop-zone" id="dropZone" tabindex="0" role="button" aria-label="ফাইল নির্বাচন করুন">
            <input type="file" id="fileInput" accept=".xlsx,.xls,.csv,.txt,.tsv">
            <div class="dz-ic"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div>
            <div><h4>ফাইল সিলেক্ট বা ড্রপ করুন</h4><p>.xlsx .xls .csv .txt .tsv — প্রতি রো = ১ অ্যাকাউন্ট</p></div>
          </div>
          <div class="file-info" id="fileInfo"></div>
          <div class="statrow">
            <div class="chips" id="fileChips"></div>
            <div class="lnks">
              <button type="button" class="lnk" id="togglePrevFile">বিস্তারিত</button>
              <button type="button" class="lnk red" id="clearFileBtn">মুছুন</button>
            </div>
          </div>
          <div class="bprev" id="filePreview"></div>
          <div class="prog" id="fileSubmitProgress">
            <div class="t" id="fspText">Submitting 0/0...</div>
            <div class="pbar"><div class="pfill" id="fspFill"></div></div>
          </div>
          <button class="hidden-btn" id="fileSubmitBtn" style="display:none;" disabled>Submit</button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Sticky Action Bar -->
<div class="sbar" id="sbar">
  <div class="sb-info" id="sbInfo">—</div>
  <button class="sb-btn" id="sbBtn" disabled>
    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg><span>Submit</span>
  </button>
</div>

  <script type="module">

function colName(i) { return i < 26 ? String.fromCharCode(65 + i) : "#" + (i + 1); }

function rowKey(item, cells) {
  if (Array.isArray(task?.dupKeys) && task.dupKeys.length) {
    const v = task.dupKeys.map(k => norm(item?.[k]));
    return v.some(Boolean) ? v.join("\u00a7") : "";
  }
  const arr = (Array.isArray(cells) && cells.length) ? cells : getFields().map(f => item?.[f.key]);
  const vals = arr.map(norm);
  while (vals.length && !vals[vals.length - 1]) vals.pop();
  return vals.some(Boolean) ? vals.join("\u00a7") : "";
}

async function loadExisting() {
  const snap = await getDocs(query(collection(db, "submissions"), where("taskId", "==", taskId)));
  const set = new Set();
  snap.forEach(d => { const x = d.data(); const k = rowKey(x, x.allCells); if (k) set.add(k); });
  existingValues = set;
}

function analyze(rows) {
  const seen = new Map();
  return rows.map(r => {
    const key = rowKey(r.item, r.cells);
    let status = "ok", dupOf = "";
    if (key && existingValues.has(key)) status = "dup-old";
    else if (key && seen.has(key)) { status = "dup-file"; dupOf = seen.get(key); }
    else if (key) seen.set(key, r.label);
    return { ...r, status, dupOf };
  });
}

function dupText(r) {
  return r.status === "dup-old"
    ? "পুরো রো আগেই submit হয়েছে"
    : `রো ${r.dupOf}-এর সাথে পুরো একই`;
}

/* ============ LIVE TIMER LOGIC ============ */
function startCountdown() {
  updateCountdown();
  if (countdownInterval) clearInterval(countdownInterval);
  countdownInterval = setInterval(updateCountdown, 1000);
}

function fmtMs(ms) {
  const total = Math.max(0, Math.floor(ms / 1000));
  const d = Math.floor(total / 86400);
  const h = Math.floor((total % 86400) / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  const p = n => String(n).padStart(2, "0");
  if (d > 0) return `${d}d ${p(h)}:${p(m)}:${p(s)}`;
  return `${p(h)}:${p(m)}:${p(s)}`;
}

function setTime(cls, t, l) {
  const box = $("hdTime");
  if (!box) return;
  box.className = "hd-time " + cls;
  $("hdT").textContent = t;
  $("hdL").textContent = l;
}

function updateCountdown() {
  const now = new Date();
  const sections = $("submitSections");

  if (!taskStartTime || !taskEndTime) {
    isOpen = true;
    setTime("open", "Open", "খোলা আছে");
    sections.classList.remove("locked");
    return;
  }
  if (now < taskStartTime) {
    isOpen = false;
    setTime("upcoming", fmtMs(taskStartTime - now), "শুরু হতে");
    sections.classList.add("locked");
    return;
  }
  if (now > taskEndTime) {
    isOpen = false;
    setTime("closed", "শেষ", "সময় শেষ");
    sections.classList.add("locked");
    if (!$("closedOverlay")) {
      const o = document.createElement("div");
      o.id = "closedOverlay";
      o.className = "closed-box";
      o.innerHTML = `<h3>Submission Closed</h3><p>সময় শেষ। পরের Task-এর জন্য অপেক্ষা করুন।</p>`;
      document.querySelector(".content").appendChild(o);
    }
    return;
  }

  isOpen = true;
  const diff = taskEndTime - now;
  const isDanger = diff <= 5 * 60 * 1000;
  setTime(isDanger ? "closed" : "open", fmtMs(diff), isDanger ? "প্রায় শেষ!" : "বাকি");
  sections.classList.remove("locked");
  const o = $("closedOverlay");
  if (o) o.remove();
}

function verifyTime() {
  if (!task) { alert("Task এখনো load হয়নি!"); return false; }
  const now = new Date();
  if (taskStartTime && now < taskStartTime) { alert("এখনো শুরু হয়নি!"); return false; }
  if (taskEndTime && now > taskEndTime) { alert("সময় শেষ!"); updateCountdown(); return false; }
  return true;
}

/* ============ Smart split ============ */
function isSpaceProneField(field) {
  const key = String(field?.key || "").toLowerCase();
  const label = String(field?.label || "").toLowerCase();
  const raw = key + " " + label;
  const compact = raw.replace(/[\s_\-.:]+/g, "");

  if (!/2fast|2face/.test(compact)) {
    if (compact.includes("2fa")) return true;
    if (compact.includes("twofa")) return true;
    if (compact.includes("twofactor")) return true;
    if (compact.includes("2factor")) return true;
    if (compact.includes("2step") || compact.includes("twostep")) return true;
    if (compact.includes("totp")) return true;
    if (compact.includes("authenticator")) return true;
    if (compact.includes("otp")) return true;
    if (/2f$/.test(compact)) return true;
  }
  if (compact.includes("token")) return true;
  if (compact.includes("cookie")) return true;
  if (compact.includes("session")) return true;
  if (compact.includes("backupcode")) return true;
  return false;
}

// Part 3 will start from here
  function mergeParts(parts, fields, joinChar) {
  const cols = fields.length;
  if (cols < 1 || parts.length <= cols) return parts;

  const spaceProneIdxs = [];
  fields.forEach((f, i) => { if (isSpaceProneField(f)) spaceProneIdxs.push(i); });

  let targetIdx = spaceProneIdxs.length > 0
    ? spaceProneIdxs[spaceProneIdxs.length - 1]
    : cols - 1;
  if (targetIdx >= cols) targetIdx = cols - 1;

  const beforeCount = targetIdx;
  const afterCount = cols - 1 - targetIdx;

  if (afterCount === 0) {
    const head = parts.slice(0, beforeCount);
    const tail = parts.slice(beforeCount).join(joinChar);
    return [...head, tail];
  }
  const before = parts.slice(0, beforeCount);
  const after = parts.slice(parts.length - afterCount);
  const middle = parts.slice(beforeCount, parts.length - afterCount).join(joinChar);
  return [...before, middle, ...after];
}

function splitLine(line, expectedCols) {
  const cols = Math.max(1, expectedCols || (getFields().length || 3));
  const fields = getFields();

  let delim, type;
  if (line.includes("\t"))        { delim = "\t";    type = "strong"; }
  else if (line.includes("|"))    { delim = "|";     type = "strong"; }
  else if (line.includes(","))    { delim = ",";     type = "strong"; }
  else if (/\s{2,}/.test(line))   { delim = /\s{2,}/; type = "multi-space"; }
  else                            { delim = /\s+/;   type = "single-space"; }

  let parts = line.split(delim).map(p => String(p ?? "").trim());

  if (type === "multi-space" && parts.length < cols) {
    parts = line.trim().split(/\s+/).map(p => String(p ?? "").trim());
    type = "single-space";
  }
  if (parts.length > cols) {
    const joinChar = (type === "strong") ? String(delim) : " ";
    parts = mergeParts(parts, fields, joinChar);
  }
  return parts;
}

function buildRow(cells, label, strict = true) {
  cells = cells.map(c => String(c ?? "").trim());
  const fields = getFields();
  const item = {};
  const missing = [];
  fields.forEach((f, i) => {
    item[f.key] = cells[i] || "";
    if (!item[f.key] && !f.optional) missing.push(f.label || f.key);
  });
  if (strict && missing.length) return { ok: false, reason: `${missing.join(", ")} নেই` };
  while (cells.length && !cells[cells.length - 1]) cells.pop();
  const clean = cells.slice(0, 40).map(c => c.slice(0, 300));
  return { ok: true, row: { label: String(label), item, cells: clean } };
}

/* ============ Compact stats + collapsible preview ============ */
function renderChips(el, analyzed, incomplete) {
  if (!analyzed.length && !incomplete.length) { el.innerHTML = ""; return; }
  const ok = analyzed.filter(r => r.status === "ok").length;
  const dup = analyzed.length - ok;
  let h = `<span class="chip g">${ok} unique</span>`;
  if (dup) h += `<span class="chip r">${dup} duplicate</span>`;
  if (incomplete.length) h += `<span class="chip y">${incomplete.length} অসম্পূর্ণ</span>`;
  h += `<span class="chip n">মোট ${analyzed.length}</span>`;
  el.innerHTML = h;
}

function renderPreview(el, analyzed, incomplete) {
  if (!analyzed.length && !incomplete.length) { el.innerHTML = ""; el.classList.remove("open"); return; }
  const fields = getFields();
  const PREVIEW_LIMIT = 50;
  let html = "";
  analyzed.slice(0, PREVIEW_LIMIT).forEach(r => {
    const lbl = fields.map(f => esc(r.item[f.key])).join(" | ");
    const bad = r.status !== "ok";
    html += `<div class="row ${bad ? "duplicate" : "ok"}">${esc(r.label)}. ${lbl}${bad ? ` — ${esc(dupText(r))}` : ""}</div>`;
  });
  if (analyzed.length > PREVIEW_LIMIT) {
    html += `<div class="row more">প্রথম ${PREVIEW_LIMIT} টা দেখানো হচ্ছে (মোট ${analyzed.length} টা submit হবে)</div>`;
  }
  incomplete.slice(0, 25).forEach(x => {
    html += `<div class="row warn">${esc(x.label)}. ${esc(x.reason)} — বাদ</div>`;
  });
  el.innerHTML = html;
}

$("togglePrevFile").onclick = () => $("filePreview").classList.toggle("open");

function buildPayload(r, source) {
  const fallbackUid = r.item.uid || r.item[Object.keys(r.item)[0]] || (r.cells && r.cells[0]) || "";
  return {
    ...r.item,
    uid: fallbackUid,
    allCells: r.cells,
    taskId,
    taskTitle: task.title ?? "",
    taskPlatform: task.platform ?? "",
    userId: currentUser.uid,
    source,
    status: "pending",
    price: task.pricePerAccount ?? 0,
    earned: 0,
    submittedAt: new Date(),
    checkedAt: null
  };
}

async function commitRows(rows, source, onProgress) {
  const userRef = doc(db, "users", currentUser.uid);
  let success = 0;
  try {
    for (let i = 0; i < rows.length; i += BATCH_SIZE) {
      const chunk = rows.slice(i, i + BATCH_SIZE);
      const batch = writeBatch(db);
      chunk.forEach(r => batch.set(doc(collection(db, "submissions")), buildPayload(r, source)));
      batch.update(userRef, { totalPending: increment(chunk.length) });
      await batch.commit();
      success += chunk.length;
      chunk.forEach(r => { const k = rowKey(r.item, r.cells); if (k) existingValues.add(k); });
      onProgress(success, rows.length);
    }
    return { success, error: null };
  } catch (error) {
    return { success, error };
  }
}

async function runSubmit(rows, source, ui) {
  if (busy) return;
  if (!verifyTime()) return;
  if (!rows.length) return alert("কোনো account নেই!");

  busy = true;
  ui.btn.disabled = true;
  syncBar();
  try {
    ui.prog.classList.add("show");
    ui.text.textContent = "Duplicate চেক হচ্ছে...";
    ui.fill.style.width = "8%";

    try { await loadExisting(); }
    catch (e) {
      alert("Duplicate চেক করা যায়নি: " + e.message + "\nইন্টারনেট চেক করে আবার চেষ্টা করুন।");
      ui.prog.classList.remove("show");
      return;
    }

    const res = analyze(rows);
    const ok = res.filter(r => r.status === "ok");
    const bad = res.length - ok.length;
    ui.refresh();

    if (!ok.length) {
      alert(`সব account duplicate! (${bad} টা বাদ)`);
      ui.prog.classList.remove("show");
      return;
    }
    const skipMsg = bad ? `\n${bad} টা duplicate বাদ যাবে।` : "";
    if (!confirm(`${ok.length} টা account submit করবে?${skipMsg}`)) {
      ui.prog.classList.remove("show");
      return;
    }

    ui.text.textContent = `Processing ${ok.length} submissions...`;
    ui.fill.style.width = "10%";

    const { success, error } = await commitRows(ok, source, (s, t) => {
      ui.fill.style.width = (5 + Math.floor((s / t) * 90)) + "%";
      ui.text.textContent = `Submitted ${s}/${t}...`;
    });

    if (error) {
      alert(`${success} টা submit হয়েছে, সমস্যা:\n${error.message}`);
      ui.prog.classList.remove("show");
      ui.refresh();
      return;
    }

    ui.fill.style.width = "100%";
    ui.text.textContent = `Done! ${success} submitted`;
    await new Promise(r => setTimeout(r, 400));
    alert(`${success} টা submit সফল!${bad ? `\n${bad} টা duplicate বাদ গেছে।` : ""}\nExpected: ৳${success * (Number(task.pricePerAccount) || 0)}`);
    ui.prog.classList.remove("show");
    ui.reset();
  } finally {
    busy = false;
    ui.btn.disabled = false;
    ui.idle();
    syncBar();
  }
}

/* ============ Single ============ */
function readSingle() {
  const item = {};
  const missing = [];
  getFields().forEach(f => {
    const v = ($("dyn_" + f.key)?.value || "").trim();
    item[f.key] = v;
    if (!v && !f.optional) missing.push(f.label || f.key);
  });
  return { item, missing };
}

function singleRow(item) {
  return { label: "1", item, cells: getFields().map(f => item[f.key] || "") };
}

function checkSingleDup() {
  if (!task) return;
  const { item } = readSingle();
  const warn = $("singleDupWarning");
  if (!Object.values(item).some(Boolean)) { warn.style.display = "none"; return; }
  const res = analyze([singleRow(item)])[0];
  if (res.status !== "ok") {
    warn.style.display = "block";
    $("singleDupMsg").textContent = "এই তথ্য " + dupText(res);
  } else {
    warn.style.display = "none";
  }
}

$("singleSubmitBtn").onclick = async () => {
  if (busy) return;
  if (!verifyTime()) return;
  const { item, missing } = readSingle();
  if (missing.length) return alert(`${missing[0]} দিন!`);

  busy = true;
  syncBar();
  try {
    await loadExisting();
    const row = singleRow(item);
    const res = analyze([row])[0];
    if (res.status !== "ok") {
      checkSingleDup();
      alert("Duplicate!\n" + dupText(res));
      return;
    }
    const { error } = await commitRows([row], "single", () => {});
    if (error) throw error;
    alert("Submit সফল! Status: Pending");
    getFields().forEach(f => { const el = $("dyn_" + f.key); if (el) el.value = ""; });
    $("singleDupWarning").style.display = "none";
  } catch (e) {
    alert(e.message);
  } finally {
    busy = false;
    syncBar();
  }
};

/* ============ File ============ */
const dropZone = $("dropZone");
const fileInput = $("fileInput");
const fileInfo = $("fileInfo");

dropZone.onclick = () => fileInput.click();
fileInput.addEventListener("click", e => e.stopPropagation());
dropZone.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileInput.click(); } });
dropZone.addEventListener("dragover", e => { e.preventDefault(); dropZone.classList.add("dragover"); });
dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
dropZone.addEventListener("drop", e => {
  e.preventDefault();
  dropZone.classList.remove("dragover");
  const file = e.dataTransfer.files[0];
  if (file) handleFile(file);
});
fileInput.onchange = e => {
  const file = e.target.files[0];
  if (file) handleFile(file);
};

function cellToStr(c) {
  if (c === null || c === undefined) return "";
  if (typeof c === "number") {
    if (Number.isInteger(c) && Math.abs(c) < 1e21) return BigInt(c).toString();
    return String(c);
  }
  return String(c).trim();
}

function sheetsFromWorkbook(wb) {
  return wb.SheetNames.map(n => ({
    name: n,
    matrix: XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: "", raw: true, blankrows: true })
  }));
}

function readFileSheets(file, ext) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error("ফাইল পড়া যায়নি"));
    if (ext === "xlsx" || ext === "xls") {
      fr.onload = e => {
        try { resolve(sheetsFromWorkbook(XLSX.read(new Uint8Array(e.target.result), { type: "array" }))); }
        catch (err) { reject(err); }
      };
      fr.readAsArrayBuffer(file);
    } else {
      fr.onload = e => {
        try {
          const text = String(e.target.result || "").replace(/^\uFEFF/, "");
          if (ext === "csv") {
            resolve(sheetsFromWorkbook(XLSX.read(text, { type: "string", raw: true })));
          } else {
            resolve([{ name: "txt", matrix: text.split(/\r\n|\r|\n/).map(l => l.trim() ? [l.trim()] : []) }]);
          }
        } catch (err) { reject(err); }
      };
      fr.readAsText(file, "utf-8");
    }
  });
}

function matrixToRows(sheetName, matrix, out, multi) {
  const fields = getFields(), fc = fields.length;
  const conv = matrix.map(r => Array.isArray(r) ? r.map(cellToStr) : []);

  conv.forEach((cells0, idx) => {
    const nonEmpty = cells0.filter(Boolean);
    if (!nonEmpty.length) return;

    let cells;
    if (nonEmpty.length === 1 && fc > 1) cells = splitLine(nonEmpty[0], fc);
    else cells = cells0;

    const label = multi ? `${sheetName}:${idx + 1}` : String(idx + 1);
    if (out.rows.length + out.incomplete.length >= MAX_ROWS) { out.truncated = true; return; }

    const r = buildRow(cells, label, false);
    if (r.ok) out.rows.push(r.row);
    else out.incomplete.push({ label, reason: r.reason });
  });
}

async function handleFile(file) {
  if (!task) return alert("Task এখনো load হয়নি, একটু অপেক্ষা করুন!");
  const ext = file.name.split(".").pop().toLowerCase();
  if (!["xlsx", "xls", "csv", "txt", "tsv"].includes(ext)) {
    fileInput.value = "";
    return alert("শুধুমাত্র Excel (.xlsx, .xls), CSV (.csv) বা TXT (.txt, .tsv) ফাইল দিন!");
  }
  if (file.size > 10 * 1024 * 1024) { fileInput.value = ""; return alert("ফাইল ১০MB এর চেয়ে ছোট হতে হবে!"); }
  if (ext !== "txt" && ext !== "tsv" && typeof XLSX === "undefined") {
    fileInput.value = "";
    return alert("Excel library load হয়নি। ইন্টারনেট চেক করে পেজ রিফ্রেশ দিন।");
  }

  fileInfo.textContent = "ফাইল পড়া হচ্ছে...";
  fileInfo.classList.add("show");

  try {
    const sheets = await readFileSheets(file, ext);
    try { await loadExisting(); } catch (e) {}

    const out = { rows: [], incomplete: [], headers: 0, truncated: false };
    const multi = sheets.filter(s => s.matrix.some(r => Array.isArray(r) && r.some(c => cellToStr(c) !== ""))).length > 1;
    sheets.forEach(s => matrixToRows(s.name, s.matrix, out, multi));

    if (!out.rows.length) {
      fileRows = []; fileMeta = null; fileUnique = 0;
      fileInfo.classList.remove("show");
      $("fileChips").innerHTML = "";
      renderPreview($("filePreview"), [], out.incomplete);
      $("fileSubmitBtn").disabled = true;
      syncBar();
      return alert("ফাইলে কোনো ডাটা পাওয়া যায়নি!");
    }

    fileRows = out.rows;
    fileMeta = { name: file.name, incomplete: out.incomplete, headers: 0, truncated: out.truncated, sheets: sheets.length };
    updateFilePreview();
  } catch (err) {
    fileInfo.classList.remove("show");
    alert("ফাইল পড়তে সমস্যা: " + err.message);
  } finally {
    fileInput.value = "";
  }
}

function updateFilePreview() {
  if (!fileMeta) return;
  const analyzed = analyze(fileRows);
  fileUnique = analyzed.filter(r => r.status === "ok").length;

  renderChips($("fileChips"), analyzed, fileMeta.incomplete);
  renderPreview($("filePreview"), analyzed, fileMeta.incomplete);

  fileInfo.textContent = `${fileMeta.name} — ${analyzed.length} টা ডাটা লোড হয়েছে`;
  fileInfo.classList.add("show");

  $("fileSubmitBtn").disabled = busy || fileUnique === 0;
  syncBar();
}

function resetFile() {
  fileRows = [];
  fileMeta = null;
  fileUnique = 0;
  fileInput.value = "";
  fileInfo.classList.remove("show");
  fileInfo.textContent = "";
  $("fileChips").innerHTML = "";
  $("filePreview").classList.remove("open");
  $("filePreview").innerHTML = "";
  $("fileSubmitBtn").disabled = true;
  syncBar();
}

$("clearFileBtn").onclick = resetFile;

$("fileSubmitBtn").onclick = () => {
  if (!fileRows.length) return alert("কোনো ফাইল লোড করা হয়নি!");
  runSubmit(fileRows, "file", {
    btn: $("fileSubmitBtn"), prog: $("fileSubmitProgress"), text: $("fspText"), fill: $("fspFill"),
    refresh: updateFilePreview, reset: resetFile,
    idle: () => { $("fileSubmitBtn").disabled = !fileRows.length; syncBar(); }
  });
};

window.addEventListener("beforeunload", (e) => {
  if (countdownInterval) clearInterval(countdownInterval);
  if (busy) { e.preventDefault(); e.returnValue = ""; }
});
</script>
