<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#06060f">
<title>Leaderboard — ADQ Income Zone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="style.css?v=35">
<style>
:root{--bg:#06060f;--ink:#f4f4ff;--muted:#9a9bb8;--dim:#6f7090;--line:rgba(255,255,255,.09);--cyan:#22d3ee}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
html,body{background:var(--bg)!important}
body{font-family:'Hind Siliguri','Inter',system-ui,sans-serif!important;color:var(--ink);margin:0;padding:0!important;height:100vh;height:100dvh;overflow:hidden;position:relative}
a{text-decoration:none;color:inherit}button{font-family:inherit}

/* Background */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(90px);will-change:transform}
.orb.o1{width:420px;height:420px;background:#4f46e5;top:-140px;left:-120px;opacity:.5;animation:dr1 20s ease-in-out infinite}
.orb.o2{width:380px;height:380px;background:#9333ea;bottom:-160px;right:-120px;opacity:.42;animation:dr2 24s ease-in-out infinite}
@keyframes dr1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,40px) scale(1.1)}}
@keyframes dr2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-40px,-50px) scale(1.08)}}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 20%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 0%,#000 20%,transparent 70%)}

/* Top Bar */
.top{flex:0 0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;background:rgba(6,6,15,.75);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border-bottom:1px solid var(--line);z-index:50}
.top-in{max-width:520px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.mark{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#6366f1,#8b5cf6 55%,#22d3ee);color:#fff;font-family:'Inter';font-weight:900;font-size:16px;box-shadow:0 8px 20px -6px rgba(139,92,246,.8),inset 0 1px 0 rgba(255,255,255,.35)}
.ibtn{width:40px;height:40px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;flex:0 0 40px}
.ibtn:hover{color:#fff;background:rgba(255,255,255,.1)}
.ibtn.danger:hover{background:rgba(239,68,68,.18);border-color:rgba(239,68,68,.45)}
.ibtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* Page Layout */
.page{position:relative;z-index:1;max-width:520px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:12px 16px 0}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.025));border:1px solid var(--line)}
.empty{text-align:center;padding:30px 16px;border-radius:22px;border:1.5px dashed rgba(255,255,255,.14);color:var(--muted);font-size:13.5px;font-weight:600}
.empty .em{font-size:30px;margin-bottom:6px}

@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* Compact Hero */
.lbh{position:relative;overflow:hidden;text-align:center;border-radius:20px;padding:16px;margin-bottom:12px;background:linear-gradient(135deg,#4338ca 0%,#7c3aed 52%,#c026d3 110%);box-shadow:0 20px 40px -20px rgba(124,58,237,.85),inset 0 1px 0 rgba(255,255,255,.3);flex:0 0 auto}
.lbh::before{content:'';position:absolute;top:-60%;left:-20%;width:90%;height:160%;background:radial-gradient(circle,rgba(251,191,36,.28),transparent 62%);pointer-events:none}
.lbh h2{position:relative;z-index:1;margin:0 0 4px;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.lbh h2 svg{width:20px;height:20px;fill:none;stroke:#fde68a;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.lbh p{position:relative;z-index:1;margin:0;font-size:12px;color:rgba(255,255,255,.85);font-weight:500}

/* Compact Podium */
.podium{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin:0 0 12px;min-height:135px;flex:0 0 auto}
.pd{flex:1;max-width:110px;text-align:center;padding:10px 4px;border-radius:18px;position:relative}
.pd.rank-1{transform:translateY(-10px);border-color:rgba(251,191,36,.6);background:linear-gradient(180deg,rgba(251,191,36,.24),rgba(251,191,36,.04));box-shadow:0 16px 30px -15px rgba(245,158,11,.95);z-index:2;padding-bottom:14px}
.pd.rank-2{border-color:rgba(203,213,225,.45);background:linear-gradient(180deg,rgba(203,213,225,.15),rgba(203,213,225,.03))}
.pd.rank-3{border-color:rgba(251,146,60,.45);background:linear-gradient(180deg,rgba(251,146,60,.16),rgba(251,146,60,.03))}
.pd-medal{width:24px;height:24px;margin:0 auto 2px;display:flex;align-items:center;justify-content:center}
.pd-medal svg{width:100%;height:100%;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.rank-1 .pd-medal{width:32px;height:32px;animation:flt 2s ease-in-out infinite}
.rank-1 .pd-medal svg{stroke:#fde68a;fill:rgba(253,230,138,0.2)}
.rank-2 .pd-medal svg{stroke:#e2e8f0}
.rank-3 .pd-medal svg{stroke:#fdba74}
.pd-av{width:38px;height:38px;border-radius:50%;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:16px;font-family:'Inter'}
.rank-1 .pd-av{width:48px;height:48px;font-size:20px;background:linear-gradient(135deg,#fde68a,#f59e0b);box-shadow:0 0 0 2px rgba(251,191,36,.35),0 8px 20px -6px rgba(245,158,11,.85)}
.rank-2 .pd-av{background:linear-gradient(135deg,#cbd5e1,#64748b);box-shadow:0 0 0 2px rgba(203,213,225,.25)}
.rank-3 .pd-av{background:linear-gradient(135deg,#fdba74,#ea580c);box-shadow:0 0 0 2px rgba(251,146,60,.25)}
.pd-name{font-size:11.5px;font-weight:700;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.pd-ach{display:flex;justify-content:center;gap:2px;margin-bottom:2px}
.pd-ach svg{width:12px;height:12px;fill:none;stroke:#c4b5fd;stroke-width:2.2}
.pd-good{font-family:'Inter';font-size:16px;font-weight:900;color:#34d399;line-height:1}
.pd-lbl{font-size:9px;color:var(--muted);font-weight:700;margin-top:1px;letter-spacing:.5px}

/* Tabs */
.tabs2{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px;flex:0 0 auto}
.tabs2::-webkit-scrollbar{display:none}
.tabs2 button{display:flex;align-items:center;gap:5px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted);font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer;transition:.25s}
.tabs2 button svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tabs2 button:hover{color:#fff}
.tabs2 button.active{color:#fff;border-color:transparent;background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 8px 18px -6px rgba(139,92,246,.9)}

/* Scrollable List */
.lb-scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.lb-scroll::-webkit-scrollbar{display:none}
.lr{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:8px;border-radius:16px;transition:.25s;animation:rise .3s ease both}
.lr:hover{transform:translateX(2px);border-color:rgba(255,255,255,.2)}
.lr.me{border:1.5px solid rgba(139,92,246,.85);background:linear-gradient(90deg,rgba(99,102,241,.25),rgba(99,102,241,.05) 60%);box-shadow:0 14px 34px -18px rgba(139,92,246,.9)}
.lr-rank{width:32px;height:32px;flex:0 0 32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Inter';font-weight:900;font-size:14px;color:var(--muted);background:rgba(255,255,255,.07)}
.lr-rank.r1{background:rgba(251,191,36,.2);color:#fde68a}
.lr-rank.r2{background:rgba(203,213,225,.18);color:#e2e8f0}
.lr-rank.r3{background:rgba(251,146,60,.2);color:#fdba74}
.lr-av{width:36px;height:36px;flex:0 0 36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:15px;font-family:'Inter';background:linear-gradient(135deg,#6366f1,#8b5cf6)}
.lr-info{flex:1;min-width:0}
.lr-nr{display:flex;align-items:center;gap:6px;min-width:0}
.lr-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.you{flex:0 0 auto;font-size:9px;font-weight:800;background:#6366f1;color:#fff;padding:1px 6px;border-radius:4px}
.lr-meta{font-size:11px;color:var(--muted);font-weight:500;margin-top:1px}
.lr-good{text-align:right;flex:0 0 auto}
.lr-gn{font-family:'Inter';font-size:16px;font-weight:900;color:#34d399;line-height:1}
.lr-gl{font-size:9px;color:var(--muted);font-weight:700;margin-top:1px;letter-spacing:.5px}

/* Floating My Position Bar */
.mybar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 92px);width:calc(100% - 32px);max-width:488px;display:none;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:18px;color:#fff;background:linear-gradient(135deg,#4f46e5,#7c3aed);border:1px solid rgba(255,255,255,.25);box-shadow:0 16px 36px -10px rgba(79,70,229,.8);z-index:55;animation:rise .4s cubic-bezier(.2,.8,.2,1)}
.mybar.show{display:flex}
.mb-l{display:flex;align-items:center;gap:10px;min-width:0}
.mb-r{font-family:'Inter';font-size:16px;font-weight:900;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:9px}
.mb-n{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mb-g{font-size:14px;font-weight:800;color:#a7f3d0;white-space:nowrap}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="orb o1"></div><div class="orb o2"></div><div class="grid"></div></div>

<header class="top">
  <div class="top-in">
    <button class="ibtn" onclick="goBack()" aria-label="Back">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="brand"><div class="mark">A</div><span>Leaderboard</span></div>
    <button class="ibtn danger" id="logoutBtn" aria-label="Logout">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </div>
</header>

<main class="page">
  <div class="lbh">
    <h2><svg viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 010-5H6"/><path d="M18 9h1.5a2.5 2.5 0 000-5H18"/><path d="M4 22h16"/><path d="M18 2H6v7a6 6 0 0012 0V2z"/></svg> Top Players</h2>
    <p>Good account count অনুযায়ী টপ প্লেয়ার</p>
  </div>

  <div id="podiumArea"><div class="skel big" style="height:135px;"></div></div>

  <div class="tabs2">
    <button class="active" data-range="all"><svg viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 010-5H6"/><path d="M18 9h1.5a2.5 2.5 0 000-5H18"/><path d="M4 22h16"/><path d="M18 2H6v7a6 6 0 0012 0V2z"/></svg> All Time</button>
    <button data-range="month"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> This Month</button>
    <button data-range="week"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> This Week</button>

  <div class="lb-scroll" id="lbList">

</main>

<div class="mybar" id="myPositionBar">
  <div class="mb-l">
    <div class="mb-r" id="mpbRank">#0</div>

</div>

  <script type="module">
import { auth } from "./firebase.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// ✅ লিডারবোর্ড API সেটআপ
const API_BASE = (location.hostname.endsWith("vercel.app") || location.hostname === "localhost" || location.hostname === "127.0.0.1")
  ? ""
  : "https://adq-income-zone.vercel.app";
const LEADERBOARD_URL = API_BASE + "/api/leaderboard";

window.goBack = function() {
  if (document.referrer && document.referrer.includes(window.location.hostname) && history.length > 1) {
    history.back();
  } else {
    location.href = "dashboard.html";
  }
};

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function getBadgeClass(color) {
  if (!color) return 'gold';
  if (color.includes("#94a3b8") || color.includes("silver")) return 'silver';
  if (color.includes("#ea580c") || color.includes("bronze")) return 'bronze';
  if (color.includes("#a855f7")) return 'purple';
  if (color.includes("#3b82f6")) return 'blue';
  if (color.includes("#10b981")) return 'green';
  if (color.includes("#ef4444")) return 'red';
  return 'gold';
}

function getDisplayName(u) {
  return (u.name && String(u.name).trim()) || "User";
}

/* ============ PREMIUM SVG ACHIEVEMENT ICONS ============ */
function getAchievementIcons(u) {
  const good = u.totalGood || 0;
  const icons = [];
  
  if (good >= 50) icons.push(`<svg viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0011 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 11-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 002.5 2.5z"/></svg>`); // Fire
  else if (good >= 10) icons.push(`<svg viewBox="0 0 24 24"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>`); // Rocket
  else if (good >= 1) icons.push(`<svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`); // Star

  if (u.hasRefer) icons.push(`<svg viewBox="0 0 24 24"><path d="m11 17 2 2a1 1 0 1 0 3-3"/><path d="m14 14 2.5 2.5a1 1 0 1 0 3-3l-3.88-3.88a3 3 0 0 0-4.24 0l-.88.88a1 1 0 1 1-3-3l2.81-2.81a5.79 5.79 0 0 1 7.06-.87l.47.28a2 2 0 0 0 1.42.25L21 4"/><path d="m21 3 1 11h-2"/><path d="M3 3 2 14l6.5 6.5a1 1 0 1 0 3-3"/><path d="M3 4h8"/></svg>`); // Handshake
  
  if (u.rich) icons.push(`<svg viewBox="0 0 24 24"><path d="M6 3h12l4 6-10 13L2 9Z"/><path d="M11 3 8 9l4 13 4-13-3-6"/><path d="M2 9h20"/></svg>`); // Diamond

  return icons.join("");
}

let currentUser = null;
let allUsers = [];
let currentRange = "all";

document.getElementById("logoutBtn").onclick = async () => {
  if (!confirm("লগআউট?")) return;
  await signOut(auth);
  location.href = "index.html";
};

onAuthStateChanged(auth, async (user) => {
  if (!user) { location.href = "login.html"; return; }
  currentUser = user;
  await loadLeaderboard();
});

async function loadLeaderboard() {
  try {
    const token = await currentUser.getIdToken();
    const res = await fetch(LEADERBOARD_URL, {
      headers: { "Authorization": "Bearer " + token }
    });
    let data = null;
    try { data = await res.json(); } catch (e) {}

    if (!res.ok || !Array.isArray(data?.users)) {
      throw new Error(data?.error || ("সার্ভার এরর (" + res.status + ")"));
    }

    allUsers = data.users;
    renderPodium();
    renderList();
    updateMyPositionBar();
    window.adqReady && window.adqReady(); // Hide Loading Screen
  } catch (e) {
    const msg = `<div class="empty" style="color:#fca5a5">${esc(e.message)}</div>`;
    document.getElementById("podiumArea").innerHTML = msg;
    document.getElementById("lbList").innerHTML = "";
    window.adqReady && window.adqReady();
  }
}

function renderPodium() {
  const area = document.getElementById("podiumArea");
  const top3 = allUsers.slice(0, 3);

  if (top3.length === 0) {
    area.innerHTML = `<div class="empty" style="padding:20px;">এখনো কোনো ranking নেই</div>`;
    return;
  }

  const orderClasses = ["rank-2", "rank-1", "rank-3"];
  const order = [1, 0, 2];
  
  // SVG Medals
  const medal1 = `<svg viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 010-5H6"/><path d="M18 9h1.5a2.5 2.5 0 000-5H18"/><path d="M4 22h16"/><path d="M18 2H6v7a6 6 0 0012 0V2z"/></svg>`;
  const medal2 = `<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>`;
  const medal3 = `<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>`;
  const rankIcons = [medal1, medal2, medal3];

  let html = `<div class="podium">`;

  order.forEach((idx, position) => {
    const u = top3[idx];
    if (!u) {
      html += `<div class="pd glass ${orderClasses[position]}" style="opacity:0.3"></div>`;
      return;
    }
    const icon = rankIcons[idx];
    const badgeClass = u.customBadge ? getBadgeClass(u.customBadgeColor) : "";
    const displayName = getDisplayName(u);
    const achIcons = getAchievementIcons(u);
    const achHtml = achIcons ? `<div class="pd-ach">${achIcons}</div>` : '';

    html += `
      <div class="pd glass ${orderClasses[position]}">
        <div class="pd-medal">${icon}</div>
        <div class="pd-av">${esc(displayName.charAt(0).toUpperCase())}</div>
        <div class="pd-name">${esc(displayName)}</div>
        ${badgeClass ? `<div style="margin-bottom:4px;"><span class="premium-badge ${badgeClass}" style="margin:0 auto; transform:scale(0.8);" title="${esc(u.customBadge)}"></span></div>` : ''}
        ${achHtml}
        <div class="pd-good">${u.totalGood || 0}</div>
        <div class="pd-lbl">GOOD</div>
      </div>
    `;
  });

  html += `</div>`;
  area.innerHTML = html;
}

function renderList() {
  const list = document.getElementById("lbList");
  let filtered = allUsers;
  
  if (currentRange === "month") {
    const monthAgo = Date.now() - 30 * 24 * 60 * 60 * 1000;
    filtered = allUsers.filter(u => (u.createdAt || 0) >= monthAgo);
  } else if (currentRange === "week") {
    const weekAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
    filtered = allUsers.filter(u => (u.createdAt || 0) >= weekAgo);
  }

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty">কোনো user নেই</div>`;
    return;
  }

  list.innerHTML = filtered.map((u, idx) => {
    const rank = idx + 1;
    const isMe = !!u.me;
    const displayName = getDisplayName(u);

    let rankClass = "";
    if (rank === 1) rankClass = "r1";
    else if (rank === 2) rankClass = "r2";
    else if (rank === 3) rankClass = "r3";

    const badgeClass = u.customBadge ? getBadgeClass(u.customBadgeColor) : "";
    const achIcons = getAchievementIcons(u);

    return `
      <div class="lr glass ${isMe ? 'me' : ''}" style="animation-delay:${Math.min(idx, 10) * 0.04}s">
        <div class="lr-rank ${rankClass}">${rank}</div>
        <div class="lr-av">${esc(displayName.charAt(0).toUpperCase())}</div>
        <div class="lr-info">
          <div class="lr-nr">
            <span class="lr-name">${esc(displayName)}</span>
            ${isMe ? '<span class="you">YOU</span>' : ''}
            ${badgeClass ? `<span class="premium-badge ${badgeClass}" style="transform:scale(0.85);" title="${esc(u.customBadge)}"></span>` : ''}
            <div class="lr-ach">${achIcons}</div>
          </div>
          <div class="lr-meta">✅ ${u.totalGood || 0} good • ❌ ${u.totalBad || 0} bad</div>
        </div>
        <div class="lr-good">
          <div class="lr-gn">${u.totalGood || 0}</div>
          <div class="lr-gl">GOOD</div>
        </div>
      </div>
    `;
  }).join("");
}

function updateMyPositionBar() {
  const bar = document.getElementById("myPositionBar");
  const myIndex = allUsers.findIndex(u => u.me);

  if (myIndex === -1) {
    bar.classList.remove("show");
    return;
  }

  const myData = allUsers[myIndex];
  const rank = myIndex + 1;
  const displayName = getDisplayName(myData);

  document.getElementById("mpbRank").textContent = `#${rank}`;
  document.getElementById("mpbName").textContent = displayName;
  document.getElementById("mpbGood").textContent = `${myData.totalGood || 0} Good`;

  bar.classList.add("show");
}

document.querySelectorAll(".tabs2 button").forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll(".tabs2 button").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    currentRange = tab.dataset.range;
    renderList();
    updateMyPositionBar();
  };
});
</script>
</body>
</html>
