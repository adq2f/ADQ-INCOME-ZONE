<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Withdraw Admin — ADQ Income Zone</title>
  <link rel="stylesheet" href="style.css?v=11">
  <style>
    .method-toggle {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 4px 16px rgba(15,23,42,0.06);
      transition: 0.3s;
    }
    .method-toggle.off { opacity: 0.55; background: #f8fafc; }

    .pay-logo {
      width: 50px; height: 50px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-family: 'Inter';
      color: white; font-size: 16px;
      flex-shrink: 0;
      box-shadow: 0 6px 16px rgba(0,0,0,0.15);
    }
    .pay-logo.bkash { background: linear-gradient(135deg, #E2136E, #B0105A); }
    .pay-logo.nagad { background: linear-gradient(135deg, #F15A24, #D94315); }
    .pay-logo.rocket { background: linear-gradient(135deg, #8B1F8B, #6A156A); }
    .pay-logo.binance { background: linear-gradient(135deg, #F3BA2F, #D9A420); color: #1a1a1a; font-size: 12px; }

    /* Toggle Switch */
    .switch {
      position: relative;
      width: 54px;
      height: 30px;
      flex-shrink: 0;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #cbd5e1;
      transition: 0.4s;
      border-radius: 30px;
    }
    .slider:before {
      content: "";
      position: absolute;
      height: 22px; width: 22px;
      left: 4px; bottom: 4px;
      background: white;
      transition: 0.4s;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .switch input:checked + .slider {
      background: linear-gradient(135deg, #10b981, #059669);
    }
    .switch input:checked + .slider:before {
      transform: translateX(24px);
    }

    /* Withdraw Request */
    .wd-request {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 10px;
      box-shadow: 0 4px 16px rgba(15,23,42,0.06);
      border-left: 4px solid #f59e0b;
      animation: fadeInUp 0.4s var(--ease);
    }
    .wd-request.approved { border-left-color: #10b981; background: linear-gradient(90deg, #f0fdf4 0%, white 30%); }
    .wd-request.rejected { border-left-color: #ef4444; background: linear-gradient(90deg, #fef2f2 0%, white 30%); }

    .wd-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
    }
    .wd-info .user { font-size: 14px; font-weight: 700; color: #0f172a; }
    .wd-info .email { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .wd-info .acc { font-size: 12px; color: #64748b; margin-top: 6px; }

    .wd-amount {
      font-size: 20px;
      font-weight: 800;
      font-family: 'Inter';
      color: #E2136E;
      white-space: nowrap;
    }
    .wd-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .wd-actions button {
      flex: 1;
      padding: 8px;
      font-size: 12px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      font-family: inherit;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <div class="logo">
      <div class="mark">A</div>
      <span>Withdraw Admin</span>
    </div>
    <button class="nav-logout" id="logoutBtn" title="Logout">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </div>

  <div class="container">
    <div class="tabs">
      <button id="tabRequests" class="active">📥 Requests</button>
      <button id="tabMethods">💳 Methods</button>
    </div>

    <!-- REQUESTS -->
    <div id="requestsSection">
      <div class="dash-section-head">
        <h3>⏳ Pending Withdraw Requests</h3>
      </div>
      <div id="pendingList" class="loading"><div class="spinner"></div>লোড হচ্ছে...</div>

      <div class="dash-section-head" style="margin-top:24px">
        <h3>✅ History</h3>
      </div>
      <div id="historyList" class="loading"><div class="spinner"></div>লোড হচ্ছে...</div>
    </div>

    <!-- METHODS -->
    <div id="methodsSection" style="display:none">
      <div class="dash-section-head">
        <h3>💳 Payment Methods On/Off</h3>
      </div>
      <p style="font-size:13px;color:#64748b;margin-bottom:16px">
        ON থাকলে user withdraw request করতে পারবে, OFF থাকলে পারবে না।
      </p>
      <div id="methodsList" class="loading"><div class="spinner"></div>লোড হচ্ছে...</div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" data-page="home"><span class="nav-ic"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span><span class="nav-label">Home</span></a>
    <a href="dashboard.html" data-page="dashboard" class="active"><span class="nav-ic"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg></span><span class="nav-label">Dashboard</span></a>
    <a href="index.html#tasks" data-page="submit"><span class="nav-ic"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></span><span class="nav-label">Submit</span></a>
    <a href="wallet.html" data-page="wallet"><span class="nav-ic"><svg viewBox="0 0 24 24"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></svg></span><span class="nav-label">Wallet</span></a>
    <a href="profile.html" data-page="profile"><span class="nav-ic"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><span class="nav-label">Profile</span></a>
  </nav>

  <script type="module">
    import { auth, db } from "./firebase.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { doc, getDoc, setDoc, collection, updateDoc, increment, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    document.getElementById("logoutBtn").onclick = async () => {
      if (!confirm("লগআউট?")) return;
      await signOut(auth);
      location.href = "index.html";
    };

    const tabs = { tabRequests: "requestsSection", tabMethods: "methodsSection" };
    Object.keys(tabs).forEach(tabId => {
      document.getElementById(tabId).onclick = () => {
        Object.keys(tabs).forEach(t => {
          document.getElementById(t).classList.remove("active");
          document.getElementById(tabs[t]).style.display = "none";
        });
        document.getElementById(tabId).classList.add("active");
        document.getElementById(tabs[tabId]).style.display = "block";
      };
    });

    const PAY_METHODS = {
      bkash: { name: "bKash", logo: "bKash", logoClass: "bkash" },
      nagad: { name: "Nagad", logo: "Nagad", logoClass: "nagad" },
      rocket: { name: "Rocket", logo: "Rocket", logoClass: "rocket" },
      binance: { name: "Binance", logo: "BNB", logoClass: "binance" }
    };

    let currentUser = null;
    let allWithdrawals = [];

    onAuthStateChanged(auth, async (user) => {
      if (!user) { location.href = "login.html"; return; }
      currentUser = user;
      const snap = await getDoc(doc(db, "users", user.uid));
      if (!snap.exists() || snap.data().role !== "admin") {
        alert("❌ আপনি admin না!");
        location.href = "dashboard.html";
        return;
      }
      loadWithdrawals();
      loadMethods();
    });

    async function loadWithdrawals() {
      const q = query(collection(db, "withdrawals"));
      const snap = await getDocs(q);
      allWithdrawals = await Promise.all(snap.docs.map(async d => {
        const w = d.data();
        // Get user info
        try {
          const uSnap = await getDoc(doc(db, "users", w.userId));
          if (uSnap.exists()) {
            w.userName = uSnap.data().username;
            w.userEmail = uSnap.data().email;
          }
        } catch (e) {}
        return { id: d.id, ...w };
      }));
      allWithdrawals.sort((a, b) => (b.requestedAt?.toMillis?.() || 0) - (a.requestedAt?.toMillis?.() || 0));
      renderWithdrawals();
    }

    function renderWithdrawals() {
      const pending = allWithdrawals.filter(w => w.status === "pending");
      const history = allWithdrawals.filter(w => w.status !== "pending");

      const pendingList = document.getElementById("pendingList");
      const historyList = document.getElementById("historyList");

      if (pending.length === 0) {
        pendingList.innerHTML = `<div class="dash-empty"><div class="em">📭</div><p>কোনো pending request নেই</p></div>`;
      } else {
        pendingList.innerHTML = pending.map(w => renderCard(w, true)).join("");
      }

      if (history.length === 0) {
        historyList.innerHTML = `<div class="dash-empty"><div class="em">📭</div><p>কোনো history নেই</p></div>`;
      } else {
        historyList.innerHTML = history.slice(0, 30).map(w => renderCard(w, false)).join("");
      }
    }

    function renderCard(w, isPending) {
      const m = PAY_METHODS[w.method] || { name: w.methodName, logo: "?", logoClass: "bkash" };
      const time = w.requestedAt?.toDate?.().toLocaleString("bn-BD", {
        day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"
      }) || "";

      return `
        <div class="wd-request ${w.status !== "pending" ? w.status : ''}">
          <div class="wd-head">
            <div class="wd-info">
              <div class="user">👤 ${w.userName || "User"}</div>
              <div class="email">${w.userEmail || ""}</div>
              <div class="acc">${m.logo} ${m.name} → <b>${w.accountNum}</b></div>
              <div class="email">🕐 ${time}</div>
            </div>
            <div class="wd-amount">৳${w.amount}</div>
          </div>
          ${isPending ? `
            <div class="wd-actions">
              <button style="background:#d1fae5;color:#065f46" onclick="approveW('${w.id}')">✅ Approve</button>
              <button style="background:#fee2e2;color:#991b1b" onclick="rejectW('${w.id}')">❌ Reject</button>
            </div>
          ` : `<div style="font-size:11px;color:#94a3b8;margin-top:8px">Status: ${w.status}</div>`}
        </div>
      `;
    }

    window.approveW = async (id) => {
      if (!confirm("Approve করবে? (User-এর balance থেকে টাকা আগেই কাটা হয়েছে, শুধু approve mark হবে)")) return;
      const w = allWithdrawals.find(x => x.id === id);
      if (!w) return;
      try {
        await updateDoc(doc(db, "withdrawals", id), {
          status: "approved",
          approvedAt: new Date(),
          approvedBy: currentUser.uid
        });
        alert("✅ Approved!");
        loadWithdrawals();
      } catch (e) { alert("❌ " + e.message); }
    };

    window.rejectW = async (id) => {
      if (!confirm("Reject করবে? (টাকা user-এর balance-এ ফেরত যাবে)")) return;
      const w = allWithdrawals.find(x => x.id === id);
      if (!w) return;
      try {
        await updateDoc(doc(db, "withdrawals", id), {
          status: "rejected",
          rejectedAt: new Date(),
          rejectedBy: currentUser.uid
        });
        // Refund
        await updateDoc(doc(db, "users", w.userId), {
          balance: increment(w.amount)
        });
        alert("✅ Rejected! টাকা ফেরত দেওয়া হয়েছে।");
        loadWithdrawals();
      } catch (e) { alert("❌ " + e.message); }
    };

    // ===== METHODS =====
    async function loadMethods() {
      const list = document.getElementById("methodsList");
      let config = { bkash: true, nagad: true, rocket: true, binance: true };
      try {
        const snap = await getDoc(doc(db, "settings", "payment_methods"));
        if (snap.exists()) config = snap.data();
      } catch (e) {}

      list.innerHTML = Object.keys(PAY_METHODS).map(key => {
        const m = PAY_METHODS[key];
        const isOn = config[key] !== false;
        return `
          <div class="method-toggle ${isOn ? '' : 'off'}">
            <div class="pay-logo ${m.logoClass}">${m.logo}</div>
            <div style="flex:1">
              <h4 style="font-size:15px;font-weight:700;color:#0f172a;margin-bottom:2px">${m.name}</h4>
              <p style="font-size:12px;color:#64748b">Withdraw ${isOn ? 'চালু' : 'বন্ধ'}</p>
            </div>
            <label class="switch">
              <input type="checkbox" ${isOn ? 'checked' : ''} data-key="${key}">
              <span class="slider"></span>
            </label>
          </div>
        `;
      }).join("");

      list.querySelectorAll(".switch input").forEach(input => {
        input.onchange = async (e) => {
          const key = e.target.dataset.key;
          const isOn = e.target.checked;
          try {
            const ref = doc(db, "settings", "payment_methods");
            const snap = await getDoc(ref);
            const current = snap.exists() ? snap.data() : { bkash: true, nagad: true, rocket: true, binance: true };
            current[key] = isOn;
            await setDoc(ref, current);
            e.target.closest(".method-toggle").classList.toggle("off", !isOn);
            const p = e.target.closest(".method-toggle").querySelector("p");
            p.textContent = `Withdraw ${isOn ? 'চালু' : 'বন্ধ'}`;
          } catch (err) { alert("❌ " + err.message); }
        };
      });
    }
  </script>
</body>
</html>
