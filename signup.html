<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>রেজিস্ট্রেশন — ADQ Income Zone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #06060f;
      --ink: #f4f4ff;
      --muted: #9a9bb8;
      --line: rgba(255,255,255,0.09);
      --glass: rgba(255,255,255,0.045);
      --violet: #8b5cf6;
      --indigo: #6366f1;
      --cyan: #22d3ee;
      --gold: #fbbf24;
      --ok: #10b981;
      --bad: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { min-height: 100%; }
    body {
      font-family: 'Hind Siliguri', 'Inter', system-ui, sans-serif;
      background: var(--bg); color: var(--ink);
      min-height: 100vh; min-height: 100dvh;
      overflow-x: hidden; position: relative;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* ===== Aurora background ===== */
    .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.55; will-change: transform; }
    .orb.o1 { width: 420px; height: 420px; background: #4f46e5; top: -120px; left: -100px; animation: drift1 18s ease-in-out infinite; }
    .orb.o2 { width: 380px; height: 380px; background: #9333ea; bottom: -140px; right: -100px; animation: drift2 22s ease-in-out infinite; }
    .orb.o3 { width: 260px; height: 260px; background: #0891b2; top: 45%; left: 55%; opacity: 0.32; animation: drift1 26s ease-in-out infinite reverse; }
    @keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(60px,50px) scale(1.12); } }
    @keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-50px,-60px) scale(1.1); } }
    .grid-fx {
      position: absolute; inset: 0;
      background-image: linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
    }

    /* ===== Layout ===== */
    .shell { position: relative; z-index: 1; min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 28px 16px; }
    .card {
      width: 100%; max-width: 440px; position: relative;
      background: linear-gradient(160deg, rgba(255,255,255,0.075), rgba(255,255,255,0.025));
      backdrop-filter: blur(26px) saturate(150%); -webkit-backdrop-filter: blur(26px) saturate(150%);
      border-radius: 28px; padding: 34px 26px 26px;
      box-shadow: 0 30px 80px -20px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.12);
      animation: rise 0.7s cubic-bezier(.2,.8,.2,1) both;
    }
    .card::before {
      content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1.2px;
      background: linear-gradient(145deg, rgba(139,92,246,0.9), rgba(255,255,255,0.08) 40%, rgba(34,211,238,0.6));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(0.98); } to { opacity: 1; transform: none; } }

    /* ===== Brand ===== */
    .brand { text-align: center; margin-bottom: 24px; }
    .mark {
      width: 68px; height: 68px; margin: 0 auto 16px; border-radius: 22px; position: relative;
      background: linear-gradient(135deg, #6366f1, #8b5cf6 55%, #22d3ee);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 14px 34px -8px rgba(139,92,246,0.8), inset 0 2px 0 rgba(255,255,255,0.35);
    }
    .mark::after { content: ''; position: absolute; inset: -6px; border-radius: 26px; border: 1px solid rgba(139,92,246,0.35); }
    .mark svg { width: 32px; height: 32px; color: #fff; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.3)); }
    .title { font-size: 26px; font-weight: 700; letter-spacing: -0.3px; line-height: 1.25; }
    .subtitle { margin-top: 6px; font-size: 14px; color: var(--muted); font-weight: 500; }
    .subtitle b { color: var(--cyan); font-weight: 700; }

    /* ===== Refer badge ===== */
    .refer-badge { display: none; text-align: center; margin-bottom: 16px; }
    .refer-badge span {
      display: inline-flex; align-items: center; gap: 6px;
      background: linear-gradient(135deg, rgba(16,185,129,0.2), rgba(34,211,238,0.12));
      color: #6ee7b7; border: 1px solid rgba(16,185,129,0.5);
      padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 700;
    }

    /* ===== Success ===== */
    .success {
      display: none; align-items: center; gap: 12px;
      background: linear-gradient(135deg, rgba(16,185,129,0.22), rgba(16,185,129,0.08));
      border: 1px solid rgba(16,185,129,0.5); color: #a7f3d0;
      padding: 14px; border-radius: 16px; margin-bottom: 16px; font-size: 14px; font-weight: 600;
    }
    .success .badge-icon {
      width: 30px; height: 30px; flex: 0 0 30px; border-radius: 50%;
      background: var(--ok); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 900;
      box-shadow: 0 0 0 6px rgba(16,185,129,0.2);
    }

    /* ===== Fields ===== */
    .field {
      position: relative; display: flex; align-items: center; margin-bottom: 12px;
      background: rgba(255,255,255,0.05); border: 1.5px solid var(--line);
      border-radius: 16px; transition: border-color .25s, background .25s, box-shadow .25s;
    }
    .field:hover { background: rgba(255,255,255,0.07); }
    .field:focus-within {
      border-color: rgba(139,92,246,0.9); background: rgba(139,92,246,0.08);
      box-shadow: 0 0 0 4px rgba(139,92,246,0.18), 0 8px 24px -10px rgba(139,92,246,0.6);
    }
    .field.ok { border-color: rgba(16,185,129,0.85); box-shadow: 0 0 0 4px rgba(16,185,129,0.15); }
    .field.err { border-color: rgba(239,68,68,0.9); box-shadow: 0 0 0 4px rgba(239,68,68,0.15); }
    .field-icon { flex: 0 0 48px; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 16px; transition: color .25s; }
    .field:focus-within .field-icon { color: #c4b5fd; }
    .field-icon svg { width: 19px; height: 19px; }
    .field input {
      flex: 1; min-width: 0; background: transparent; border: none; outline: none;
      color: var(--ink); font-family: inherit; font-size: 15.5px; font-weight: 500;
      padding: 16px 12px 16px 0;
    }
    .field input::placeholder { color: #6f7090; font-weight: 400; }
    .field input:-webkit-autofill { -webkit-text-fill-color: var(--ink); -webkit-box-shadow: 0 0 0 60px #15152b inset; caret-color: #fff; }
    .field-toggle {
      flex: 0 0 46px; align-self: stretch; background: transparent; border: none; color: var(--muted);
      cursor: pointer; display: flex; align-items: center; justify-content: center; transition: color .2s;
    }
    .field-toggle:hover { color: #fff; }
    .field-toggle svg { width: 19px; height: 19px; }

    /* Strength meter */
    .strength { display: none; margin: -2px 2px 12px; }
    .strength-bars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    .strength-bars i { height: 4px; border-radius: 4px; background: rgba(255,255,255,0.1); transition: background .3s; }
    .strength-text { margin-top: 6px; font-size: 12px; font-weight: 600; color: var(--muted); display: flex; justify-content: space-between; }
    .hint { margin: -4px 4px 10px; font-size: 12px; font-weight: 600; min-height: 0; display: none; }
    .hint.ok { color: #6ee7b7; display: block; }
    .hint.err { color: #fca5a5; display: block; }

    /* Refer info */
    .refer-info {
      display: none; margin-bottom: 14px; padding: 12px 14px; border-radius: 14px;
      font-size: 13px; line-height: 1.5; color: #fde68a;
      background: linear-gradient(135deg, rgba(251,191,36,0.16), rgba(245,158,11,0.06));
      border: 1px solid rgba(251,191,36,0.4); border-left: 4px solid var(--gold);
    }
    .refer-info b { color: #fff; }

    /* ===== Button ===== */
    .btn-main {
      width: 100%; margin-top: 8px; position: relative; overflow: hidden; cursor: pointer;
      border: none; border-radius: 16px; padding: 17px 20px; color: #fff;
      font-family: inherit; font-size: 16.5px; font-weight: 700; letter-spacing: 0.2px;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
      box-shadow: 0 16px 34px -10px rgba(139,92,246,0.9), inset 0 1px 0 rgba(255,255,255,0.35);
      transition: transform .2s, box-shadow .2s, filter .2s;
    }
    .btn-main::before {
      content: ''; position: absolute; top: 0; left: -80%; width: 50%; height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,0.35), transparent);
      transform: skewX(-20deg); transition: left .7s;
    }
    .btn-main:hover:not(:disabled)::before { left: 130%; }
    .btn-main:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 20px 40px -10px rgba(139,92,246,1), inset 0 1px 0 rgba(255,255,255,0.4); }
    .btn-main:active:not(:disabled) { transform: translateY(0) scale(0.985); }
    .btn-main:disabled { filter: saturate(0.6) brightness(0.85); cursor: not-allowed; }
    .btn-main:focus-visible, .field-toggle:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

    /* ===== Footer ===== */
    .perks { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); }
    .perk { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
    .perk svg { width: 14px; height: 14px; color: var(--cyan); }
    .switch-text { text-align: center; margin-top: 16px; font-size: 14px; color: var(--muted); font-weight: 500; }
    .switch-text a { color: #c4b5fd; font-weight: 700; text-decoration: none; margin-left: 6px; border-bottom: 1.5px solid rgba(196,181,253,0.35); transition: .2s; }
    .switch-text a:hover { color: #fff; border-color: #fff; }

    @media (max-width: 420px) {
      .card { padding: 28px 18px 22px; border-radius: 24px; }
      .title { font-size: 23px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .orb, .card { animation: none; }
      .btn-main::before { display: none; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
    <div class="grid-fx"></div>
  </div>

  <div class="shell">
    <div class="card">
      <div class="brand">
        <div class="mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></svg>
        </div>
        <h1 class="title">অ্যাকাউন্ট তৈরি করুন</h1>
        <p class="subtitle">মাত্র <b>৩০ সেকেন্ডে</b> রেজিস্ট্রেশন</p>
      </div>

      <div id="referBadge" class="refer-badge"><span>🎁 Refer Code Applied!</span></div>

      <div id="successBox" class="success">
        <div class="badge-icon">✓</div>
        <div>রেজিস্ট্রেশন সফল! লগইন পেজে নিয়ে যাচ্ছি...</div>
      </div>

      <div class="field">
        <span class="field-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
        <input type="text" id="username" placeholder="আপনার নাম" autocomplete="name">
      </div>

      <div class="field">
        <span class="field-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></span>
        <input type="email" id="email" placeholder="ইমেইল এড্রেস" autocomplete="email">
      </div>

      <div class="field">
        <span class="field-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
        <input type="password" id="password" placeholder="পাসওয়ার্ড (৬+ অক্ষর)" autocomplete="new-password">
        <button type="button" class="field-toggle" aria-label="পাসওয়ার্ড দেখান" onclick="togglePass('password', this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>

      <div class="strength" id="strength">
        <div class="strength-bars"><i></i><i></i><i></i><i></i></div>
        <div class="strength-text"><span>পাসওয়ার্ড শক্তি</span><span id="strengthLabel"></span></div>
      </div>

      <div class="field">
        <span class="field-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span>
        <input type="password" id="confirmPassword" placeholder="কনফার্ম পাসওয়ার্ড" autocomplete="new-password">
        <button type="button" class="field-toggle" aria-label="পাসওয়ার্ড দেখান" onclick="togglePass('confirmPassword', this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <div class="hint" id="matchHint"></div>

      <div class="field">
        <span class="field-icon">🎁</span>
        <input type="text" id="referCode" placeholder="Refer Code (optional)" autocomplete="off" autocapitalize="characters">
      </div>

      <div id="referInfo" class="refer-info">✅ Refer code applied!</div>

      <button class="btn-main" id="signupBtn">রেজিস্ট্রেশন সম্পন্ন করুন</button>

      <div class="perks">
        <div class="perk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>সিকিউর</div>
        <div class="perk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>৩০ সেকেন্ড</div>
        <div class="perk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/></svg>ফ্রি জয়েন</div>
      </div>

      <p class="switch-text">ইতিমধ্যে অ্যাকাউন্ট আছে?<a href="login.html">লগইন করুন</a></p>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase.js";
    import { createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { doc, setDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
    const EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function flashField(input, state) {
      const f = input.closest(".field");
      f.classList.remove("ok", "err");
      f.classList.add(state);
      setTimeout(() => f.classList.remove(state), 1500);
    }

    window.togglePass = function(id, btn) {
      const input = document.getElementById(id);
      input.type = input.type === "password" ? "text" : "password";
      btn.style.color = input.type === "text" ? "#a78bfa" : "";
      btn.innerHTML = input.type === "text" ? EYE_OFF : EYE;
    };

    function generateReferCode() {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let code = "ADQ";
      for (let i = 0; i < 5; i++) {
        code += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return code;
    }

    // URL থেকে রেফার কোড নেওয়া
    const urlRef = new URLSearchParams(location.search).get("ref");
    if (urlRef) {
      const clean = urlRef.toUpperCase().trim();
      document.getElementById("referCode").value = clean;
      document.getElementById("referBadge").style.display = "block";
      document.getElementById("referInfo").style.display = "block";
      document.getElementById("referInfo").innerHTML = "🎁 Refer code applied: <b>" + esc(clean) + "</b>";
    }

    // পাসওয়ার্ড শক্তি মিটার
    const pwInput = document.getElementById("password");
    const cpInput = document.getElementById("confirmPassword");
    const strengthBox = document.getElementById("strength");
    const strengthBars = strengthBox.querySelectorAll("i");
    const strengthLabel = document.getElementById("strengthLabel");
    const matchHint = document.getElementById("matchHint");
    const LEVELS = [
      { t: "দুর্বল", c: "#ef4444" },
      { t: "মাঝারি", c: "#f59e0b" },
      { t: "ভালো", c: "#22d3ee" },
      { t: "শক্তিশালী", c: "#10b981" }
    ];

    function checkStrength() {
      const v = pwInput.value;
      if (!v) { strengthBox.style.display = "none"; return; }
      strengthBox.style.display = "block";
      let s = 0;
      if (v.length >= 6) s++;
      if (v.length >= 10) s++;
      if (/[a-z]/.test(v) && /[A-Z]/.test(v)) s++;
      if (/\d/.test(v) && /[^A-Za-z0-9]/.test(v)) s++;
      const lvl = Math.max(1, s);
      strengthBars.forEach((b, i) => { b.style.background = i < lvl ? LEVELS[lvl - 1].c : ""; });
      strengthLabel.textContent = LEVELS[lvl - 1].t;
      strengthLabel.style.color = LEVELS[lvl - 1].c;
    }

    function checkMatch() {
      if (!cpInput.value) { matchHint.className = "hint"; matchHint.textContent = ""; return; }
      if (cpInput.value === pwInput.value) {
        matchHint.className = "hint ok"; matchHint.textContent = "✓ পাসওয়ার্ড মিলেছে";
      } else {
        matchHint.className = "hint err"; matchHint.textContent = "✕ পাসওয়ার্ড মিলছে না";
      }
    }
    pwInput.addEventListener("input", () => { checkStrength(); checkMatch(); });
    cpInput.addEventListener("input", checkMatch);

    const referInput = document.getElementById("referCode");
    const referInfo = document.getElementById("referInfo");
    let referTimer = null;

    // রেফার কোড টাইপ করার সময় ভ্যালিডেশন
    referInput.addEventListener("input", () => {
      clearTimeout(referTimer);
      const code = referInput.value.trim().toUpperCase();
      referInput.value = code;

      if (!code || code.length < 3) {
        referInfo.style.display = "none";
        return;
      }

      referTimer = setTimeout(async () => {
        try {
          const q = query(collection(db, "users"), where("myReferCode", "==", code));
          const snap = await getDocs(q);
          if (snap.empty) {
            referInfo.style.display = "none";
            flashField(referInput, "err");
          } else {
            flashField(referInput, "ok");
            referInfo.style.display = "block";
            referInfo.innerHTML = "✅ Valid! <b>" + esc(snap.docs[0].data().username) + "</b> referred you";
          }
        } catch (e) { 
          console.log("Refer check error:", e); 
        }
      }, 500);
    });

    document.getElementById("signupBtn").onclick = async () => {
      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const referCode = document.getElementById("referCode").value.trim().toUpperCase();
      const btn = document.getElementById("signupBtn");

      if (!username || !email || !password || !confirmPassword) return alert("সব ঘর পূরণ করুন!");
      if (password.length < 6) return alert("পাসওয়ার্ড কমপক্ষে ৬ অক্ষর!");
      if (password !== confirmPassword) return alert("পাসওয়ার্ড দুটো মিলছে না!");

      btn.disabled = true;
      btn.textContent = "তৈরি হচ্ছে...";

      try {
        let referrerId = null;
        
        // ১. রেফার কোড চেক করা (সাইনআপের আগে)
        if (referCode) {
          const rq = query(collection(db, "users"), where("myReferCode", "==", referCode));
          const rs = await getDocs(rq);
          if (!rs.empty) referrerId = rs.docs[0].id;
        }

        // ২. নতুন ইউজার অ্যাকাউন্ট তৈরি
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        
        // ৩. ফায়ারবেস সেশন আপডেট হওয়ার জন্য ১ সেকেন্ড অপেক্ষা (খুবই জরুরি)
        await new Promise(r => setTimeout(r, 1000));

        const myCode = generateReferCode();

        // ৪. ফায়ারস্টোরে ডেটা সেভ (শুধু নিজের ডকুমেন্ট)
        await setDoc(doc(db, "users", cred.user.uid), {
          username, 
          email, 
          role: "user",
          balance: 0, 
          totalGood: 0, 
          totalBad: 0, 
          totalPending: 0,
          myReferCode: myCode,
          referredBy: referrerId || null,
          referCount: 0,
          totalReferEarning: 0,
          createdAt: new Date()
        });

        // ৫. সাইনআপ শেষে লগআউট করে দেওয়া (যাতে পরিষ্কারভাবে লগইন পেজে যায়)
        await signOut(auth);

        document.getElementById("successBox").style.display = "flex";
        setTimeout(() => location.href = "login.html?registered=1", 1500);
        
      } catch (e) {
        // আসল এররটা কনসোলে দেখানোর জন্য
        console.error("Signup Error:", e);

        let msg = e.message;
        if (e.code === "auth/email-already-in-use") msg = "এই ইমেইল আগেই ব্যবহার হয়েছে!";
        else if (e.code === "auth/invalid-email") msg = "ইমেইল ফরম্যাট সঠিক নয়!";
        else if (e.code === "auth/weak-password") msg = "পাসওয়ার্ড দুর্বল!";
        else if (e.code === "permission-denied") msg = "ডেটাবেস পারমিশন সমস্যা। ফায়ারবেস রুলস চেক করুন।";
        
        alert("❌ " + msg);
        btn.disabled = false;
        btn.textContent = "রেজিস্ট্রেশন সম্পন্ন করুন";
      }
    };
  </script>
</body>
</html>
