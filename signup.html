<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>রেজিস্ট্রেশন — ADQ Income Zone</title>
  <link rel="stylesheet" href="style.css?v=28">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-box">
      <div class="auth-logo-mark">💰</div>
      <h1 class="auth-title">অ্যাকাউন্ট তৈরি করুন</h1>
      <p class="auth-subtitle">মাত্র ৩০ সেকেন্ডে রেজিস্ট্রেশন</p>

      <div id="successBox" class="alert alert-success" style="display:none">
        <div class="badge-icon">✓</div>
        <div>রেজিস্ট্রেশন সফল! লগইন পেজে নিয়ে যাচ্ছি...</div>
      </div>

      <div class="field">
        <span class="field-icon"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
        <input type="text" id="username" placeholder="আপনার নাম">
      </div>

      <div class="field">
        <span class="field-icon"><svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></span>
        <input type="email" id="email" placeholder="ইমেইল এড্রেস">
      </div>

      <div class="field">
        <span class="field-icon"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
        <input type="password" id="password" placeholder="পাসওয়ার্ড (৬+ অক্ষর)">
        <button type="button" class="field-toggle" onclick="togglePass('password', this)"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>

      <div class="field">
        <span class="field-icon"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span>
        <input type="password" id="confirmPassword" placeholder="কনফার্ম পাসওয়ার্ড">
        <button type="button" class="field-toggle" onclick="togglePass('confirmPassword', this)"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>

      <button class="btn btn-primary" id="signupBtn" style="margin-top:6px">রেজিস্ট্রেশন সম্পন্ন করুন</button>

      <p class="switch-text">ইতিমধ্যে অ্যাকাউন্ট আছে?<a href="login.html">লগইন করুন</a></p>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase.js";
    import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    window.togglePass = function(id, btn) {
      const input = document.getElementById(id);
      input.type = input.type === "password" ? "text" : "password";
      btn.style.color = input.type === "text" ? "#6366f1" : "";
    };

    document.getElementById("signupBtn").onclick = async () => {
      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const btn = document.getElementById("signupBtn");

      if (!username || !email || !password || !confirmPassword) return alert("সব ঘর পূরণ করুন!");
      if (password.length < 6) return alert("পাসওয়ার্ড কমপক্ষে ৬ অক্ষর!");
      if (password !== confirmPassword) return alert("পাসওয়ার্ড দুটো মিলছে না!");

      btn.disabled = true;
      btn.textContent = "তৈরি হচ্ছে...";

      try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        await setDoc(doc(db, "users", cred.user.uid), {
          username, email, role: "user",
          balance: 0, totalGood: 0, totalBad: 0, totalPending: 0,
          createdAt: new Date()
        });
        document.getElementById("successBox").style.display = "flex";
        setTimeout(() => location.href = "login.html?registered=1", 1500);
      } catch (e) {
        let msg = e.message;
        if (e.code === "auth/email-already-in-use") msg = "এই ইমেইল আগেই ব্যবহার হয়েছে!";
        else if (e.code === "auth/invalid-email") msg = "ইমেইল ফরম্যাট সঠিক নয়!";
        else if (e.code === "auth/weak-password") msg = "পাসওয়ার্ড দুর্বল!";
        alert("❌ " + msg);
        btn.disabled = false;
        btn.textContent = "রেজিস্ট্রেশন সম্পন্ন করুন";
      }
    };
  </script>
</body>
</html>
