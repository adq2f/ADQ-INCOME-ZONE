<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>রেজিস্ট্রেশন — ADQ Income Zone</title>
  <link rel="stylesheet" href="style.css?v=29">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-box">
      <div class="auth-logo-mark">💰</div>
      <h1 class="auth-title">অ্যাকাউন্ট তৈরি করুন</h1>
      <p class="auth-subtitle">মাত্র ৩০ সেকেন্ডে রেজিস্ট্রেশন</p>

      <div id="referBadge" style="text-align:center; display:none; margin-bottom:12px">
        <span style="display:inline-block;background:linear-gradient(135deg,#d1fae5,#a7f3d0);color:#065f46;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:700;border:2px solid #10b981">🎁 Refer Code Applied!</span>
      </div>

      <div id="successBox" class="alert alert-success" style="display:none">
        <div class="badge-icon">✓</div>
        <div>রেজিস্ট্রেশন সফল! লগইন পেজে নিয়ে যাচ্ছি...</div>
      </div>

      <div class="field">
        <span class="field-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
        <input type="text" id="username" placeholder="আপনার নাম">
      </div>

      <div class="field">
        <span class="field-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></span>
        <input type="email" id="email" placeholder="ইমেইল এড্রেস">
      </div>

      <div class="field">
        <span class="field-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
        <input type="password" id="password" placeholder="পাসওয়ার্ড (৬+ অক্ষর)">
        <button type="button" class="field-toggle" onclick="togglePass('password', this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>

      <div class="field">
        <span class="field-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span>
        <input type="password" id="confirmPassword" placeholder="কনফার্ম পাসওয়ার্ড">
        <button type="button" class="field-toggle" onclick="togglePass('confirmPassword', this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>

      <div class="field">
        <span class="field-icon">🎁</span>
        <input type="text" id="referCode" placeholder="Refer Code (optional)" autocomplete="off">
      </div>

      <div id="referInfo" style="display:none;background:linear-gradient(135deg,#fef3c7,#fde68a);padding:12px 14px;border-radius:10px;margin-bottom:14px;font-size:13px;color:#92400e;line-height:1.5;border-left:4px solid #f59e0b">
        ✅ Refer code applied!
      </div>

      <button class="btn btn-primary btn-full" id="signupBtn" style="margin-top:6px">রেজিস্ট্রেশন সম্পন্ন করুন</button>

      <p class="switch-text">ইতিমধ্যে অ্যাকাউন্ট আছে?<a href="login.html">লগইন করুন</a></p>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase.js";
    import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { doc, setDoc, collection, query, where, getDocs, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    window.togglePass = function(id, btn) {
      const input = document.getElementById(id);
      input.type = input.type === "password" ? "text" : "password";
      btn.style.color = input.type === "text" ? "#6366f1" : "";
    };

    function generateReferCode() {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let code = "ADQ";
      for (let i = 0; i < 5; i++) {
        code += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return code;
    }

    const urlRef = new URLSearchParams(location.search).get("ref");
    if (urlRef) {
      document.getElementById("referCode").value = urlRef.toUpperCase().trim();
      document.getElementById("referBadge").style.display = "block";
      document.getElementById("referInfo").style.display = "block";
      document.getElementById("referInfo").innerHTML = "🎁 Refer code applied: <b>" + urlRef.toUpperCase() + "</b>";
    }

    const referInput = document.getElementById("referCode");
    const referInfo = document.getElementById("referInfo");
    let referTimer = null;

    referInput.addEventListener("input", () => {
      clearTimeout(referTimer);
      const code = referInput.value.trim().toUpperCase();
      referInput.value = code;

      if (!code || code.length < 3) {
        referInfo.style.display = "none";
        return;
      }

      referTimer = setTimeout(async () => {
        try {
          const q = query(collection(db, "users"), where("myReferCode", "==", code));
          const snap = await getDocs(q);
          if (snap.empty) {
            referInfo.style.display = "none";
            referInput.style.borderColor = "#ef4444";
            setTimeout(() => referInput.style.borderColor = "", 1500);
          } else {
            referInput.style.borderColor = "#10b981";
            referInfo.style.display = "block";
            referInfo.innerHTML = "✅ Valid! <b>" + snap.docs[0].data().username + "</b> referred you";
            setTimeout(() => referInput.style.borderColor = "", 1500);
          }
        } catch (e) {}
      }, 500);
    });

    document.getElementById("signupBtn").onclick = async () => {
      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const referCode = document.getElementById("referCode").value.trim().toUpperCase();
      const btn = document.getElementById("signupBtn");

      if (!username || !email || !password || !confirmPassword) return alert("সব ঘর পূরণ করুন!");
      if (password.length < 6) return alert("পাসওয়ার্ড কমপক্ষে ৬ অক্ষর!");
      if (password !== confirmPassword) return alert("পাসওয়ার্ড দুটো মিলছে না!");

      btn.disabled = true;
      btn.textContent = "তৈরি হচ্ছে...";

      try {
        let referrerId = null;
        if (referCode) {
          const rq = query(collection(db, "users"), where("myReferCode", "==", referCode));
          const rs = await getDocs(rq);
          if (!rs.empty) referrerId = rs.docs[0].id;
        }

        const cred = await createUserWithEmailAndPassword(auth, email, password);

        const myCode = generateReferCode();

        // নতুন user নিজের doc তৈরি করছে — এটা rules-এ allowed
        await setDoc(doc(db, "users", cred.user.uid), {
          username, email, role: "user",
          balance: 0, totalGood: 0, totalBad: 0, totalPending: 0,
          myReferCode: myCode,
          referredBy: referrerId || null,
          referCount: 0,
          totalReferEarning: 0,
          createdAt: new Date()
        });

        // ⚠️ referrer-এর doc update এখানে করা হচ্ছে না
        // profile.html-এ Referral Count query দিয়ে দেখানো হবে

        document.getElementById("successBox").style.display = "flex";
        setTimeout(() => location.href = "login.html?registered=1", 1500);
      } catch (e) {
        let msg = e.message;
        if (e.code === "auth/email-already-in-use") msg = "এই ইমেইল আগেই ব্যবহার হয়েছে!";
        else if (e.code === "auth/invalid-email") msg = "ইমেইল ফরম্যাট সঠিক নয়!";
        else if (e.code === "auth/weak-password") msg = "পাসওয়ার্ড দুর্বল!";
        alert("❌ " + msg);
        btn.disabled = false;
        btn.textContent = "রেজিস্ট্রেশন সম্পন্ন করুন";
      }
    };
  </script>
</body>
</html>
