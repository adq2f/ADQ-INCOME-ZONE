<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task History — ADQ Income Zone</title>
  <link rel="stylesheet" href="style.css?v=35">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    .premium-history-card {
      background: white; border-radius: 20px; padding: 20px; margin-bottom: 16px;
      box-shadow: 0 8px 24px rgba(15,23,42,0.06); border: 1px solid rgba(226,232,240,0.8);
      border-left: 5px solid #6366f1; position: relative; overflow: hidden;
    }
    .premium-history-card.processed { border-left-color: #10b981; background: linear-gradient(90deg, #f0fdf4 0%, white 30%); }
    .phc-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .phc-title { font-size: 16px; font-weight: 900; color: #0f172a; margin-bottom: 4px; }
    .phc-meta { font-size: 12px; color: #64748b; font-weight: 600; }
    .phc-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
    .phc-stat { background: #f8fafc; padding: 12px 8px; border-radius: 12px; text-align: center; border: 1px solid #e2e8f0; }
    .phc-stat .v { font-size: 20px; font-weight: 900; font-family: 'Inter'; }
    .phc-stat.good .v { color: #10b981; }
    .phc-stat.bad .v { color: #ef4444; }
    .phc-stat.pending .v { color: #f59e0b; }
    .phc-stat .l { font-size: 10px; color: #64748b; font-weight: 800; text-transform: uppercase; margin-top: 4px; }
    .phc-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .phc-btn {
      flex: 1; min-width: 130px; padding: 12px 16px; border-radius: 12px; border: none;
      font-weight: 800; font-size: 13px; font-family: inherit; cursor: pointer; transition: 0.3s;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .phc-btn-submit { background: #eef2ff; color: #4f46e5; }
    .phc-btn-result { background: #d1fae5; color: #065f46; }
    .phc-btn:disabled { background: #f1f5f9; color: #94a3b8; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="navbar">
    <button class="nav-back" onclick="goBack()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="logo">
      <div class="mark">A</div>
      <span>Task History</span>
    </div>
    <button class="nav-logout" id="logoutBtn">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </div>

  <div class="container">
    <div class="card" style="background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%); color: white; border: none; border-radius: 20px; padding: 24px; margin-bottom: 20px; box-shadow: 0 16px 32px rgba(15,23,42,0.3);">
      <h2 style="color: white; font-size: 22px; margin-bottom: 4px; font-weight: 900;">📊 My Task History</h2>
      <p style="opacity: 0.9; font-size: 13px; margin: 0; font-weight: 600;">আপনার সাবমিট করা অ্যাকাউন্টের রেজাল্ট ডাউনলোড করুন</p>
    </div>

    <div class="tabs">
      <button class="active" data-filter="all">সব</button>
      <button data-filter="open">⏳ Pending</button>
      <button data-filter="processed">✅ Processed</button>
    </div>

    <div id="historyList" class="loading"><div class="spinner"></div>লোড হচ্ছে...</div>
  </div>

  <nav class="bottom-nav">
    <a href="dashboard.html" data-page="dashboard"><span class="nav-ic"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg></span><span class="nav-label">Dashboard</span></a>
    <a href="index.html#tasks" data-page="submit"><span class="nav-ic"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></span><span class="nav-label">Submit</span></a>
    <a href="leaderboard.html" data-page="leaderboard"><span class="nav-ic"><svg viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 010-5H6"/><path d="M18 9h1.5a2.5 2.5 0 000-5H18"/><path d="M4 22h16"/><path d="M18 2H6v7a6 6 0 0012 0V2z"/></svg></span><span class="nav-label">Leaders</span></a>
    <a href="task-history.html" data-page="history" class="active"><span class="nav-ic"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18.7 8l-5.1 5.2-2.8-2.7L7 14.3"/></svg></span><span class="nav-label">History</span></a>
    <a href="profile.html" data-page="profile"><span class="nav-ic"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><span class="nav-label">Profile</span></a>
  </nav>

  <script type="module">
    import { auth, db } from "./firebase.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { collection, query, where, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    window.goBack = function() {
      if (document.referrer && document.referrer.includes(window.location.hostname) && history.length > 1) {
        history.back();
      } else {
        location.href = "dashboard.html";
      }
    };

    let currentUser = null;
    let allTaskGroups = [];
    let currentFilter = "all";
    let taskCache = {};

    document.getElementById("logoutBtn").onclick = async () => {
      if (!confirm("লগআউট?")) return;
      await signOut(auth);
      location.href = "index.html";
    };

    onAuthStateChanged(auth, async (user) => {
      if (!user) { location.href = "login.html"; return; }
      currentUser = user;
      await loadHistory();
    });

    async function loadHistory() {
      const list = document.getElementById("historyList");
      try {
        // ⚡️ এখানে শুধু কারেন্ট ইউজারের সাবমিশন কোয়েরি করা হচ্ছে
        const q = query(collection(db, "submissions"), where("userId", "==", currentUser.uid));
        const snap = await getDocs(q);
        const subs = snap.docs.map(d => ({ id: d.id, ...d.data() }));

        if (subs.length === 0) {
          list.innerHTML = `<div class="dash-empty"><div class="em">📭</div><p>এখনো কোনো submission নেই</p></div>`;
          return;
        }

        const groups = {};
        subs.forEach(s => {
          if (!groups[s.taskId]) {
            groups[s.taskId] = { taskId: s.taskId, taskTitle: s.taskTitle || "Task", taskPlatform: s.taskPlatform || "Other", items: [] };
          }
          groups[s.taskId].items.push(s);
        });

        for (const taskId of Object.keys(groups)) {
          if (!taskCache[taskId]) {
            try {
              const tSnap = await getDoc(doc(db, "tasks", taskId));
              if (tSnap.exists()) taskCache[taskId] = tSnap.data();
            } catch (e) {}
          }
        }

        allTaskGroups = Object.values(groups).map(g => {
          const task = taskCache[g.taskId] || {};
          const end = task.endTime?.toDate?.();
          const now = new Date();
          const isClosed = end && now > end;
          const good = g.items.filter(i => i.status === "good").length;
          const bad = g.items.filter(i => i.status === "bad").length;
          const pending = g.items.filter(i => i.status === "pending").length;
          const isProcessed = pending === 0 && g.items.length > 0;
          return { ...g, isClosed, isProcessed, good, bad, pending, task };
        }).sort((a, b) => {
          const aTime = Math.max(...a.items.map(i => i.submittedAt?.toMillis?.() || 0));
          const bTime = Math.max(...b.items.map(i => i.submittedAt?.toMillis?.() || 0));
          return bTime - aTime;
        });

        renderHistory();
      } catch (e) {
        list.innerHTML = `<p style="color:red">${e.message}</p>`;
      }
    }

    function renderHistory() {
      const list = document.getElementById("historyList");
      let filtered = allTaskGroups;
      if (currentFilter === "open") filtered = allTaskGroups.filter(g => !g.isProcessed);
      else if (currentFilter === "processed") filtered = allTaskGroups.filter(g => g.isProcessed);

      if (filtered.length === 0) {
        list.innerHTML = `<div class="dash-empty"><div class="em">📭</div><p>এই filter-এ কিছু নেই</p></div>`;
        return;
      }

      const platformIcons = { Facebook: "📘", Twitter: "🐦", Instagram: "📷", LinkedIn: "💼", TikTok: "🎵", Gmail: "📧", WhatsApp: "💬", Other: "🔗" };

      list.innerHTML = filtered.map(g => {
        const icon = platformIcons[g.taskPlatform] || "🔗";
        const submitDisabled = !g.isClosed;
        const resultDisabled = !g.isProcessed;
        return `
          <div class="premium-history-card ${g.isProcessed ? 'processed' : ''}">
            <div class="phc-head">
              <div>
                <div class="phc-title">${icon} ${g.taskTitle}</div>
                <div class="phc-meta">📊 ${g.items.length} submissions • 🌐 ${g.taskPlatform}</div>
              </div>
              ${g.isProcessed ? '<span style="background:#d1fae5;color:#065f46;padding:4px 12px;border-radius:20px;font-size:10px;font-weight:800;">✅ PROCESSED</span>' : '<span style="background:#fef3c7;color:#92400e;padding:4px 12px;border-radius:20px;font-size:10px;font-weight:800;">⏳ PENDING</span>'}
            </div>
            <div class="phc-stats">
              <div class="phc-stat good"><div class="v">${g.good}</div><div class="l">Good</div></div>
              <div class="phc-stat bad"><div class="v">${g.bad}</div><div class="l">Bad</div></div>
              <div class="phc-stat pending"><div class="v">${g.pending}</div><div class="l">Pending</div></div>
            </div>
            <div class="phc-actions">
              <button class="phc-btn phc-btn-submit" onclick="downloadSubmitXLSX('${g.taskId}')" ${submitDisabled ? 'disabled' : ''}>
                📊 My Submissions
              </button>
              <button class="phc-btn phc-btn-result" onclick="downloadResultXLSX('${g.taskId}')" ${resultDisabled ? 'disabled' : ''}>
                📥 Download Result
              </button>
            </div>
          </div>
        `;
      }).join("");
    }

    window.downloadSubmitXLSX = function(taskId) {
      if (typeof XLSX === "undefined") return alert("XLSX library load হয়নি!");
      const group = allTaskGroups.find(g => g.taskId === taskId);
      if (!group) return alert("Task পাওয়া যায়নি!");
      const task = taskCache[taskId] || {};
      const fields = task.fields || [{ key: "uid", label: "UID" }, { key: "password", label: "Password" }, { key: "2fa_key", label: "2FA Key" }];
      
      const sheetData = group.items.map((s, idx) => {
        const row = { "#": idx + 1 };
        fields.forEach(f => {
          let v = s[f.key];
          if ((v === undefined || v === null || v === "") && f.label) {
            const altKey = f.label.toLowerCase().replace(/[^a-z0-9]/g, "");
            for (const k of Object.keys(s)) {
              if (k.toLowerCase().replace(/[^a-z0-9]/g, "") === altKey) { v = s[k]; break; }
            }
          }
          row[f.label] = (v === undefined || v === null) ? "" : String(v);
        });
        row["Submitted At"] = s.submittedAt?.toDate?.().toLocaleString("en-GB", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }) || "";
        row["Status"] = s.status || "pending";
        return row;
      });
      
      const ws = XLSX.utils.json_to_sheet(sheetData);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "My Submissions");
      const now = new Date();
      const dateStr = now.toISOString().slice(0, 10);
      XLSX.writeFile(wb, `${group.taskTitle.replace(/\s+/g, "_")}_my_submissions_${dateStr}.xlsx`);
    };

    window.downloadResultXLSX = function(taskId) {
      if (typeof XLSX === "undefined") return alert("XLSX library load হয়নি!");
      const group = allTaskGroups.find(g => g.taskId === taskId);
      if (!group) return alert("Task পাওয়া যায়নি!");
      const task = taskCache[taskId] || {};
      const fields = task.fields || [{ key: "uid", label: "UID" }];
      
      // ⚡️ এখানে শুধু ওই ইউজারের Good এবং Bad অ্যাকাউন্টগুলো ফিল্টার করা হচ্ছে
      const goodItems = group.items.filter(i => i.status === "good");
      const badItems = group.items.filter(i => i.status === "bad");
      
      const goodSheet = goodItems.map((s, idx) => {
        const row = { "#": idx + 1 };
        fields.forEach(f => {
          let v = s[f.key];
          if ((v === undefined || v === null || v === "") && f.label) {
            const altKey = f.label.toLowerCase().replace(/[^a-z0-9]/g, "");
            for (const k of Object.keys(s)) {
              if (k.toLowerCase().replace(/[^a-z0-9]/g, "") === altKey) { v = s[k]; break; }
            }
          }
          row[f.label] = (v === undefined || v === null) ? "" : String(v);
        });
        row["Earned"] = "৳" + (s.price || 0);
        row["Submitted At"] = s.submittedAt?.toDate?.().toLocaleString("en-GB") || "";
        return row;
      });
      
      const badSheet = badItems.map((s, idx) => {
        const row = { "#": idx + 1 };
        fields.forEach(f => {
          let v = s[f.key];
          if ((v === undefined || v === null || v === "") && f.label) {
            const altKey = f.label.toLowerCase().replace(/[^a-z0-9]/g, "");
            for (const k of Object.keys(s)) {
              if (k.toLowerCase().replace(/[^a-z0-9]/g, "") === altKey) { v = s[k]; break; }
            }
          }
          row[f.label] = (v === undefined || v === null) ? "" : String(v);
        });
        row["Earned"] = "৳0";
        row["Submitted At"] = s.submittedAt?.toDate?.().toLocaleString("en-GB") || "";
        return row;
      });
      
      const wb = XLSX.utils.book_new();
      const wsGood = XLSX.utils.json_to_sheet(goodSheet.length ? goodSheet : [{ "No Data": "No good accounts" }]);
      XLSX.utils.book_append_sheet(wb, wsGood, "GOOD Accounts");
      const wsBad = XLSX.utils.json_to_sheet(badSheet.length ? badSheet : [{ "No Data": "No bad accounts" }]);
      XLSX.utils.book_append_sheet(wb, wsBad, "BAD Accounts");
      
      const totalEarned = goodItems.reduce((sum, s) => sum + (s.price || 0), 0);
      const summary = [
        { "Summary": "Total Submissions", "Value": group.items.length },
        { "Summary": "✅ GOOD Accounts", "Value": goodItems.length },
        { "Summary": "❌ BAD Accounts", "Value": badItems.length },
        { "Summary": "💰 Total Earned", "Value": "৳" + totalEarned }
      ];
      const wsSummary = XLSX.utils.json_to_sheet(summary);
      XLSX.utils.book_append_sheet(wb, wsSummary, "Summary");
      
      const now = new Date();
      const dateStr = now.toISOString().slice(0, 10);
      XLSX.writeFile(wb, `${group.taskTitle.replace(/\s+/g, "_")}_result_${dateStr}.xlsx`);
    };

    document.querySelectorAll(".tabs button").forEach(tab => {
      tab.onclick = () => {
        document.querySelectorAll(".tabs button").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        currentFilter = tab.dataset.filter;
        renderHistory();
      };
    });
  </script>
</body>
</html>
