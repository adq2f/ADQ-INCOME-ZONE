<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - ADQ Income Zone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="navbar">
    <h2>🛡️ Admin Panel</h2>
    <div>
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="#" id="logoutBtn">Logout</a>
    </div>
  </div>

  <div class="container">
    <div class="tabs">
      <button id="tabTask" class="active">📋 Tasks</button>
      <button id="tabNotice">📢 Notice</button>
      <button id="tabResult">✅ Result</button>
    </div>

    <!-- TASK SECTION -->
    <div id="taskSection">
      <div class="card">
        <h3>➕ Add New Task</h3>
        <input type="text" id="taskTitle" placeholder="Task Title">
        <textarea id="taskDesc" placeholder="Description"></textarea>
        <input type="number" id="taskPrice" placeholder="Price per account (৳)" min="1">
        <button class="btn-green btn-full" id="addTaskBtn">Add Task</button>
      </div>

      <h3 style="margin: 16px 0 12px;">📋 All Tasks</h3>
      <div id="taskList" class="loading">Loading...</div>
    </div>

    <!-- NOTICE SECTION -->
    <div id="noticeSection" style="display:none">
      <div class="card">
        <h3>📢 Post Notice</h3>
        <input type="text" id="noticeTitle" placeholder="Notice Title">
        <textarea id="noticeMsg" placeholder="Notice Message"></textarea>
        <button class="btn-green btn-full" id="addNoticeBtn">Publish Notice</button>
      </div>

      <h3 style="margin: 16px 0 12px;">📢 Active Notices</h3>
      <div id="noticeList" class="loading">Loading...</div>
    </div>

    <!-- RESULT SECTION -->
    <div id="resultSection" style="display:none">
      <div class="card">
        <h3>✅ Upload Result (Bad UID List)</h3>
        <select id="resultTask"></select>
        <p style="font-size:13px; color:#666; margin:8px 0">
          Bad UID list paste করো (প্রতি লাইনে একটা):
        </p>
        <textarea id="badUids" placeholder="100005
100012
100045"></textarea>
        <button class="btn-orange btn-full" id="processBtn">🚀 Process Result</button>
      </div>

      <div id="resultOutput"></div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import {
      doc, getDoc, collection, addDoc, updateDoc, query, where, getDocs, orderBy, limit
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    document.getElementById("logoutBtn").onclick = async (e) => {
      e.preventDefault();
      await signOut(auth);
      location.href = "index.html";
    };

    // Tabs
    const tabs = {
      tabTask: "taskSection",
      tabNotice: "noticeSection",
      tabResult: "resultSection"
    };
    Object.keys(tabs).forEach(tabId => {
      document.getElementById(tabId).onclick = () => {
        Object.keys(tabs).forEach(t => {
          document.getElementById(t).classList.remove("active");
          document.getElementById(tabs[t]).style.display = "none";
        });
        document.getElementById(tabId).classList.add("active");
        document.getElementById(tabs[tabId]).style.display = "block";
      };
    });

    let currentUser = null;

    // Auth + Admin check
    onAuthStateChanged(auth, async (user) => {
      if (!user) { location.href = "login.html"; return; }
      currentUser = user;

      const snap = await getDoc(doc(db, "users", user.uid));
      if (!snap.exists() || snap.data().role !== "admin") {
        alert("❌ তুমি admin না!");
        location.href = "index.html";
        return;
      }

      loadTasks();
      loadNotices();
      loadResultTaskDropdown();
    });

    // ============ TASK ============
    document.getElementById("addTaskBtn").onclick = async () => {
      const title = document.getElementById("taskTitle").value.trim();
      const desc = document.getElementById("taskDesc").value.trim();
      const price = parseFloat(document.getElementById("taskPrice").value);
      const btn = document.getElementById("addTaskBtn");

      if (!title || !price) return alert("Title & Price দাও!");
      btn.disabled = true; btn.textContent = "Adding...";

      try {
        await addDoc(collection(db, "tasks"), {
          title, description: desc, pricePerAccount: price,
          active: true, createdAt: new Date()
        });
        alert("✅ Task added!");
        document.getElementById("taskTitle").value = "";
        document.getElementById("taskDesc").value = "";
        document.getElementById("taskPrice").value = "";
        loadTasks();
      } catch (e) { alert("❌ " + e.message); }
      btn.disabled = false; btn.textContent = "Add Task";
    };

    async function loadTasks() {
      const list = document.getElementById("taskList");
      const q = query(collection(db, "tasks"), orderBy("createdAt", "desc"));
      const snap = await getDocs(q);

      if (snap.empty) {
        list.innerHTML = `<p style="color:#666">কোনো task নেই।</p>`;
        return;
      }
      list.innerHTML = snap.docs.map(d => {
        const t = d.data();
        return `
          <div class="task-card">
            <h3>${t.title}</h3>
            <span class="price">৳${t.pricePerAccount}/account</span>
            <p>${t.description || ""}</p>
            <button class="btn-red" onclick="deleteTask('${d.id}')">Delete</button>
          </div>
        `;
      }).join("");
    }

    window.deleteTask = async (id) => {
      if (!confirm("Delete করবে?")) return;
      await updateDoc(doc(db, "tasks", id), { active: false });
      loadTasks();
    };

    // ============ NOTICE ============
    document.getElementById("addNoticeBtn").onclick = async () => {
      const title = document.getElementById("noticeTitle").value.trim();
      const message = document.getElementById("noticeMsg").value.trim();

      if (!title || !message) return alert("সব ঘর পূরণ করো!");

      try {
        // Deactivate old notices
        const oldQ = query(collection(db, "notices"), where("active", "==", true));
        const oldSnap = await getDocs(oldQ);
        for (const d of oldSnap.docs) {
          await updateDoc(doc(db, "notices", d.id), { active: false });
        }

        await addDoc(collection(db, "notices"), {
          title, message, active: true, createdAt: new Date()
        });
        alert("✅ Notice published!");
        document.getElementById("noticeTitle").value = "";
        document.getElementById("noticeMsg").value = "";
        loadNotices();
      } catch (e) { alert("❌ " + e.message); }
    };

    async function loadNotices() {
      const list = document.getElementById("noticeList");
      const q = query(collection(db, "notices"), where("active", "==", true));
      const snap = await getDocs(q);

      if (snap.empty) {
        list.innerHTML = `<p style="color:#666">কোনো notice নেই।</p>`;
        return;
      }
      list.innerHTML = snap.docs.map(d => {
        const n = d.data();
        return `
          <div class="notice">
            <h3>📢 ${n.title}</h3>
            <p>${n.message}</p>
            <button class="btn-red" style="margin-top:8px" onclick="deleteNotice('${d.id}')">Delete</button>
          </div>
        `;
      }).join("");
    }

    window.deleteNotice = async (id) => {
      await updateDoc(doc(db, "notices", id), { active: false });
      loadNotices();
    };

    // ============ RESULT PROCESS ============
    async function loadResultTaskDropdown() {
      const sel = document.getElementById("resultTask");
      const q = query(collection(db, "tasks"), where("active", "==", true));
      const snap = await getDocs(q);
      sel.innerHTML = '<option value="">-- Task Select --</option>' +
        snap.docs.map(d => `<option value="${d.id}">${d.data().title}</option>`).join("");
    }

    document.getElementById("processBtn").onclick = async () => {
      const taskId = document.getElementById("resultTask").value;
      const badText = document.getElementById("badUids").value.trim();
      const btn = document.getElementById("processBtn");
      const output = document.getElementById("resultOutput");

      if (!taskId) return alert("Task select করো!");
      if (!badText) return alert("Bad UID list paste করো!");

      const badList = badText.split("\n").map(x => x.trim()).filter(Boolean);
      const badSet = new Set(badList);

      btn.disabled = true; btn.textContent = "Processing...";

      try {
        // Get task price
        const taskSnap = await getDoc(doc(db, "tasks", taskId));
        const task = taskSnap.data();
        const price = task.pricePerAccount;

        // Get all pending submissions of this task
        const q = query(
          collection(db, "submissions"),
          where("taskId", "==", taskId),
          where("status", "==", "pending")
        );
        const snap = await getDocs(q);

        let goodCount = 0, badCount = 0;
        const userUpdates = {};

        for (const subDoc of snap.docs) {
          const sub = subDoc.data();
          const isBad = badSet.has(sub.uid);

          await updateDoc(doc(db, "submissions", subDoc.id), {
            status: isBad ? "bad" : "good",
            earned: isBad ? 0 : price,
            checkedAt: new Date()
          });

          if (!userUpdates[sub.userId]) {
            userUpdates[sub.userId] = { good: 0, bad: 0, earned: 0 };
          }
          if (isBad) {
            userUpdates[sub.userId].bad++;
            badCount++;
          } else {
            userUpdates[sub.userId].good++;
            userUpdates[sub.userId].earned += price;
            goodCount++;
          }
        }

        // Update users (balance, counts)
        for (const [userId, data] of Object.entries(userUpdates)) {
          const uRef = doc(db, "users", userId);
          const uSnap = await getDoc(uRef);
          if (!uSnap.exists()) continue;
          const u = uSnap.data();
          await updateDoc(uRef, {
            balance: (u.balance || 0) + data.earned,
            totalGood: (u.totalGood || 0) + data.good,
            totalBad: (u.totalBad || 0) + data.bad,
            totalPending: Math.max(0, (u.totalPending || 0) - (data.good + data.bad))
          });
        }

        output.innerHTML = `
          <div class="card">
            <h3>✅ Result Processed!</h3>
            <p>Total: ${snap.size}</p>
            <p style="color:#16a34a">✅ Good: ${goodCount}</p>
            <p style="color:#dc2626">❌ Bad: ${badCount}</p>
            <p>💰 Total Added: ৳${goodCount * price}</p>
          </div>
        `;
        document.getElementById("badUids").value = "";
      } catch (e) {
        alert("❌ " + e.message);
      }
      btn.disabled = false; btn.textContent = "🚀 Process Result";
    };
  </script>
</body>
</html>
