<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#06060f">
<title>Submit — ADQ Income Zone</title>
<script src="app-shell.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
.t-head{flex:0 0 auto;display:flex;align-items:baseline;justify-content:space-between;margin:2px 2px 10px}
.t-head h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.3px}
.t-head .cnt{font:800 12px 'Inter',sans-serif;color:#c4b5fd;background:rgba(99,102,241,.22);padding:3px 11px;border-radius:999px}
.t-notice{flex:0 0 auto;display:flex;align-items:center;gap:9px;width:100%;margin-top:10px;padding:9px 12px;border-radius:14px;border:1px solid rgba(251,191,36,.35);background:linear-gradient(135deg,rgba(251,191,36,.14),rgba(245,158,11,.04));color:#fde68a;font-size:12.5px;font-weight:600;cursor:pointer;text-align:left;overflow:hidden}
.t-notice svg{width:16px;height:16px;flex:0 0 16px}
.notice-marquee{flex:1;min-width:0;overflow:hidden;display:flex;align-items:center;position:relative;height:18px}
.notice-text{white-space:nowrap;display:inline-block;padding-left:100%;animation:marqueeNotice 12s linear infinite}
@keyframes marqueeNotice{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}
.t-notice .chev{width:14px;height:14px;opacity:.7;flex:0 0 14px}
.x-scroll{margin-top:10px}
.x-rb{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.x-rs{display:flex;align-items:center;gap:6px;margin-top:5px;flex-wrap:nowrap;overflow:hidden;width:100%}
.x-tag.time{width:86px;min-width:86px;flex-shrink:0;justify-content:center;font-variant-numeric:tabular-nums;font-family:'Inter',monospace;font-size:10px;padding:2px 0;white-space:nowrap;overflow:hidden}
.x-go{flex-shrink:0}
@keyframes blinkDanger{0%,100%{color:#fca5a5;background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.4);box-shadow:0 0 8px rgba(239,68,68,.2)}50%{color:#ef4444;background:rgba(239,68,68,.35);border-color:rgba(239,68,68,.8);box-shadow:0 0 12px rgba(239,68,68,.6);font-weight:900}}
.x-tag.time.danger{animation:blinkDanger 1s infinite;border:1px solid #ef4444}
.x-price{cursor:pointer; position:relative; transition:transform 0.2s}
.x-price:active{transform:scale(0.92)}

/* Modal for Milestone */
.ms-modal{position:fixed;inset:0;z-index:9999;display:flex;align-items:flex-end;justify-content:center;background:rgba(3,3,10,.8);backdrop-filter:blur(8px);opacity:0;visibility:hidden;transition:opacity .3s}
.ms-modal.show{opacity:1;visibility:visible}
.ms-sheet{width:100%;max-width:520px;background:linear-gradient(180deg,#17172f,#0d0d1f);border:1px solid rgba(255,255,255,.12);border-bottom:none;border-radius:28px 28px 0 0;transform:translateY(100%);transition:transform .4s cubic-bezier(.2,.8,.2,1);padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.ms-modal.show .ms-sheet{transform:translateY(0)}
.ms-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.ms-head h3{margin:0;font-size:18px;font-weight:700;color:#fff}
.ms-close{background:rgba(255,255,255,.1);border:none;color:#fff;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px}
.ms-body{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.ms-item{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.05);padding:12px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.08)}
.ms-item span{font-size:14px;font-weight:700;color:#dcdcf2}
.ms-item b{font-size:15px;font-weight:900;color:#6ee7b7;font-family:'Inter'}
.ms-item.highlight{background:linear-gradient(135deg, rgba(251,191,36,.15), rgba(245,158,11,.05));border-color:rgba(251,191,36,.4)}
.ms-item.highlight span{color:#fde68a}
.ms-item.highlight b{color:#fbbf24}
</style>
</head>
<body class="x-body">
<div class="x-bg" aria-hidden="true"><div class="o o1"></div><div class="o o2"></div></div>

<div class="x-app">
  <header class="x-top">
    <div class="x-brand"><div class="x-mark">A</div><span>Submit Task</span></div>
    <div class="x-actions">
      <a class="x-ibtn" href="notifications.html" aria-label="Notifications" id="bellBtn"></a>
    </div>
  </header>

  <div class="t-head"><h2>Available Tasks</h2><span class="cnt" id="taskCount">0</span></div>

  <div class="x-search"><span id="searchIc"></span><input type="text" id="taskSearch" placeholder="টাস্কের নাম খুঁজুন..." autocomplete="off"></div>
  <div class="x-chips" id="filters">
    <button class="active" data-f="all">সব</button>
    <button data-f="open">Open</button>
    <button data-f="upcoming">Upcoming</button>
  </div>

  <button class="t-notice" id="noticeBar" hidden></button>

  <div class="x-scroll" id="taskList"><div class="x-skel"></div><div class="x-skel"></div><div class="x-skel"></div><div class="x-skel"></div></div>
</div>

<!-- Milestone Modal -->
<div class="ms-modal" id="msModal">
  <div class="ms-sheet">
    <div class="ms-head">
      <h3 id="msTitle">Milestones</h3>
      <button class="ms-close" onclick="document.getElementById('msModal').classList.remove('show')">✕</button>
    </div>
    <div class="ms-body" id="msBody"></div>
  </div>
</div>

<div class="x-sheet" id="noticeSheet">
  <div class="x-sheet-box">
    <div class="x-sheet-h"><h3 id="nsTitle"></h3><button class="x-ibtn" id="nsClose" aria-label="Close"></button></div>
    <div class="x-sheet-b" id="nsBody"></div>
  </div>
</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { collection, query, where, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

window.adqHold = true;
const { esc, svg: S, logo } = window.ADQ;
const $ = (id) => document.getElementById(id);

$("bellBtn").innerHTML = S.bell;
$("searchIc").innerHTML = S.search;
$("nsClose").innerHTML = S.close;

let allTasks = [], filter = "all";
window._tasksCache = {};
const safeUrl = (u) => /^https?:\/\//i.test(u || "") ? u : "";

function getFormattedTime(endMs, startMs) {
  const now = Date.now();
  if (startMs && now < startMs) {
    const diff = startMs - now;
    return { k: "upcoming", t: "শুরু " + fmt(diff), isDanger: false };
  }
  if (endMs && now > endMs) return { k: "closed", t: "শেষ", isDanger: false };
  if (!endMs) return { k: "open", t: "Open", isDanger: false };
  const diff = endMs - now;
  const isDanger = diff > 0 && diff <= 5 * 60 * 1000;
  return { k: "open", t: fmt(diff), isDanger };
}

function fmt(ms) {
  let h = Math.floor(ms / 3600000);
  let m = Math.floor((ms % 3600000) / 60000);
  let s = Math.floor((ms % 60000) / 1000);
  return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
}

window.showMilestones = function(event, taskId) {
  event.preventDefault();
  event.stopPropagation();
  const t = window._tasksCache[taskId];
  if(!t || !t.milestones || t.milestones.length === 0) return;

  $("msTitle").textContent = "Milestones - ৳" + t.pricePerAccount;
  const body = $("msBody");
  body.innerHTML = t.milestones.map((m, i) => {
    const isHighest = i === t.milestones.length - 1;
    return `<div class="ms-item ${isHighest ? 'highlight' : ''}">
      <span>${m.target}+ Accounts (Good)</span>
      <b>৳${m.price}/ea</b>
    </div>`;
  }).join("");
  
  $("msModal").classList.add("show");
};

function customTaskRow(t) {
  let startMs = t.startTime?.toDate?.()?.getTime() || 0;
  let endMs = t.endTime?.toDate?.()?.getTime() || 0;
  let st = getFormattedTime(endMs, startMs);
  let fields = (t.fields || []).length;
  let clickAttr = (t.milestones && t.milestones.length > 0) ? `onclick="showMilestones(event, '${t.id}')"` : "";
  
  return `<a class="x-row" href="task.html?id=${esc(t.id)}">
    ${logo(t.platform)}
    <div class="x-rb">
      <div class="x-rt">${esc(t.title)}</div>
      <div class="x-rs">
        <span class="x-price" ${clickAttr}>৳${esc(t.pricePerAccount)}</span>
        <span class="x-tag time ${st.k}" data-start="${startMs}" data-end="${endMs}">
          <i></i><span class="time-text">${st.t}</span>
        </span>
        <span class="x-tag">${S.layers} ${fields}</span>
      </div>
    </div>
    <span class="x-go">${S.chev}</span>
  </a>`;
}

function render() {
  const list = $("taskList");
  const q = ($("taskSearch").value || "").trim().toLowerCase();
  const rows = allTasks.filter(t => {
    if (q && !(t.title || "").toLowerCase().includes(q)) return false;
    let now = Date.now();
    let sMs = t.startTime?.toDate?.()?.getTime() || 0;
    let eMs = t.endTime?.toDate?.()?.getTime() || 0;
    let k = getFormattedTime(eMs, sMs).k;
    if (filter === "open") return k === "open";
    if (filter === "upcoming") return k === "upcoming";
    return true;
  });
  $("taskCount").textContent = rows.length;
  list.innerHTML = rows.length
    ? rows.map(customTaskRow).join("")
    : `<div class="x-empty">${S.search}কোনো টাস্ক খুঁজে পাওয়া যায়নি</div>`;
}

$("taskSearch").addEventListener("input", render);
document.querySelectorAll("#filters button").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll("#filters button").forEach(x => x.classList.toggle("active", x === b));
    filter = b.dataset.f;
    render();
  };
});

setInterval(() => {
  document.querySelectorAll('.x-tag.time').forEach(el => {
    const startMs = Number(el.dataset.start) || 0;
    const endMs = Number(el.dataset.end) || 0;
    const st = getFormattedTime(endMs, startMs);
    const textEl = el.querySelector('.time-text');
    if (textEl) textEl.textContent = st.t;
    el.className = `x-tag time ${st.k}${st.isDanger ? ' danger' : ''}`;
  });
}, 1000);

onAuthStateChanged(auth, (user) => {
  if (!user) { location.href = "login.html"; return; }

  onSnapshot(query(collection(db, "tasks"), where("active", "==", true)), (snap) => {
    const now = new Date();
    allTasks = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .filter(t => { const e = t.endTime?.toDate?.(); return !e || e > now; })
      .sort((a, b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));
      
    window._tasksCache = {};
    allTasks.forEach(t => window._tasksCache[t.id] = t);

    render();
    window.adqReady && window.adqReady();
  }, (e) => {
    $("taskList").innerHTML = `<div class="x-empty">${esc(e.message)}</div>`;
    window.adqReady && window.adqReady();
  });

  loadNotice();
});

async function loadNotice() {
  try {
    const snap = await getDocs(query(collection(db, "notices"), where("active", "==", true)));
    if (snap.empty) return;
    const n = snap.docs.map(d => d.data()).sort((a, b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0))[0];
    const bar = $("noticeBar");
    bar.innerHTML = S.bell + `<div class="notice-marquee"><span class="notice-text">${esc(n.title)}</span></div>` + S.chev.replace("<svg", '<svg class="chev"');
    const dur = Math.max(8, n.title.length * 0.2);
    bar.querySelector('.notice-text').style.animationDuration = dur + 's';
    bar.hidden = false;
    bar.onclick = () => {
      $("nsTitle").textContent = n.title || "নোটিশ";
      const apk = safeUrl(n.apkUrl), link = safeUrl(n.linkUrl);
      $("nsBody").innerHTML = `<div>${esc(n.message).replace(/\n/g, "<br>")}</div>` +
        ((apk || link) ? `<div class="acts">${apk ? `<a class="apk" href="${esc(apk)}" target="_blank" rel="noopener noreferrer">Download APK</a>` : ""}${link ? `<a href="${esc(link)}" target="_blank" rel="noopener noreferrer">Open Link</a>` : ""}</div>` : "");
      $("noticeSheet").classList.add("show");
    };
  } catch (e) {}
}
$("nsClose").onclick = () => $("noticeSheet").classList.remove("show");
$("noticeSheet").addEventListener("click", (e) => { if (e.target === $("noticeSheet")) $("noticeSheet").classList.remove("show"); });
</script>
</body>
</html>
