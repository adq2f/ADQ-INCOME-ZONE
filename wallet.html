<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#06060f">
<title>Wallet — ADQ Income Zone</title>
<script src="app-shell.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
.w-bal{flex:0 0 auto;margin-bottom:10px}
.w-l{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;opacity:.9}
.w-l svg{width:16px;height:16px;margin-right:6px;display:inline-block;vertical-align:-3px}
.w-chip{width:34px;height:25px;border-radius:6px;background:linear-gradient(135deg,#fde68a,#f59e0b);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.w-a{font:900 38px 'Inter',sans-serif;letter-spacing:-1.2px;line-height:1.05;margin:8px 0 12px;text-shadow:0 6px 18px rgba(0,0,0,.25)}
.w-acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.w-b{display:flex;align-items:center;justify-content:center;gap:7px;padding:11px;border-radius:14px;font-size:13.5px;font-weight:700;color:#fff;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.28)}
.w-b.solid{background:#fff;color:#4c1d95;border-color:#fff;box-shadow:0 10px 22px -8px rgba(0,0,0,.45)}
.w-b svg{width:16px;height:16px}
.pm-tile{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:8px;border-radius:18px;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 12px 24px -12px var(--c1),inset 0 1px 0 rgba(255,255,255,.28)}
.pm-dot{width:34px;height:34px;flex:0 0 34px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.22);font:900 15px 'Inter',sans-serif}
.pm-info{flex:1;min-width:0}
.pm-info b{display:block;font-size:12.5px;opacity:.9}
.pm-info span{display:block;font:800 16px 'Inter',sans-serif;letter-spacing:.4px;word-break:break-all}
.pm-info small{font-size:11.5px;opacity:.8}
.pm-copy{width:34px;height:34px;flex:0 0 34px;border-radius:11px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.16);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.pm-copy svg{width:16px;height:16px}
.wm-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:4px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);margin-bottom:10px}
.wm-tab{padding:9px 2px;border-radius:11px;border:none;background:transparent;color:#9a9bb8;font-size:12.5px;font-weight:700;cursor:pointer}
.wm-tab.active{color:#fff;background:linear-gradient(135deg,#6366f1,#8b5cf6)}
.sheet-pad{padding:0 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet-acts{display:grid;grid-template-columns:1fr 54px;gap:10px;margin-top:12px}
</style>
</head>
<body class="x-body">
<div class="x-bg" aria-hidden="true"><div class="o o1"></div><div class="o o2"></div></div>

<div class="x-app">
  <header class="x-top">
    <div class="x-brand"><div class="x-mark">A</div><span>My Wallet</span></div>
    <div class="x-actions"><button class="x-ibtn danger" id="logoutBtn" aria-label="Logout"></button></div>
  </header>

  <section class="x-hero w-bal">
    <div class="w-l"><span id="icWallet"></span><div class="w-chip"></div></div>
    <div class="w-a" id="balance">৳0</div>
    <div class="w-acts">
      <a href="withdraw.html" id="withdrawBtnLink" class="w-b solid"></a>
      <a href="task-history.html" class="w-b" id="histBtn"></a>
    </div>
  </section>

  <div class="x-stats">
    <div class="x-st" style="--c:#34d399"><b id="statGood">0</b><span>Good</span></div>
    <div class="x-st" style="--c:#f87171"><b id="statBad">0</b><span>Bad</span></div>
    <div class="x-st" style="--c:#fbbf24"><b id="statPending">0</b><span>Pending</span></div>
  </div>

  <div class="x-seg">
    <button class="active" data-p="pHist" id="segHist"></button>
    <button data-p="pPay" id="segPay"></button>
  </div>

  <div class="x-scroll" id="pHist"><div class="x-skel"></div><div class="x-skel"></div></div>

  <div class="x-scroll" id="pPay" hidden>
    <div id="walletInfoContent"></div>
    <button class="x-btn ghost" id="editWalletBtn"></button>
  </div>
</div>

<div class="x-sheet" id="walletModal">
  <div class="x-sheet-box">
    <div class="x-sheet-h"><h3 style="color:#fff">Wallet Setup</h3><button class="x-ibtn" id="closeWalletX" aria-label="Close"></button></div>
    <div class="sheet-pad">
      <div class="wm-tabs">
        <button class="wm-tab active" data-method="bkash">bKash</button>
        <button class="wm-tab" data-method="nagad">Nagad</button>
        <button class="wm-tab" data-method="rocket">Rocket</button>
        <button class="wm-tab" data-method="binance">Binance</button>
      </div>
      <div class="x-lab" id="wmLabel">bKash Number</div>
      <div class="x-field"><span class="ic" id="icPhone"></span><input type="text" id="wm-number" placeholder="01XXXXXXXXX" autocomplete="off"></div>
      <div class="x-lab">Account Name (optional)</div>
      <div class="x-field"><span class="ic" id="icUser"></span><input type="text" id="wm-name" placeholder="আপনার নাম" autocomplete="off"></div>
      <div class="sheet-acts">
        <button class="x-btn" id="saveWalletBtn"></button>
        <button class="x-btn ghost" id="closeWalletBtn" aria-label="Close"></button>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { doc, getDoc, updateDoc, collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

window.adqHold = true;
const { esc, svg: S, toast } = window.ADQ;
const $ = (id) => document.getElementById(id);

// ✅ Inline SVG for safety (app-shell.js এর ওপর নির্ভরশীল নয়)
const SVG_COPY = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
const SVG_EDIT = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`;
const SVG_PHONE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>`;
const SVG_USER = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`;

$("logoutBtn").innerHTML = S.logout;
$("icWallet").innerHTML = S.wallet + "Available Balance";
$("withdrawBtnLink").innerHTML = S.download + "Withdraw";
$("histBtn").innerHTML = S.activity + "History";
$("segHist").innerHTML = S.clock + "Withdraw History";
$("segPay").innerHTML = S.wallet + "Payment Info";
$("editWalletBtn").innerHTML = SVG_EDIT + " Payment Info Edit";
$("closeWalletX").innerHTML = S.close;
$("closeWalletBtn").innerHTML = S.close;
$("saveWalletBtn").innerHTML = S.check + "Save";
$("icPhone").innerHTML = SVG_PHONE;
$("icUser").innerHTML = SVG_USER;

document.querySelectorAll(".x-seg button").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll(".x-seg button").forEach(x => x.classList.toggle("active", x === b));
    ["pHist", "pPay"].forEach(id => { $(id).hidden = id !== b.dataset.p; });
  };
});

let currentUser = null, userData = null, started = false;
let enabledMethods = { bkash: true, nagad: true, rocket: true, binance: true };
let tempWalletData = {}, activeMethod = "bkash";
const ready = { user: false, wd: false };
const mark = (k) => { ready[k] = true; if (ready.user && ready.wd) window.adqReady && window.adqReady(); };

const METHOD_NAMES = { bkash: "bKash", nagad: "Nagad", rocket: "Rocket", binance: "Binance" };
const METHOD_LABELS = { bkash: "bKash Number", nagad: "Nagad Number", rocket: "Rocket Number", binance: "Binance Wallet/ID" };
const METHOD_PH = { bkash: "01XXXXXXXXX", nagad: "01XXXXXXXXX", rocket: "01XXXXXXXXX", binance: "Binance ID or Address" };
const COLORS = { bkash: ["#e2136e", "#9d0b4f"], nagad: ["#f6921e", "#d1560f"], rocket: ["#8c3494", "#5b1f66"], binance: ["#f0b90b", "#b8860b"] };

function normalizeWallet(method, raw) {
  const s = String(raw || "").trim();
  if (method === "binance") return /^[A-Za-z0-9_.@:+-]{4,80}$/.test(s) ? s : null;
  const d = s.replace(/[\s-]/g, "");
  const m = d.match(/^(?:\+?88)?(01[3-9]\d{8})$/);
  return m ? m[1] : null;
}

$("logoutBtn").onclick = async () => {
  if (!confirm("লগআউট?")) return;
  await signOut(auth);
  location.href = "login.html";
};

onAuthStateChanged(auth, async (user) => {
  if (!user) { location.href = "login.html"; return; }
  if (started) return;
  started = true;
  currentUser = user;

  try {
    const snap = await getDoc(doc(db, "settings", "payment_methods"));
    if (snap.exists()) enabledMethods = { ...enabledMethods, ...snap.data() };
  } catch (e) {}
  if (!Object.keys(METHOD_NAMES).some(k => enabledMethods[k] !== false)) {
    const l = $("withdrawBtnLink"); l.style.opacity = ".5"; l.style.pointerEvents = "none";
  }

  onSnapshot(doc(db, "users", user.uid), (snap) => {
    if (snap.exists()) {
      userData = snap.data();
      $("balance").textContent = "৳" + (Number(userData.balance) || 0);
      $("statGood").textContent = userData.totalGood || 0;
      $("statBad").textContent = userData.totalBad || 0;
      $("statPending").textContent = userData.totalPending || 0;
      if (userData.walletInfo && userData.walletInfo.method && !userData.wallets) {
        userData.wallets = { [userData.walletInfo.method]: { number: userData.walletInfo.number, name: userData.walletInfo.name || "" } };
      }
      renderWallets();
    }
    mark("user");
  }, () => mark("user"));

  onSnapshot(query(collection(db, "withdrawals"), where("userId", "==", user.uid)), (snap) => {
    const items = snap.docs.map(d => d.data()).sort((a, b) => (b.requestedAt?.toMillis?.() || 0) - (a.requestedAt?.toMillis?.() || 0));
    renderHistory(items);
    mark("wd");
  }, (e) => { $("pHist").innerHTML = `<div class="x-empty">${esc(e.message)}</div>`; mark("wd"); });
});

function renderHistory(items) {
  const box = $("pHist");
  let ap = 0, pe = 0;
  items.forEach(h => { if (h.status === "approved") ap += Number(h.amount) || 0; else if (h.status === "pending") pe += Number(h.amount) || 0; });
  if (!items.length) { box.innerHTML = `<div class="x-empty">${S.inbox}এখনো কোনো withdraw নেই</div>`; return; }
  box.innerHTML = `<div class="x-stats"><div class="x-st" style="--c:#818cf8"><b>${items.length}</b><span>Requests</span></div><div class="x-st" style="--c:#34d399"><b>৳${ap}</b><span>Approved</span></div><div class="x-st" style="--c:#fbbf24"><b>৳${pe}</b><span>Pending</span></div></div>` +
    items.map((h, i) => {
      const st = h.status === "approved" ? "approved" : h.status === "rejected" ? "rejected" : "pending";
      const col = st === "approved" ? "#10b981" : st === "rejected" ? "#ef4444" : "#f59e0b";
      const cls = st === "approved" ? "g" : st === "rejected" ? "r" : "y";
      const txt = st === "approved" ? "Approved" : st === "rejected" ? "Rejected" : "Pending";
      const [c1, c2] = COLORS[h.method] || ["#6366f1", "#312e81"];
      const time = h.requestedAt?.toDate?.().toLocaleString("bn-BD", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) || "";
      return `<div class="x-item" style="--c:${col};animation-delay:${Math.min(i, 8) * 0.04}s">
        <div class="x-ia" style="--c1:${c1};--c2:${c2}">${esc((h.methodName || h.method || "?").charAt(0).toUpperCase())}</div>
        <div style="flex:1;min-width:0"><div class="x-it">৳${esc(h.amount)} <span style="font-weight:600;color:#9a9bb8">• ${esc(h.methodName || h.method)}</span></div>
        <div class="x-is">${esc(h.accountNum)} • ${time}</div></div>
        <span class="x-amt ${cls}">${txt}</span></div>`;
    }).join("");
}

function renderWallets() {
  const c = $("walletInfoContent");
  const w = userData?.wallets || {};
  const keys = Object.keys(w).filter(k => w[k] && w[k].number);
  if (!keys.length) { c.innerHTML = `<div class="x-empty">${S.wallet}কোনো Wallet setup করা হয়নি</div>`; return; }
  c.innerHTML = keys.map(k => {
    const [c1, c2] = COLORS[k] || ["#6366f1", "#312e81"];
    return `<div class="pm-tile" style="--c1:${c1};--c2:${c2}">
      <div class="pm-dot">${esc((METHOD_NAMES[k] || k).charAt(0))}</div>
      <div class="pm-info"><b>${esc(METHOD_NAMES[k] || k)}</b><span>${esc(w[k].number)}</span>${w[k].name ? `<small>${esc(w[k].name)}</small>` : ""}</div>
      <button class="pm-copy" data-copy="${esc(w[k].number)}" aria-label="Copy">${SVG_COPY}</button></div>`;
  }).join("");
}

$("walletInfoContent").addEventListener("click", (e) => {
  const b = e.target.closest(".pm-copy");
  if (!b) return;
  navigator.clipboard?.writeText(b.dataset.copy).then(() => toast("Copied!")).catch(() => {});
});

const modal = $("walletModal");
const closeModal = () => modal.classList.remove("show");
$("editWalletBtn").onclick = () => {
  tempWalletData = JSON.parse(JSON.stringify(userData?.wallets || {}));
  loadTab("bkash");
  modal.classList.add("show");
};
$("closeWalletBtn").onclick = closeModal;
$("closeWalletX").onclick = closeModal;
modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });
document.querySelectorAll(".wm-tab").forEach(t => { t.onclick = () => { stash(); loadTab(t.dataset.method); }; });

function stash() {
  const num = $("wm-number").value.trim(), name = $("wm-name").value.trim();
  if (num) tempWalletData[activeMethod] = { number: num, name }; else delete tempWalletData[activeMethod];
}
function loadTab(m) {
  activeMethod = m;
  document.querySelectorAll(".wm-tab").forEach(t => t.classList.toggle("active", t.dataset.method === m));
  $("wmLabel").textContent = METHOD_LABELS[m];
  $("wm-number").placeholder = METHOD_PH[m];
  const d = tempWalletData[m] || {};
  $("wm-number").value = d.number || "";
  $("wm-name").value = d.name || "";
}

$("saveWalletBtn").onclick = async () => {
  stash();
  const cleaned = {};
  for (const k of Object.keys(tempWalletData)) {
    const w = tempWalletData[k];
    if (!w || !w.number) continue;
    const n = normalizeWallet(k, w.number);
    if (!n) { alert(METHOD_NAMES[k] + " এর নম্বর সঠিক নয়।"); loadTab(k); return; }
    cleaned[k] = { number: n, name: w.name || "" };
  }
  const btn = $("saveWalletBtn");
  btn.disabled = true;
  try {
    await updateDoc(doc(db, "users", currentUser.uid), { wallets: cleaned });
    userData.wallets = cleaned;
    renderWallets();
    closeModal();
    toast("Wallet saved!");
  } catch (e) { alert(e.message); }
  finally { btn.disabled = false; }
};
</script>
</body>
</html>
