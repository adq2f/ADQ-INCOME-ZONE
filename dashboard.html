<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ড্যাশবোর্ড — ADQ Income Zone</title>
  <link rel="stylesheet" href="style.css?v=4">
  <style>
    /* ===== WELCOME ===== */
    .dash-welcome {
      background: white;
      padding: 18px;
      border-radius: 16px;
      margin-bottom: 14px;
      box-shadow: 0 2px 12px rgba(15,23,42,0.05);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .dash-welcome .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 20px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .dash-welcome h3 {
      font-size: 15px;
      color: #0f172a;
      font-weight: 700;
      margin-bottom: 2px;
    }
    .dash-welcome p {
      font-size: 12px;
      color: #64748b;
      word-break: break-all;
    }

    /* ===== BALANCE ===== */
    .dash-balance {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
      color: white;
      padding: 24px 20px;
      border-radius: 20px;
      margin-bottom: 14px;
      box-shadow: 0 12px 32px rgba(99,102,241,0.32);
      position: relative;
      overflow: hidden;
    }
    .dash-balance::before {
      content: '';
      position: absolute;
      top: -80px;
      right: -60px;
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(255,255,255,0.2), transparent 70%);
      border-radius: 50%;
    }
    .dash-balance-label {
      font-size: 11px;
      opacity: 0.85;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 4px;
      position: relative;
      z-index: 1;
    }
    .dash-balance-amount {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -1.5px;
      margin-bottom: 18px;
      position: relative;
      z-index: 1;
      line-height: 1;
    }
    .dash-balance-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      position: relative;
      z-index: 1;
    }
    .dash-balance-actions a,
    .dash-balance-actions button {
      padding: 11px;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.28);
      border-radius: 10px;
      color: white;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      font-family: inherit;
      transition: 0.2s;
      margin: 0;
      box-shadow: none;
      width: 100%;
    }
    .dash-balance-actions a:hover,
    .dash-balance-actions button:hover {
      background: rgba(255,255,255,0.3);
      transform: translateY(-1px);
    }

    /* ===== STATS ===== */
    .dash-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .dash-stat {
      background: white;
      padding: 16px 10px;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 2px 12px rgba(15,23,42,0.05);
      border: 1px solid rgba(15,23,42,0.04);
    }
    .dash-stat .ic {
      font-size: 22px;
      margin-bottom: 6px;
      line-height: 1;
    }
    .dash-stat .n {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.5px;
    }
    .dash-stat .l {
      font-size: 10px;
      color: #64748b;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }
    .dash-stat.g .n { color: #10b981; }
    .dash-stat.b .n { color: #ef4444; }
    .dash-stat.p .n { color: #f59e0b; }

    /* ===== SECTION HEADER ===== */
    .dash-section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 22px 0 12px;
    }
    .dash-section-head h3 {
      font-size: 16px;
      font-weight: 700;
      color: #0f172a;
    }
    .dash-section-head a {
      font-size: 12px;
      color: #6366f1;
      text-decoration: none;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 8px;
      background: #eef2ff;
    }

    /* ===== QUICK ACTIONS ===== */
    .dash-quick {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .dash-quick-item {
      background: white;
      padding: 14px 8px;
      border-radius: 14px;
      text-align: center;
      text-decoration: none;
      color: #0f172a;
      box-shadow: 0 2px 12px rgba(15,23,42,0.05);
      border: 1px solid rgba(15,23,42,0.04);
      transition: 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .dash-quick-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(99,102,241,0.2);
      border-color: #6366f1;
    }
    .dash-quick-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .qi-purple { background: #eef2ff; }
    .qi-green { background: #d1fae5; }
    .qi-orange { background: #fef3c7; }
    .qi-blue { background: #dbeafe; }
    .dash-quick-label {
      font-size: 11px;
      font-weight: 600;
      color: #475569;
    }

    /* ===== NOTICE ===== */
    .dash-notice {
      background: linear-gradient(135deg, #fef3c7, #fde68a);
      border-left: 4px solid #f59e0b;
      padding: 14px 16px;
      border-radius: 14px;
      margin-bottom: 14px;
      box-shadow: 0 4px 16px rgba(245,158,11,0.15);
    }
    .dash-notice h4 {
      font-size: 14px;
      color: #92400e;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .dash-notice p {
      font-size: 13px;
      color: #78350f;
      line-height: 1.5;
    }

    /* ===== TASK CARD ===== */
    .dash-task {
      background: white;
      padding: 16px;
      border-radius: 14px;
      margin-bottom: 10px;
      box-shadow: 0 2px 12px rgba(15,23,42,0.05);
      border: 1px solid rgba(15,23,42,0.04);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      transition: 0.2s;
    }
    .dash-task:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(99,102,241,0.15);
      border-color: #6366f1;
    }
    .dash-task-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }
    .dash-task-logo {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, #3b5998, #1877f2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: white;
      font-weight: 800;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(24,119,242,0.3);
    }
    .dash-task-logo.default {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
    }
    .dash-task-info {
      min-width: 0;
      flex: 1;
    }
    .dash-task-info h4 {
      font-size: 14px;
      color: #0f172a;
      font-weight: 700;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dash-task-info .price {
      display: inline-block;
      background: #d1fae5;
      color: #065f46;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
    }
    .dash-task-btn {
      padding: 9px 16px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(99,102,241,0.3);
    }

    /* ===== RECENT SUB ===== */
    .dash-recent {
      background: white;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 8px;
      box-shadow: 0 2px 8px rgba(15,23,42,0.04);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .dash-recent-info {
      min-width: 0;
      flex: 1;
    }
    .dash-recent-info .uid {
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
      word-break: break-all;
    }
    .dash-recent-info .time {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .dash-recent-earned {
      font-size: 13px;
      font-weight: 800;
      color: #10b981;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .dash-recent-earned.zero { color: #94a3b8; }

    /* ===== EMPTY ===== */
    .dash-empty {
      background: white;
      padding: 30px 20px;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(15,23,42,0.04);
      color: #64748b;
    }
    .dash-empty .em { font-size: 40px; margin-bottom: 8px; }
    .dash-empty p { font-size: 13px; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <div class="navbar">
    <div class="logo">
      <div class="mark">A</div>
      <span>ADQ Income Zone</span>
    </div>
    <div class="navbar-links">
      <a href="index.html">Home</a>
      <a href="wallet.html">Wallet</a>
      <a href="profile.html">Profile</a>
      <a href="#" id="logoutBtn">Logout</a>
    </div>
  </div>

  <div class="container">

    <!-- Welcome -->
    <div class="dash-welcome">
      <div class="avatar" id="avatar">U</div>
      <div style="min-width:0; flex:1">
        <h3>👋 স্বাগতম, <span id="username">...</span></h3>
        <p id="email">...</p>
      </div>
    </div>

    <!-- Balance -->
    <div class="dash-balance">
      <div class="dash-balance-label">💰 আপনার ব্যালেন্স</div>
      <div class="dash-balance-amount" id="balance">৳0</div>
      <div class="dash-balance-actions">
        <button onclick="alert('শীঘ্রই আসছে! 🚀')">📥 Withdraw</button>
        <a href="wallet.html">📜 History</a>
      </div>
    </div>

    <!-- Stats -->
    <div class="dash-stats">
      <div class="dash-stat g">
        <div class="ic">✅</div>
        <div class="n" id="statGood">0</div>
        <div class="l">Good</div>
      </div>
      <div class="dash-stat b">
        <div class="ic">❌</div>
        <div class="n" id="statBad">0</div>
        <div class="l">Bad</div>
      </div>
      <div class="dash-stat p">
        <div class="ic">⏳</div>
        <div class="n" id="statPending">0</div>
        <div class="l">Pending</div>
      </div>
    </div>

    <!-- Notice -->
    <div id="noticeArea"></div>

    <!-- Quick Actions -->
    <div class="dash-section-head">
      <h3>⚡ Quick Actions</h3>
    </div>
    <div class="dash-quick">
      <a href="index.html" class="dash-quick-item">
        <div class="dash-quick-icon qi-purple">📤</div>
        <div class="dash-quick-label">Submit</div>
      </a>
      <a href="my-submissions.html" class="dash-quick-item">
        <div class="dash-quick-icon qi-green">📁</div>
        <div class="dash-quick-label">My Subs</div>
      </a>
      <a href="wallet.html" class="dash-quick-item">
        <div class="dash-quick-icon qi-orange">💰</div>
        <div class="dash-quick-label">Wallet</div>
      </a>
      <a href="notifications.html" class="dash-quick-item">
        <div class="dash-quick-icon qi-blue">🔔</div>
        <div class="dash-quick-label">Notifs</div>
      </a>
    </div>

    <!-- Tasks -->
    <div class="dash-section-head">
      <h3>🎯 Available Tasks</h3>
      <a href="index.html">সব দেখো →</a>
    </div>
    <div id="taskList" class="loading"><div class="spinner"></div>লোড হচ্ছে...</div>

    <!-- Recent -->
    <div class="dash-section-head">
      <h3>📋 সাম্প্রতিক Submission</h3>
      <a href="my-submissions.html">সব দেখো →</a>
    </div>
    <div id="recentList" class="loading"><div class="spinner"></div>লোড হচ্ছে...</div>

  </div>

  <script type="module">
    import { auth, db } from "./firebase.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import {
      doc, getDoc, collection, query, where, getDocs, limit
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    document.getElementById("logoutBtn").onclick = async (e) => {
      e.preventDefault();
      if (!confirm("লগআউট করতে চান?")) return;
      await signOut(auth);
      location.href = "index.html";
    };

    onAuthStateChanged(auth, async (user) => {
      if (!user) { location.href = "login.html"; return; }

      const userSnap = await getDoc(doc(db, "users", user.uid));
      if (!userSnap.exists()) { location.href = "login.html"; return; }
      const u = userSnap.data();

      document.getElementById("username").textContent = u.username || "User";
      document.getElementById("email").textContent = u.email || "";
      document.getElementById("avatar").textContent = (u.username || "U").charAt(0).toUpperCase();
      document.getElementById("balance").textContent = "৳" + (u.balance || 0);
      document.getElementById("statGood").textContent = u.totalGood || 0;
      document.getElementById("statBad").textContent = u.totalBad || 0;
      document.getElementById("statPending").textContent = u.totalPending || 0;

      loadNotice();
      loadTasks();
      loadRecentSubmissions(user.uid);
    });

    // Notice (no index needed)
    async function loadNotice() {
      const area = document.getElementById("noticeArea");
      try {
        const q = query(collection(db, "notices"), where("active", "==", true));
        const snap = await getDocs(q);
        if (snap.empty) { area.innerHTML = ""; return; }

        // Manual sort by createdAt desc
        const notices = snap.docs.map(d => d.data());
        notices.sort((a, b) => {
          const ta = a.createdAt?.toMillis?.() || 0;
          const tb = b.createdAt?.toMillis?.() || 0;
          return tb - ta;
        });
        const n = notices[0];

        area.innerHTML = `
          <div class="dash-notice">
            <h4>📢 ${n.title}</h4>
            <p>${n.message}</p>
          </div>
        `;
      } catch (e) { area.innerHTML = ""; }
    }

    // Tasks (no index needed)
    async function loadTasks() {
      const list = document.getElementById("taskList");
      try {
        const q = query(collection(db, "tasks"), where("active", "==", true));
        const snap = await getDocs(q);

        if (snap.empty) {
          list.innerHTML = `
            <div class="dash-empty">
              <div class="em">📭</div>
              <p>এখনো কোনো task নেই</p>
            </div>
          `;
          return;
        }

        // Manual sort + limit 3
        const tasks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        tasks.sort((a, b) => {
          const ta = a.createdAt?.toMillis?.() || 0;
          const tb = b.createdAt?.toMillis?.() || 0;
          return tb - ta;
        });
        const top3 = tasks.slice(0, 3);

        list.innerHTML = top3.map(t => {
          // Detect Facebook task
          const isFB = /facebook|fb/i.test(t.title || "");
          const logoClass = isFB ? "dash-task-logo" : "dash-task-logo default";
          const logoText = isFB ? "f" : (t.title || "T").charAt(0).toUpperCase();

          return `
            <div class="dash-task">
              <div class="dash-task-left">
                <div class="${logoClass}">${logoText}</div>
                <div class="dash-task-info">
                  <h4>${t.title}</h4>
                  <span class="price">৳${t.pricePerAccount}/account</span>
                </div>
              </div>
              <a href="task.html?id=${t.id}" class="dash-task-btn">Submit →</a>
            </div>
          `;
        }).join("");
      } catch (e) {
        list.innerHTML = `<div class="dash-empty"><p style="color:#ef4444">Error: ${e.message}</p></div>`;
      }
    }

    // Recent (no index needed)
    async function loadRecentSubmissions(uid) {
      const list = document.getElementById("recentList");
      try {
        const q = query(collection(db, "submissions"), where("userId", "==", uid));
        const snap = await getDocs(q);

        if (snap.empty) {
          list.innerHTML = `
            <div class="dash-empty">
              <div class="em">📭</div>
              <p>এখনো কোনো submission নেই</p>
            </div>
          `;
          return;
        }

        // Manual sort + limit 5
        const subs = snap.docs.map(d => d.data());
        subs.sort((a, b) => {
          const ta = a.submittedAt?.toMillis?.() || 0;
          const tb = b.submittedAt?.toMillis?.() || 0;
          return tb - ta;
        });
        const top5 = subs.slice(0, 5);

        list.innerHTML = top5.map(s => {
          const icon = s.status === "good" ? "✅" : s.status === "bad" ? "❌" : "⏳";
          const earned = s.status === "good" ? `+৳${s.price || 0}`
                        : s.status === "bad" ? "৳0" : "Pending";
          const time = s.submittedAt?.toDate?.().toLocaleString("bn-BD", {
            day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"
          }) || "";
          return `
            <div class="dash-recent">
              <div class="dash-recent-info">
                <div class="uid">${icon} ${s.uid}</div>
                <div class="time">🕐 ${time}</div>
              </div>
              <span class="dash-recent-earned ${s.status === "good" ? "" : "zero"}">${earned}</span>
            </div>
          `;
        }).join("");
      } catch (e) {
        list.innerHTML = `<div class="dash-empty"><p style="color:#ef4444">Error: ${e.message}</p></div>`;
      }
    }
  </script>
</body>
</html>
