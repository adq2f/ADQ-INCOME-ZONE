<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#06060f">
<title>Dashboard — ADQ Income Zone</title>
<script src="app-shell.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #06060f; --ink: #f4f4ff; --muted: #9a9bb8; --line: rgba(255,255,255,.08);
  --brand: #6366f1; --accent: #8b5cf6; --cyan: #22d3ee; --green: #10b981; --red: #ef4444;
}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
html,body{background:var(--bg)!important;margin:0;padding:0;height:100vh;height:100dvh;overflow:hidden;font-family:'Hind Siliguri','Inter',sans-serif;color:var(--ink)}
a{text-decoration:none;color:inherit} button{font-family:inherit}

/* Background Glow */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(90px);will-change:transform}
.orb.o1{width:420px;height:420px;background:#4f46e5;top:-140px;left:-120px;opacity:.4;animation:dr1 20s ease-in-out infinite}
.orb.o2{width:380px;height:380px;background:#9333ea;bottom:-160px;right:-120px;opacity:.3;animation:dr2 24s ease-in-out infinite}
@keyframes dr1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,40px) scale(1.1)}}
@keyframes dr2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-40px,-50px) scale(1.08)}}

/* Smooth Animations */
@keyframes slideUpFade{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes marqueeNotice{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}

/* Layout - FIXED NO SCROLL */
.app{position:relative;z-index:1;max-width:520px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:0 16px}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) 0 12px;flex-shrink:0;animation:slideUpFade .5s ease both}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;letter-spacing:-.3px}
.mark{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#6366f1,#8b5cf6 55%,#22d3ee);color:#fff;font-family:'Inter';font-weight:900;font-size:16px;box-shadow:0 8px 20px -6px rgba(139,92,246,.8),inset 0 1px 0 rgba(255,255,255,.35)}
.actions{display:flex;gap:8px}
.ibtn{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;flex:0 0 36px}
.ibtn:hover{color:#fff;background:rgba(255,255,255,.1)}
.ibtn.danger:hover{background:rgba(239,68,68,.18);border-color:rgba(239,68,68,.45);color:#fca5a5}
.ibtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* Compact Hero Card */
.hero{flex-shrink:0;position:relative;overflow:hidden;border-radius:24px;padding:16px;margin-bottom:12px;background:linear-gradient(135deg,#312e81 0%,#5b21b6 50%,#7e22ce 100%);box-shadow:0 20px 40px -15px rgba(124,58,237,.7),inset 0 1px 0 rgba(255,255,255,.2);animation:slideUpFade .6s cubic-bezier(.2,.8,.2,1) both}
.hero::before{content:'';position:absolute;top:-50%;left:-30%;width:120%;height:150%;background:radial-gradient(circle,rgba(255,255,255,.15),transparent 60%);pointer-events:none}

/* Top Row: Name & Badge */
.h-top{display:flex;align-items:flex-start;justify-content:space-between;position:relative;z-index:1}
.h-user{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.avatar{width:38px;height:38px;flex-shrink:0;border-radius:50%;background:rgba(0,0,0,.3);border:1.5px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-family:'Inter';font-weight:800;font-size:15px;box-shadow:0 8px 16px -4px rgba(0,0,0,.4)}
.u-info{display:flex;flex-direction:column;min-width:0;flex:1}
.u-hi{font-size:10.5px;opacity:.8;font-weight:500;letter-spacing:.5px}
.u-name{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px;width:100%;margin-top:2px}
.name-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px;display:inline-block}

/* Exact Profile Badge */
.premium-badge{width:20px;height:20px;flex-shrink:0;position:relative;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:linear-gradient(135deg,#fceabb 0%,#f8b500 50%,#b47b00 100%);box-shadow:0 4px 10px rgba(245,158,11,.4),inset 0 -2px 4px rgba(0,0,0,.3),inset 0 2px 4px rgba(255,255,255,.8);animation:premiumPulse 2s ease-in-out infinite alternate;overflow:hidden;border:1px solid #ffd700}
.premium-badge::before{content:'✓';color:#fff;font-size:10px;font-weight:900;position:relative;z-index:2;text-shadow:0 2px 4px rgba(180,123,0,.9)}
.premium-badge::after{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(45deg,rgba(255,255,255,0) 20%,rgba(255,255,255,.9) 50%,rgba(255,255,255,0) 80%);transform:rotate(45deg);animation:premiumShine 3s infinite ease-in-out}
@keyframes premiumPulse{0%{box-shadow:0 4px 10px rgba(245,158,11,.4),inset 0 -2px 4px rgba(0,0,0,.3),inset 0 2px 4px rgba(255,255,255,.8);transform:scale(1)}100%{box-shadow:0 8px 20px rgba(245,158,11,.8),inset 0 -2px 4px rgba(0,0,0,.3),inset 0 2px 4px rgba(255,255,255,.8);transform:scale(1.05)}}
@keyframes premiumShine{0%{left:-100%}20%{left:100%}100%{left:100%}}

/* Middle Row: Balance & Green Withdraw */
.h-mid{display:flex;align-items:flex-end;justify-content:space-between;margin-top:14px;position:relative;z-index:1}
.h-bal{display:flex;flex-direction:column}
.bal-l{font-size:11px;font-weight:600;opacity:.85;margin-bottom:4px;display:flex;align-items:center;gap:5px}
.bal-a{font-family:'Inter';font-weight:900;font-size:32px;letter-spacing:-1px;line-height:1;text-shadow:0 4px 12px rgba(0,0,0,.3)}

/* Tall Green Withdraw Button */
.btn-wd{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 20px;border-radius:14px;background:linear-gradient(135deg,#10b981,#059669);color:#fff;font-size:12.5px;font-weight:800;box-shadow:0 10px 25px -6px rgba(16,185,129,.7),inset 0 1px 0 rgba(255,255,255,.3);transition:all .25s cubic-bezier(.2,.8,.2,1);flex-shrink:0;height:56px}
.btn-wd svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.btn-wd:active{transform:scale(.94);box-shadow:0 5px 15px -5px rgba(16,185,129,.7)}

/* Bottom Row: Stats */
.h-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px;position:relative;z-index:1}
.st-box{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:8px 4px;text-align:center;transition:.3s;backdrop-filter:blur(10px)}
.st-box:hover{background:rgba(0,0,0,.4);transform:translateY(-2px)}
.st-box b{display:block;font-family:'Inter';font-size:15px;font-weight:900;line-height:1.2}
.st-box span{font-size:10px;opacity:.8;font-weight:600;letter-spacing:.5px}

/* Notice Bar */
.notice{flex-shrink:0;display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;border-radius:14px;border:1px solid rgba(245,158,11,.3);background:linear-gradient(135deg,rgba(245,158,11,.15),rgba(245,158,11,.05));color:#fde68a;font-size:12.5px;font-weight:600;cursor:pointer;text-align:left;margin-bottom:12px;transition:.3s;animation:slideUpFade .7s ease both;overflow:hidden}
.notice > svg{width:16px;height:16px;flex:0 0 16px;color:#fbbf24}
.notice-marquee{overflow:hidden;flex:1;min-width:0;position:relative;height:18px;display:flex;align-items:center}
.notice-text{white-space:nowrap;position:absolute;animation:marqueeNotice 10s linear infinite;font-weight:inherit}
.notice .chev{width:14px;height:14px;opacity:.6;flex:0 0 14px}

/* Tabs */
.seg{flex-shrink:0;display:flex;background:rgba(255,255,255,.04);padding:4px;border-radius:16px;margin-bottom:12px;position:relative;border:1px solid var(--line);animation:slideUpFade .8s ease both}
.seg-btn{flex:1;padding:10px;border-radius:12px;border:none;background:transparent;color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:.3s;position:relative;z-index:1}
.seg-btn.active{color:#fff}
.seg-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.seg-bg{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:12px;box-shadow:0 8px 20px -6px rgba(139,92,246,.8);transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:0}
.seg.right .seg-bg{transform:translateX(100%)}
.seg .count{font-family:'Inter';background:rgba(255,255,255,.2);padding:1px 6px;border-radius:999px;font-size:10px}

/* List Area (Only this scrolls) */
.content-area{flex:1;overflow-y:auto;scrollbar-width:none;padding-bottom:calc(100px + env(safe-area-inset-bottom,0px));animation:fadeIn .5s ease both}
.content-area::-webkit-scrollbar{display:none}
.hidden{display:none!important}

/* Task Rows */
.task-item{display:flex;align-items:center;gap:10px;padding:10px;margin-bottom:8px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:18px;transition:.3s;animation:slideUpFade .4s ease both}
.task-item:hover{background:rgba(255,255,255,.06);transform:translateY(-2px);border-color:rgba(139,92,246,.4)}
.t-logo{width:42px;height:42px;flex:0 0 42px;border-radius:12px;padding:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 16px -6px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.2)}
.t-logo svg{width:100%;height:100%}
.t-info{flex:1;min-width:0}
.t-title{font-size:13.5px;font-weight:700;color:#fff;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tag{padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:800;font-family:'Inter';display:flex;align-items:center;gap:4px}
.tag.price{background:rgba(16,185,129,.15);color:#6ee7b7;border:1px solid rgba(16,185,129,.3)}
.tag.time{color:#9a9bb8;font-weight:600}
.tag.time.open{color:#6ee7b7}.tag.time.closed{color:#fca5a5}
.t-arrow{width:28px;height:28px;flex:0 0 28px;border-radius:9px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 12px -4px rgba(139,92,246,.8)}
.t-arrow svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

/* Activity Rows */
.act-item{display:flex;align-items:center;gap:10px;padding:10px;margin-bottom:8px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:18px;transition:.3s;animation:slideUpFade .4s ease both}
.act-item:hover{background:rgba(255,255,255,.06)}
.act-chips{display:flex;gap:5px;margin-top:3px}
.act-c{font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px}
.act-c.g{background:rgba(16,185,129,.15);color:#6ee7b7}
.act-c.b{background:rgba(239,68,68,.15);color:#fca5a5}
.act-c.p{background:rgba(245,158,11,.15);color:#fcd34d}
.act-earn{font-family:'Inter';font-size:12px;font-weight:900;padding:5px 10px;border-radius:8px;background:rgba(16,185,129,.15);color:#6ee7b7;border:1px solid rgba(16,185,129,.3)}
.act-earn.zero{background:rgba(255,255,255,.05);color:#9a9bb8;border-color:transparent}

/* Empty & More Button */
.empty{text-align:center;padding:30px 20px;background:rgba(255,255,255,.02);border:1.5px dashed rgba(255,255,255,.1);border-radius:20px;color:var(--muted);font-size:13px;font-weight:600}
.empty svg{width:36px;height:36px;margin-bottom:10px;stroke:var(--muted);fill:none;stroke-width:1.5;opacity:.5}
.btn-more{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px;border-radius:14px;color:#c4b5fd;font-size:12.5px;font-weight:700;background:rgba(99,102,241,.1);border:1px solid rgba(139,92,246,.3);margin-top:4px;transition:.3s}
.btn-more:hover{background:rgba(99,102,241,.2);color:#fff}
.btn-more svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* Notice Modal */
.modal{position:fixed;inset:0;z-index:2000;background:rgba(3,3,10,.75);backdrop-filter:blur(10px);display:flex;align-items:flex-end;justify-content:center;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.modal.show{opacity:1;visibility:visible}
.sheet{width:100%;max-width:520px;background:linear-gradient(180deg,#17172f,#0d0d1f);border:1px solid rgba(255,255,255,.1);border-bottom:none;border-radius:28px 28px 0 0;transform:translateY(100%);transition:transform .4s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.modal.show .sheet{transform:none}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:20px;border-bottom:1px solid rgba(255,255,255,.05)}
.sheet-h h3{margin:0;font-size:18px;font-weight:700;color:#fde68a}
.close{width:34px;height:34px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
.close svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.sheet-b{padding:20px;font-size:14px;line-height:1.7;color:#d1d5db;max-height:60vh;overflow-y:auto}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="orb o1"></div><div class="orb o2"></div></div>

<div class="app">
  <!-- Header -->
  <header class="top">
    <div class="brand"><div class="mark">A</div><span>ADQ Income Zone</span></div>
    <div class="actions">
      <a href="notifications.html" class="ibtn" aria-label="Notifications">
        <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </a>
      <button class="ibtn danger" id="logoutBtn" aria-label="Logout">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </header>

  <!-- Compact Hero Card -->
  <section class="hero">
    <!-- Name & Badge -->
    <div class="h-top">
      <div class="h-user">
        <div class="avatar" id="avatar">U</div>
        <div class="u-info">
          <div class="u-hi">স্বাগতম,</div>
          <div class="u-name">
            <span class="name-text" id="username">Loading...</span>
            <span id="badgeWrap" style="display:none" class="premium-badge"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Balance & Withdraw Button -->
    <div class="h-mid">
      <div class="h-bal">
        <div class="bal-l"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></svg> আপনার ব্যালেন্স</div>
        <div class="bal-a" id="balance">৳0</div>
      </div>
      <a href="withdraw.html" class="btn-wd">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Withdraw
      </a>
    </div>

    <!-- Stats -->
    <div class="h-stats">
      <div class="st-box"><b id="sSubs">0</b><span>Subs</span></div>
      <div class="st-box" style="color:#6ee7b7"><b id="sGood">0</b><span>Good</span></div>
      <div class="st-box" style="color:#fcd34d"><b id="sPend">0</b><span>Pending</span></div>
    </div>
  </section>

  <!-- Notice -->
  <button class="notice" id="noticeBar" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    <div class="notice-marquee">
      <span class="notice-text" id="noticeTitle">Loading notice...</span>
    </div>
    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
  </button>

  <!-- Tabs -->
  <div class="seg" id="segTabs">
    <div class="seg-bg"></div>
    <button class="seg-btn active" data-target="pTasks">
      <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg> Tasks <span class="count" id="cntTasks">0</span>
    </button>
    <button class="seg-btn" data-target="pAct">
      <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg> Activity
    </button>
  </div>

  <!-- Scrollable List -->
  <div class="content-area" id="pTasks">
    <div class="empty">লোড হচ্ছে...</div>
  </div>
  <div class="content-area hidden" id="pAct">
    <div class="empty">লোড হচ্ছে...</div>
  </div>
</div>

<!-- Modal -->
<div class="modal" id="noticeModal">
  <div class="sheet">
    <div class="sheet-h">
      <h3 id="nsTitle">Notice</h3>
      <button class="close" id="nsClose">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="sheet-b" id="nsBody"></div>
  </div>
</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { doc, collection, query, where, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const S = window.ADQ.svg;
const esc = window.ADQ.esc;
const logo = window.ADQ.logo;
const tstatus = window.ADQ.tstatus;
const $ = (id) => document.getElementById(id);

window.adqHold = true;

// Logout
$("logoutBtn").onclick = async () => {
  if (!confirm("লগআউট করবেন?")) return;
  await signOut(auth);
  location.href = "login.html";
};

// Tabs
document.querySelectorAll(".seg-btn").forEach(btn => {
  btn.onclick = () => {
    const seg = $("segTabs");
    seg.classList.toggle("right", btn.dataset.target === "pAct");
    document.querySelectorAll(".seg-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    ["pTasks", "pAct"].forEach(id => $(id).classList.add("hidden"));
    const target = $(btn.dataset.target);
    target.classList.remove("hidden");
    target.style.animation = "none";
    target.offsetHeight;
    target.style.animation = "fadeIn .4s ease both";
  };
});

// Countdown Timer (HH:MM Only)
function getFormattedTime(endMs) {
  const diff = endMs - Date.now();
  if (diff <= 0) return "শেষ";
  const h = Math.floor(diff / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
}

const ready = { user: false, tasks: false, subs: false };
function mark(k) {
  ready[k] = true;
  if (ready.user && ready.tasks && ready.subs) window.adqReady && window.adqReady();
}

const safeUrl = (u) => /^https?:\/\//i.test(u || "") ? u : "";

onAuthStateChanged(auth, (user) => {
  if (!user) { location.href = "login.html"; return; }

  onSnapshot(doc(db, "users", user.uid), (snap) => {
    if (snap.exists()) {
      const u = snap.data();
      $("username").textContent = u.username || "User";
      $("avatar").textContent = (u.username || "U").charAt(0).toUpperCase();
      $("balance").textContent = "৳" + (u.balance || 0);
      $("sGood").textContent = u.totalGood || 0;
      $("sPend").textContent = u.totalPending || 0;
      
      if (u.customBadge) {
        $("badgeWrap").style.display = "inline-flex";
      }
    }
    mark("user");
  }, () => mark("user"));

  loadNotice();
  loadTasks();
  loadActivity(user.uid);
});

// Notice
async function loadNotice() {
  try {
    const snap = await getDocs(query(collection(db, "notices"), where("active", "==", true)));
    if (snap.empty) return;
    const n = snap.docs.map(d => d.data()).sort((a, b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0))[0];
    
    $("noticeTitle").textContent = n.title;
    const duration = Math.max(8, n.title.length * 0.3); 
    $("noticeTitle").style.animationDuration = `${duration}s`;
    $("noticeBar").hidden = false;
    
    $("noticeBar").onclick = () => {
      $("nsTitle").textContent = n.title || "নোটিশ";
      const apk = safeUrl(n.apkUrl), link = safeUrl(n.linkUrl);
      $("nsBody").innerHTML = `<div>${esc(n.message).replace(/\n/g, "<br>")}</div>` +
        ((apk || link) ? `<div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;">${apk ? `<a class="apk" style="flex:1;padding:12px;background:#10b981;color:#fff;border-radius:10px;text-align:center;font-weight:700;text-decoration:none;" href="${esc(apk)}" target="_blank">Download APK</a>` : ""}${link ? `<a style="flex:1;padding:12px;background:#6366f1;color:#fff;border-radius:10px;text-align:center;font-weight:700;text-decoration:none;" href="${esc(link)}" target="_blank">Open Link</a>` : ""}</div>` : "");
      $("noticeModal").classList.add("show");
    };
  } catch (e) {}
}
$("nsClose").onclick = () => $("noticeModal").classList.remove("show");
$("noticeModal").addEventListener("click", (e) => { if (e.target === $("noticeModal")) $("noticeModal").classList.remove("show"); });

// Tasks & Countdown
let taskInterval = null;
function loadTasks() {
  const list = $("pTasks");
  onSnapshot(query(collection(db, "tasks"), where("active", "==", true)), (snap) => {
    const now = new Date();
    const tasks = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .filter(t => { const e = t.endTime?.toDate?.(); return !e || e > now; })
      .sort((a, b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));
      
    $("cntTasks").textContent = tasks.length;
    
    if (!tasks.length) {
      list.innerHTML = `<div class="empty">${S.inbox}এখনো কোনো open task নেই</div>`;
    } else {
      list.innerHTML = tasks.slice(0, 6).map(t => {
        const st = tstatus(t);
        const fields = (t.fields || []).length;
        const end = t.endTime?.toDate?.()?.getTime();
        let timeText = st.text;
        if (st.k === "open" && end) timeText = getFormattedTime(end);
        
        return `<a class="task-item" href="task.html?id=${esc(t.id)}">
          ${logo(t.platform, "t-logo")}
          <div class="t-info">
            <div class="t-title">${esc(t.title)}</div>
            <div class="t-tags">
              <span class="tag price">৳${esc(t.pricePerAccount)}</span>
              <span class="tag time ${st.k}">${timeText}</span>
              <span class="tag time">${S.layers} ${fields}</span>
            </div>
          </div>
          <div class="t-arrow">${S.chev}</div>
        </a>`;
      }).join("") + `<a href="tasks.html" class="btn-more">সব Task দেখুন ${S.chev}</a>`;
    }

    if (taskInterval) clearInterval(taskInterval);
    taskInterval = setInterval(() => {
      const taskElements = list.querySelectorAll('.task-item');
      tasks.slice(0, 6).forEach((t, i) => {
        const end = t.endTime?.toDate?.()?.getTime();
        if (!end) return;
        const el = taskElements[i]?.querySelector('.tag.time');
        if (el) {
          const diff = end - Date.now();
          if (diff <= 0) {
            el.textContent = "শেষ";
            el.className = "tag time closed";
          } else {
            el.textContent = getFormattedTime(end);
          }
        }
      });
    }, 1000);

    mark("tasks");
  }, (e) => { list.innerHTML = `<div class="empty">${esc(e.message)}</div>`; mark("tasks"); });
}

// Activity
function loadActivity(uid) {
  const list = $("pAct");
  onSnapshot(query(collection(db, "submissions"), where("userId", "==", uid)), (snap) => {
    $("sSubs").textContent = snap.size;
    if (snap.empty) {
      list.innerHTML = `<div class="empty">${S.inbox}এখনো কোনো submission নেই</div>`;
      mark("subs");
      return;
    }
    const groups = {};
    snap.docs.forEach(d => {
      const s = d.data();
      if (!s.taskId) return;
      const g = groups[s.taskId] || (groups[s.taskId] = { title: s.taskTitle || "Task", platform: s.taskPlatform || "Other", good: 0, bad: 0, pending: 0, earned: 0, last: 0 });
      if (s.status === "good") { g.good++; g.earned += Number(s.price) || 0; }
      else if (s.status === "bad") g.bad++;
      else g.pending++;
      const t = s.checkedAt?.toMillis?.() || s.submittedAt?.toMillis?.() || 0;
      if (t > g.last) g.last = t;
    });
    const rows = Object.values(groups).sort((a, b) => b.last - a.last).slice(0, 8);
    
    list.innerHTML = rows.map(g => `
      <a href="task-history.html" class="act-item">
        ${logo(g.platform, "t-logo")}
        <div class="t-info">
          <div class="t-title" style="margin-bottom:2px">${esc(g.title)}</div>
          <div class="act-chips">
            <span class="act-c g">${g.good} Good</span>
            <span class="act-c b">${g.bad} Bad</span>
            ${g.pending ? `<span class="act-c p">${g.pending} Pending</span>` : ""}
          </div>
        </div>
        <span class="act-earn ${g.earned > 0 ? "" : "zero"}">${g.earned > 0 ? "+৳" + g.earned : "৳0"}</span>
      </a>`).join("") + `<a href="task-history.html" class="btn-more">পুরো History ${S.chev}</a>`;
    mark("subs");
  }, () => mark("subs"));
}
</script>
