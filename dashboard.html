<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — ADQ Income Zone</title>
  <link rel="stylesheet" href="style.css?v=34">
  <style>
    .hq-task-card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 14px;
      box-shadow: 0 8px 28px rgba(15,23,42,0.08);
      border: 1px solid rgba(15,23,42,0.04);
      display: flex;
      gap: 16px;
      align-items: flex-start;
      position: relative;
      overflow: hidden;
      transition: all 0.35s cubic-bezier(0.4,0,0.2,1);
    }
    .hq-task-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      background: linear-gradient(180deg, #6366f1, #8b5cf6, #a855f7);
    }
    .hq-task-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 48px rgba(99,102,241,0.18);
      border-color: rgba(99,102,241,0.2);
    }
    .hq-task-logo {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      position: relative;
      overflow: hidden;
      padding: 8px;
    }
    .hq-task-logo svg { width: 100%; height: 100%; }
    .hq-task-body { flex: 1; min-width: 0; }
    .hq-task-title {
      font-size: 16px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .hq-task-price {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: linear-gradient(135deg, #d1fae5, #a7f3d0);
      color: #065f46;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .hq-task-meta {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }
    .hq-meta-item {
      background: #f8fafc;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 11px;
      color: #64748b;
      font-weight: 700;
      text-align: center;
    }
    .hq-meta-item .v {
      display: block;
      font-size: 13px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 2px;
      font-family: 'Inter';
    }
    .hq-task-badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .hq-badge {
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .hq-badge.open { background: #d1fae5; color: #065f46; }
    .hq-badge.upcoming { background: #fef3c7; color: #92400e; }
    .hq-badge.closed { background: #fee2e2; color: #991b1b; }
    .hq-badge.commission { background: linear-gradient(135deg, #fef3c7, #fde68a); color: #92400e; }
    .hq-task-btn {
      display: block;
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
      text-align: center;
      box-shadow: 0 6px 16px rgba(99,102,241,0.35);
      transition: all 0.3s;
    }

    .user-name-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
      overflow: hidden;
    }
    .user-name-scroll {
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      -ms-overflow-style: none;
      max-width: 180px;
      -webkit-mask-image: linear-gradient(90deg, #000 90%, transparent 100%);
      mask-image: linear-gradient(90deg, #000 90%, transparent 100%);
      padding-right: 4px;
    }
    .user-name-scroll::-webkit-scrollbar { display: none; }
  </style>
</head>

    import { doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { initChatWidget } from "./chat-widget.js";
    import { initPremiumPopups } from "./premium-popup.js";

      Gmail: { color: "#EA4335", svg: `<svg viewBox="0 0 24 24" fill="white"><path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z"/></svg>` },

      Other: { color: "#64748b", svg: `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>` }
    };

    function getBadgeClass(color) {
      if (!color) return 'gold';
      if (color.includes("#94a3b8") || color.includes("silver")) return 'silver';
      if (color.includes("#ea580c") || color.includes("bronze")) return 'bronze';
      if (color.includes("#a855f7")) return 'purple';
      if (color.includes("#3b82f6")) return 'blue';
      if (color.includes("#10b981")) return 'green';
      if (color.includes("#ef4444")) return 'red';
      return 'gold';
    }

    document.getElementById("logoutBtn").onclick = async () => {
      if (!confirm("লগআউট?")) return;
      await signOut(auth);
      location.href = "index.html";
    };

    onAuthStateChanged(auth, async (user) => {
      if (!user) { location.href = "login.html"; return; }
      const snap = await getDoc(doc(db, "users", user.uid));
      if (!snap.exists()) { location.href = "login.html"; return; }
      const u = snap.data();

      document.getElementById("username").textContent = u.username || "User";
      document.getElementById("email").textContent = u.email || "";
      document.getElementById("avatar").textContent = (u.username || "U").charAt(0).toUpperCase();
      document.getElementById("balance").textContent = "৳" + (u.balance || 0);
      document.getElementById("earnedTotal").textContent = "৳" + (u.balance || 0);

      if (u.customBadge) {
        const cls = getBadgeClass(u.customBadgeColor);
        document.getElementById("dashBadge").innerHTML = `<span class="premium-badge ${cls}" title="${u.customBadge}"></span>`;
      }

      loadNotice();
      loadTasks();
      loadRecent(user.uid);
      loadTotalSubs(user.uid);
    });

    async function loadTotalSubs(uid) {
      try {
        const q = query(collection(db, "submissions"), where("userId", "==", uid));
        const snap = await getDocs(q);
        document.getElementById("totalSubs").textContent = snap.size;
      } catch (e) {}
    }

    async function loadNotice() {
      try {
        const q = query(collection(db, "notices"), where("active", "==", true));
        const snap = await getDocs(q);
        if (snap.empty) return;
        const n = snap.docs.map(d => d.data()).sort((a, b) =>
          (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0)
        )[0];

        const timeStr = n.createdAt?.toDate?.().toLocaleString("bn-BD", {
          day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"
        }) || "";

        const apkBtn = n.apkUrl
          ? `<a href="${n.apkUrl}" class="pn-btn pn-btn-apk" target="_blank" rel="noopener noreferrer">⬇️ Download APK</a>` : "";
        const linkBtn = n.linkUrl
          ? `<a href="${n.linkUrl}" class="pn-btn pn-btn-link" target="_blank" rel="noopener noreferrer">🔗 Open Link</a>` : "";

        document.getElementById("noticeArea").innerHTML = `
          <div class="premium-notice">
            <div class="pn-head">
              <div class="pn-bell">🔔</div>
              <div class="pn-title">${n.title}</div>
            </div>
            <div class="pn-msg">${n.message}</div>
            ${(apkBtn || linkBtn) ? `<div class="pn-actions">${apkBtn}${linkBtn}</div>` : ""}
            <div class="pn-time">🕐 ${timeStr}</div>
          </div>
        `;
      } catch (e) {}
    }

    async function loadTasks() {
      const list = document.getElementById("taskList");
      try {
        const q = query(collection(db, "tasks"), where("active", "==", true));
        const snap = await getDocs(q);
        if (snap.empty) {
          list.innerHTML = `<div class="dash-empty"><div class="em">📭</div><p>এখনো কোনো task নেই</p></div>`;
          return;
        }
        const now = new Date();
        // এখানে slice(0, 3) সরিয়ে দেওয়া হয়েছে যাতে সব টাস্ক দেখায়
        const tasks = snap.docs.map(d => ({ id: d.id, ...d.data() }))
          .filter(t => {
            const end = t.endTime?.toDate?.();
            return !end || end > now;
          })
          .sort((a, b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));

        if (tasks.length === 0) {
          list.innerHTML = `<div class="dash-empty"><div class="em">⏰</div><p>এখনো কোনো open task নেই</p></div>`;
          return;
        }

        list.innerHTML = tasks.map((t, i) => renderHighQualityTaskCard(t, i)).join("");
      } catch (e) {
        list.innerHTML = `<div class="dash-empty"><p style="color:#ef4444">${e.message}</p></div>`;
      }
    }

    function renderHighQualityTaskCard(t, idx) {
      const platformKey = t.platform || "Other";
      const platform = PLATFORM_ICONS[platformKey] || PLATFORM_ICONS.Other;
      const fieldCount = (t.fields || []).length;
      const commission = t.referCommission || 0;
      const now = new Date();
      const start = t.startTime?.toDate?.();
      const end = t.endTime?.toDate?.();
      let status = "open", statusLabel = "🟢 Open";
      if (start && now < start) { status = "upcoming"; statusLabel = "⏳ Upcoming"; }
      else if (end && now > end) { status = "closed"; statusLabel = "🔴 Closed"; }
      let timeLeft = "";
      if (end) {
        const diffMs = end - now;
        if (diffMs > 0) {
          const hrs = Math.floor(diffMs / 3600000);
          const mins = Math.floor((diffMs % 3600000) / 60000);
          if (hrs > 24) {
            const days = Math.floor(hrs / 24);
            timeLeft = `${days}d ${hrs % 24}h`;
          } else if (hrs > 0) {
            timeLeft = `${hrs}h ${mins}m`;
          } else {
            timeLeft = `${mins}m`;
          }
        }
      }
      const logoStyle = `background: ${platform.color}`;
      return `
        <div class="hq-task-card" style="animation-delay:${idx * 0.05}s">
          <div class="hq-task-logo" style="${logoStyle}">
            ${platform.svg}
          </div>
          <div class="hq-task-body">
            <div class="hq-task-title">${t.title}</div>
            <span class="hq-task-price">৳${t.pricePerAccount} / account</span>
            <div class="hq-task-meta">
              <div class="hq-meta-item">
                <span class="v">${timeLeft || "—"}</span>
                Time Left
              </div>
              <div class="hq-meta-item">
                <span class="v">${fieldCount}</span>
                Fields
              </div>
            </div>
            <div class="hq-task-badges">
              <span class="hq-badge ${status}">${statusLabel}</span>
              ${commission > 0 ? `<span class="hq-badge commission">🎁 ৳${commission} Refer Commission</span>` : ''}
            </div>
            <a href="task.html?id=${t.id}" class="hq-task-btn">Submit Now →</a>
          </div>
        </div>
      `;
    }

    async function loadRecent(uid) {
      const list = document.getElementById("recentList");
      try {
        const q = query(collection(db, "submissions"), where("userId", "==", uid));
        const snap = await getDocs(q);
        if (snap.empty) {
          list.innerHTML = `<div class="dash-empty"><div class="em">📭</div><p>এখনো কোনো submission নেই</p></div>`;
          return;
        }
        const subs = snap.docs.map(d => d.data())
          .sort((a, b) => (b.submittedAt?.toMillis?.() || 0) - (a.submittedAt?.toMillis?.() || 0))
          .slice(0, 5);
        list.innerHTML = subs.map((s, i) => {
          const ic = s.status === "good" ? "✅" : s.status === "bad" ? "❌" : "⏳";
          const earned = s.status === "good" ? `+৳${s.price || 0}` : (s.status === "bad" ? "৳0" : "Pending");
          const time = s.submittedAt?.toDate?.().toLocaleString("bn-BD", {
            day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"
          }) || "";
          return `
            <div class="dash-recent">
              <div class="dash-recent-info">
                <div class="uid">${ic} ${s.uid || "N/A"}</div>
                <div class="time">🕐 ${time}</div>
              </div>
              <span class="dash-recent-earned ${s.status === "good" ? "" : "zero"}">${earned}</span>
            </div>
          `;
        }).join("");
      } catch (e) {
        list.innerHTML = `<div class="dash-empty"><p style="color:#ef4444">${e.message}</p></div>`;
      }
    }
  </script>
</body>
</html>
