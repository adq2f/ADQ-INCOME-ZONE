<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ড্যাশবোর্ড — ADQ Income Zone</title>
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>

  <!-- ============ NAVBAR ============ -->
  <div class="navbar">
    <div class="logo">
      <div class="mark">A</div>
      <span>ADQ Income Zone</span>
    </div>
    <button class="nav-logout" id="logoutBtn" title="Logout">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </div>

  <!-- ============ MAIN CONTENT ============ -->
  <div class="container">

    <!-- Welcome Card -->
    <div class="dash-welcome animate-in">
      <div class="avatar" id="avatar">U</div>
      <div style="min-width:0; flex:1">
        <h3>👋 স্বাগতম, <span id="username">...</span></h3>
        <p id="email">...</p>
      </div>
    </div>

    <!-- Balance Box -->
    <div class="dash-balance">
      <div class="dash-balance-label">💰 আপনার ব্যালেন্স</div>
      <div class="dash-balance-amount" id="balance">৳0</div>
      <div class="dash-balance-actions">
        <button onclick="alert('শীঘ্রই আসছে! 🚀')">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Withdraw
        </button>
        <a href="wallet.html">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          History
        </a>
      </div>
    </div>

    <!-- Stats Grid -->
    <div class="dash-stats">
      <div class="dash-stat g">
        <div class="ic">✅</div>
        <div class="n" id="statGood">0</div>
        <div class="l">Good</div>
      </div>
      <div class="dash-stat b">
        <div class="ic">❌</div>
        <div class="n" id="statBad">0</div>
        <div class="l">Bad</div>
      </div>
      <div class="dash-stat p">
        <div class="ic">⏳</div>
        <div class="n" id="statPending">0</div>
        <div class="l">Pending</div>
      </div>
    </div>

    <!-- Notice Area -->
    <div id="noticeArea"></div>

    <!-- Quick Actions -->
    <div class="dash-section-head">
      <h3>⚡ Quick Actions</h3>
    </div>
    <div class="dash-quick">
      <a href="index.html" class="dash-quick-item">
        <div class="dash-quick-icon qi-purple">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </div>
        <div class="dash-quick-label">Submit</div>
      </a>
      <a href="my-submissions.html" class="dash-quick-item">
        <div class="dash-quick-icon qi-green">
          <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        </div>
        <div class="dash-quick-label">My Subs</div>
      </a>
      <a href="wallet.html" class="dash-quick-item">
        <div class="dash-quick-icon qi-orange">
          <svg viewBox="0 0 24 24"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></svg>
        </div>
        <div class="dash-quick-label">Wallet</div>
      </a>
      <a href="notifications.html" class="dash-quick-item">
        <div class="dash-quick-icon qi-blue">
          <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </div>
        <div class="dash-quick-label">Notifs</div>
      </a>
    </div>

    <!-- Available Tasks -->
    <div class="dash-section-head">
      <h3>🎯 Available Tasks</h3>
      <a href="index.html">সব দেখো →</a>
    </div>
    <div id="taskList" class="loading"><div class="spinner"></div>লোড হচ্ছে...</div>

    <!-- Recent Submissions -->
    <div class="dash-section-head">
      <h3>📋 সাম্প্রতিক Submission</h3>
      <a href="my-submissions.html">সব দেখো →</a>
    </div>
    <div id="recentList" class="loading"><div class="spinner"></div>লোড হচ্ছে...</div>

  </div>

  <!-- ============ BOTTOM NAVIGATION ============ -->
  <nav class="bottom-nav">
    <a href="index.html" data-page="home">
      <span class="nav-ic"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
      <span class="nav-label">Home</span>
    </a>
    <a href="dashboard.html" data-page="dashboard">
      <span class="nav-ic"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg></span>
      <span class="nav-label">Dashboard</span>
    </a>
    <a href="index.html#tasks" data-page="submit">
      <span class="nav-ic"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></span>
      <span class="nav-label">Submit</span>
    </a>
    <a href="wallet.html" data-page="wallet">
      <span class="nav-ic"><svg viewBox="0 0 24 24"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></svg></span>
      <span class="nav-label">Wallet</span>
    </a>
    <a href="profile.html" data-page="profile">
      <span class="nav-ic"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
      <span class="nav-label">Profile</span>
    </a>
  </nav>

  <!-- ============ SCRIPTS ============ -->
  <script type="module">
    import { auth, db } from "./firebase.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // ===== Auto-highlight bottom nav =====
    (function() {
      const f = (window.location.pathname.split('/').pop() || 'index.html').toLowerCase();
      let p = 'home';
      if (f === 'dashboard.html') p = 'dashboard';
      else if (f === 'wallet.html') p = 'wallet';
      else if (f === 'profile.html') p = 'profile';
      else if (f === 'task.html') p = 'submit';
      document.querySelectorAll('.bottom-nav a').forEach(a => {
        if (a.dataset.page === p) a.classList.add('active');
      });
    })();

    // ===== Logout =====
    document.getElementById("logoutBtn").onclick = async () => {
      if (!confirm("লগআউট করতে চান?")) return;
      await signOut(auth);
      location.href = "index.html";
    };

    // ===== Load User Data =====
    onAuthStateChanged(auth, async (user) => {
      if (!user) { location.href = "login.html"; return; }

      const snap = await getDoc(doc(db, "users", user.uid));
      if (!snap.exists()) { location.href = "login.html"; return; }
      const u = snap.data();

      document.getElementById("username").textContent = u.username || "User";
      document.getElementById("email").textContent = u.email || "";
      document.getElementById("avatar").textContent = (u.username || "U").charAt(0).toUpperCase();
      document.getElementById("balance").textContent = "৳" + (u.balance || 0);
      document.getElementById("statGood").textContent = u.totalGood || 0;
      document.getElementById("statBad").textContent = u.totalBad || 0;
      document.getElementById("statPending").textContent = u.totalPending || 0;

      loadNotice();
      loadTasks();
      loadRecent(user.uid);
    });

    // ===== Load Notice =====
    async function loadNotice() {
      try {
        const q = query(collection(db, "notices"), where("active", "==", true));
        const snap = await getDocs(q);
        if (snap.empty) return;
        const n = snap.docs.map(d => d.data()).sort((a, b) =>
          (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0)
        )[0];
        document.getElementById("noticeArea").innerHTML = `
          <div class="dash-notice">
            <h4>📢 ${n.title}</h4>
            <p>${n.message}</p>
          </div>
        `;
      } catch (e) { console.log("Notice error:", e); }
    }

    // ===== Load Tasks =====
    async function loadTasks() {
      const list = document.getElementById("taskList");
      try {
        const q = query(collection(db, "tasks"), where("active", "==", true));
        const snap = await getDocs(q);

        if (snap.empty) {
          list.innerHTML = `<div class="dash-empty"><div class="em">📭</div><p>এখনো কোনো task নেই</p></div>`;
          return;
        }

        const tasks = snap.docs.map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0))
          .slice(0, 3);

        list.innerHTML = tasks.map((t, i) => {
          const isFB = /facebook|fb/i.test(t.title || "");
          const cls = isFB ? "dash-task-logo" : "dash-task-logo default";
          const txt = isFB ? "f" : (t.title || "T").charAt(0).toUpperCase();
          return `
            <div class="dash-task" style="animation-delay:${0.25 + i * 0.05}s">
              <div class="dash-task-left">
                <div class="${cls}">${txt}</div>
                <div class="dash-task-info">
                  <h4>${t.title}</h4>
                  <span class="price">৳${t.pricePerAccount}/account</span>
                </div>
              </div>
              <a href="task.html?id=${t.id}" class="dash-task-btn">Submit →</a>
            </div>
          `;
        }).join("");
      } catch (e) {
        list.innerHTML = `<div class="dash-empty"><p style="color:#ef4444">${e.message}</p></div>`;
      }
    }

    // ===== Load Recent Submissions =====
    async function loadRecent(uid) {
      const list = document.getElementById("recentList");
      try {
        const q = query(collection(db, "submissions"), where("userId", "==", uid));
        const snap = await getDocs(q);

        if (snap.empty) {
          list.innerHTML = `<div class="dash-empty"><div class="em">📭</div><p>এখনো কোনো submission নেই</p></div>`;
          return;
        }

        const subs = snap.docs.map(d => d.data())
          .sort((a, b) => (b.submittedAt?.toMillis?.() || 0) - (a.submittedAt?.toMillis?.() || 0))
          .slice(0, 5);

        list.innerHTML = subs.map((s, i) => {
          const ic = s.status === "good" ? "✅" : s.status === "bad" ? "❌" : "⏳";
          const earned = s.status === "good" ? `+৳${s.price || 0}`
                        : s.status === "bad" ? "৳0" : "Pending";
          const time = s.submittedAt?.toDate?.().toLocaleString("bn-BD", {
            day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"
          }) || "";
          return `
            <div class="dash-recent" style="animation-delay:${0.4 + i * 0.05}s">
              <div class="dash-recent-info">
                <div class="uid">${ic} ${s.uid}</div>
                <div class="time">🕐 ${time}</div>
              </div>
              <span class="dash-recent-earned ${s.status === "good" ? "" : "zero"}">${earned}</span>
            </div>
          `;
        }).join("");
      } catch (e) {
        list.innerHTML = `<div class="dash-empty"><p style="color:#ef4444">${e.message}</p></div>`;
      }
    }
  </script>

</body>
</html>
