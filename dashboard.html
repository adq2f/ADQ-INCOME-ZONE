<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#06060f">
<title>Dashboard — ADQ Income Zone</title>
<script src="app-shell.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #06060f; --ink: #f4f4ff; --muted: #9a9bb8; --line: rgba(255,255,255,.08);
  --brand: #6366f1; --accent: #8b5cf6; --cyan: #22d3ee; --green: #10b981; --red: #ef4444;
}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
html,body{background:var(--bg)!important;margin:0;padding:0;height:100vh;height:100dvh;overflow:hidden;font-family:'Hind Siliguri','Inter',sans-serif;color:var(--ink)}
a{text-decoration:none;color:inherit} button{font-family:inherit}

/* Background Glow */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(90px);will-change:transform}
.orb.o1{width:420px;height:420px;background:#4f46e5;top:-140px;left:-120px;opacity:.4;animation:dr1 20s ease-in-out infinite}
.orb.o2{width:380px;height:380px;background:#9333ea;bottom:-160px;right:-120px;opacity:.3;animation:dr2 24s ease-in-out infinite}
@keyframes dr1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,40px) scale(1.1)}}
@keyframes dr2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-40px,-50px) scale(1.08)}}

/* Smooth Animations */
@keyframes slideUpFade{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes marqueeNotice{0%{transform:translateX(0)}100%{transform:translateX(-100%)}}

/* App Layout (Strict No-Scroll) */
.app{position:relative;z-index:1;max-width:520px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:0 16px}

/* Header */
.top{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) 0 12px;animation:slideUpFade .5s ease both}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;letter-spacing:-.3px}
.mark{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#6366f1,#8b5cf6 55%,#22d3ee);color:#fff;font-family:'Inter';font-weight:900;font-size:16px;box-shadow:0 8px 20px -6px rgba(139,92,246,.8),inset 0 1px 0 rgba(255,255,255,.35)}
.actions{display:flex;gap:8px}
.ibtn{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;flex:0 0 36px}
.ibtn:hover{color:#fff;background:rgba(255,255,255,.1)}
.ibtn.danger:hover{background:rgba(239,68,68,.18);border-color:rgba(239,68,68,.45);color:#fca5a5}
.ibtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* Compact Hero Card */
.hero{flex-shrink:0;position:relative;overflow:hidden;border-radius:24px;padding:16px;margin-bottom:12px;background:linear-gradient(135deg,#312e81 0%,#5b21b6 50%,#7e22ce 100%);box-shadow:0 20px 40px -15px rgba(124,58,237,.7),inset 0 1px 0 rgba(255,255,255,.2);animation:slideUpFade .6s cubic-bezier(.2,.8,.2,1) both}
.hero::before{content:'';position:absolute;top:-50%;left:-30%;width:120%;height:150%;background:radial-gradient(circle,rgba(255,255,255,.15),transparent 60%);pointer-events:none}

/* User Info (Top) */
.h-top{display:flex;align-items:flex-start;justify-content:space-between;position:relative;z-index:1}
.d-left{display:flex;align-items:flex-start;gap:10px;flex:1;min-width:0}
.d-av{width:38px;height:38px;flex:0 0 38px;border-radius:50%;background:rgba(0,0,0,.28);border:1.5px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font:800 16px 'Inter',sans-serif;margin-top:2px}
.d-wt{flex:1;min-width:0}
.d-hi{font-size:11px;opacity:.8;font-weight:500;margin-bottom:2px}
.d-name{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700;line-height:1.2;color:#fff}
.d-name #username{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;display:inline-block;vertical-align:middle}

/* Exact Profile Premium Badge (Dynamic Colors) */
.premium-badge{width:20px;height:20px;flex-shrink:0;position:relative;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:linear-gradient(135deg,#fceabb 0%,#f8b500 50%,#b47b00 100%);box-shadow:0 4px 10px rgba(245,158,11,.4),inset 0 -2px 4px rgba(0,0,0,.3),inset 0 2px 4px rgba(255,255,255,.8);animation:premiumPulse 2s ease-in-out infinite alternate;overflow:hidden;border:1px solid #ffd700}
.premium-badge::before{content:'✓';color:#fff;font-size:10px;font-weight:900;position:relative;z-index:2;text-shadow:0 2px 4px rgba(180,123,0,.9)}
.premium-badge::after{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(45deg,rgba(255,255,255,0) 20%,rgba(255,255,255,.9) 50%,rgba(255,255,255,0) 80%);transform:rotate(45deg);animation:premiumShine 3s infinite ease-in-out}
@keyframes premiumPulse{0%{box-shadow:0 4px 10px rgba(245,158,11,.4),inset 0 -2px 4px rgba(0,0,0,.3),inset 0 2px 4px rgba(255,255,255,.8);transform:scale(1)}100%{box-shadow:0 8px 20px rgba(245,158,11,.8),inset 0 -2px 4px rgba(0,0,0,.3),inset 0 2px 4px rgba(255,255,255,.8);transform:scale(1.05)}}
@keyframes premiumShine{0%{left:-100%}20%{left:100%}100%{left:100%}}
.premium-badge.silver{background:linear-gradient(135deg,#ffffff,#94a3b8,#64748b);border-color:#e2e8f0}
.premium-badge.purple{background:linear-gradient(135deg,#d8b4fe,#a855f7,#6b21a8);border-color:#e9d5ff}
.premium-badge.blue{background:linear-gradient(135deg,#93c5fd,#3b82f6,#1d4ed8);border-color:#bfdbfe}
.premium-badge.green{background:linear-gradient(135deg,#6ee7b7,#10b981,#047857);border-color:#a7f3d0}
.premium-badge.red{background:linear-gradient(135deg,#fca5a5,#ef4444,#b91c1c);border-color:#fecaca}
.premium-badge.bronze{background:linear-gradient(135deg,#fdba74,#ea580c,#9a3412);border-color:#fed7aa}

/* Green Tall Withdraw Button */
.d-wd{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 16px;border-radius:14px;background:linear-gradient(135deg,#10b981,#059669);color:#fff;font-weight:800;font-size:12.5px;box-shadow:0 10px 22px -8px rgba(16,185,129,.8),inset 0 1px 0 rgba(255,255,255,.3);flex:0 0 auto;text-decoration:none;height:56px;transition:transform .2s;margin-top:4px}
.d-wd:active{transform:scale(.95)}
.d-wd svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.5}

/* Balance Area */
.d-bal{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:14px}
.d-bl{font-size:11px;font-weight:600;opacity:.85}
.d-ba{font:900 34px 'Inter',sans-serif;letter-spacing:-1px;line-height:1.05;text-shadow:0 6px 18px rgba(0,0,0,.25)}
.d-mini{display:grid;grid-template-columns:repeat(3,auto);gap:6px}
.d-mi{text-align:center;padding:6px 10px;border-radius:12px;background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.12)}
.d-mi b{display:block;font:800 14px 'Inter',sans-serif;line-height:1.1}
.d-mi span{font-size:10px;opacity:.8;font-weight:600}

/* Notice Bar */
.d-notice{flex-shrink:0;display:flex;align-items:center;gap:9px;width:100%;margin-top:10px;padding:9px 12px;border-radius:14px;border:1px solid rgba(251,191,36,.35);background:linear-gradient(135deg,rgba(251,191,36,.14),rgba(245,158,11,.04));color:#fde68a;font-size:12.5px;font-weight:600;cursor:pointer;text-align:left;overflow:hidden;animation:slideUpFade .6s ease .1s both}
.d-notice svg{width:16px;height:16px;flex:0 0 16px}
.notice-marquee{flex:1;min-width:0;overflow:hidden;display:flex;align-items:center;position:relative;height:18px}
.notice-text{white-space:nowrap;display:inline-block;padding-left:100%;animation:marqueeNotice 12s linear infinite}
.d-notice .chev{width:14px;height:14px;opacity:.7;flex:0 0 14px}

/* Tabs */
.seg{flex-shrink:0;display:flex;background:rgba(255,255,255,.04);padding:4px;border-radius:16px;margin-bottom:12px;position:relative;border:1px solid var(--line);animation:slideUpFade .8s ease both}
.seg-btn{flex:1;padding:10px;border-radius:12px;border:none;background:transparent;color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:.3s;position:relative;z-index:1}
.seg-btn.active{color:#fff}
.seg-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.seg-bg{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:12px;box-shadow:0 8px 20px -6px rgba(139,92,246,.8);transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:0}
.seg.right .seg-bg{transform:translateX(100%)}
.seg .count{font-family:'Inter';background:rgba(255,255,255,.2);padding:1px 6px;border-radius:999px;font-size:10px}

/* Content Area (Only this scrolls) */
.content-area{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding-bottom:calc(100px + env(safe-area-inset-bottom,0px));animation:fadeIn .5s ease both}
.content-area::-webkit-scrollbar{display:none}
.hidden{display:none!important}

/* Task Rows */
.x-rb{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.x-rs{display:flex;align-items:center;gap:6px;margin-top:5px;flex-wrap:nowrap;overflow:hidden;width:100%}
.x-tag.time{width:86px;min-width:86px;flex-shrink:0;justify-content:center;font-variant-numeric:tabular-nums;font-family:'Inter',monospace;font-size:10px;padding:2px 0;white-space:nowrap;overflow:hidden}
.x-go{flex-shrink:0}
@keyframes blinkDanger{0%,100%{color:#fca5a5;background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.4);box-shadow:0 0 8px rgba(239,68,68,.2)}50%{color:#ef4444;background:rgba(239,68,68,.35);border-color:rgba(239,68,68,.8);box-shadow:0 0 12px rgba(239,68,68,.6);font-weight:900}}
.x-tag.time.danger{animation:blinkDanger 1s infinite;border:1px solid #ef4444}

/* Activity Rows */
.act-row{display:flex;align-items:center;gap:11px;padding:10px 12px;margin-bottom:8px;border-radius:18px;background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.09)}
.act-row .x-rb{min-width:0}
.act-chips{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.act-chips span{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px}
.act-chips .g{background:rgba(16,185,129,.16);color:#6ee7b7}
.act-chips .b{background:rgba(239,68,68,.16);color:#fca5a5}
.act-chips .p{background:rgba(245,158,11,.16);color:#fcd34d}
.act-earn{font:800 12.5px 'Inter',sans-serif;padding:5px 11px;border-radius:999px;background:rgba(16,185,129,.16);color:#6ee7b7;white-space:nowrap}
.act-earn.zero{background:rgba(255,255,255,.07);color:#9a9bb8}
</style>
</head>

  <script type="module">
import { auth, db } from "./firebase.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { doc, collection, query, where, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

window.adqHold = true;
const { esc, svg: S, logo } = window.ADQ;
const $ = (id) => document.getElementById(id);

$("bellBtn").innerHTML = S.bell;
$("logoutBtn").innerHTML = S.logout;
$("nsClose").innerHTML = S.close;

// Badge Color logic (Profile page er moto)
function getBadgeClass(color) {
  if (!color) return '';
  if (color.includes("#94a3b8") || color.includes("silver")) return 'silver';
  if (color.includes("#a855f7")) return 'purple';
  if (color.includes("#3b82f6")) return 'blue';
  if (color.includes("#10b981")) return 'green';
  if (color.includes("#ef4444")) return 'red';
  if (color.includes("#ea580c")) return 'bronze';
  return ''; // Default Golden
}

const ready = { user: false, tasks: false, subs: false };
function mark(k) {
  ready[k] = true;
  if (ready.user && ready.tasks && ready.subs) window.adqReady && window.adqReady();
}

// Logout
$("logoutBtn").onclick = async () => {
  if (!confirm("লগআউট করবেন?")) return;
  await signOut(auth);
  location.href = "login.html";
};

// Tabs
document.querySelectorAll(".seg-btn").forEach(btn => {
  btn.onclick = () => {
    const seg = $("segTabs");
    seg.classList.toggle("right", btn.dataset.target === "pAct");
    document.querySelectorAll(".seg-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    
    ["pTasks", "pAct"].forEach(id => $(id).classList.add("hidden"));
    const target = $(btn.dataset.target);
    target.classList.remove("hidden");
    target.style.animation = "none";
    target.offsetHeight; // trigger reflow
    target.style.animation = "fadeIn .4s ease both";
  };
});

// Live Timer Logic
function getFormattedTime(endMs, startMs) {
  const now = Date.now();
  if (startMs && now < startMs) {
    const diff = startMs - now;
    return { k: "upcoming", t: "শুরু " + fmt(diff), isDanger: false };
  }
  if (endMs && now > endMs) return { k: "closed", t: "শেষ", isDanger: false };
  if (!endMs) return { k: "open", t: "Open", isDanger: false };
  
  const diff = endMs - now;
  const isDanger = diff > 0 && diff <= 5 * 60 * 1000; // 5 minutes or less
  return { k: "open", t: fmt(diff), isDanger };
}

function fmt(ms) {
  let h = Math.floor(ms / 3600000);
  let m = Math.floor((ms % 3600000) / 60000);
  let s = Math.floor((ms % 60000) / 1000);
  return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
}

function customTaskRow(t) {
  let startMs = t.startTime?.toDate?.()?.getTime() || 0;
  let endMs = t.endTime?.toDate?.()?.getTime() || 0;
  let st = getFormattedTime(endMs, startMs);
  
  let fields = (t.fields || []).length;
  // Milestone tag
  let milestone = Number(t.milestoneTarget) > 0 ? `<span class="x-tag gold">${S.gift}${t.milestoneTarget}=৳${t.milestonePrice}</span>` : "";
  
  return `<a class="x-row" href="task.html?id=${esc(t.id)}">
    ${logo(t.platform)}
    <div class="x-rb">
      <div class="x-rt">${esc(t.title)}</div>
      <div class="x-rs">
        <span class="x-price">৳${esc(t.pricePerAccount)}</span>
        <span class="x-tag time ${st.k}" data-start="${startMs}" data-end="${endMs}">
          <i></i><span class="time-text">${st.t}</span>
        </span>
        <span class="x-tag">${S.layers} ${fields}</span>
        ${milestone}
      </div>
    </div>
    <span class="x-go">${S.chev}</span>
  </a>`;
}

const safeUrl = (u) => /^https?:\/\//i.test(u || "") ? u : "";

onAuthStateChanged(auth, (user) => {
  if (!user) { location.href = "login.html"; return; }

  // User Info
  onSnapshot(doc(db, "users", user.uid), (snap) => {
    if (snap.exists()) {
      const u = snap.data();
      $("username").textContent = u.username || "User";
      $("avatar").textContent = (u.username || "U").charAt(0).toUpperCase();
      $("balance").textContent = "৳" + (u.balance || 0);
      $("sGood").textContent = u.totalGood || 0;
      $("sPend").textContent = u.totalPending || 0;
      
      if (u.customBadge) {
        const badgeClass = getBadgeClass(u.customBadgeColor);
        $("dashBadge").innerHTML = `<span class="premium-badge ${badgeClass}" title="${esc(u.customBadge)}"></span>`;
      } else {
        $("dashBadge").innerHTML = "";
      }
    }
    mark("user");
  }, () => mark("user"));

  loadNotice();
  loadTasks();
  loadActivity(user.uid);
});

// Notice
async function loadNotice() {
  try {
    const snap = await getDocs(query(collection(db, "notices"), where("active", "==", true)));
    if (snap.empty) return;
    const n = snap.docs.map(d => d.data()).sort((a, b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0))[0];
    
    const bar = $("noticeBar");
    bar.innerHTML = S.bell + `<div class="notice-marquee"><span class="notice-text">${esc(n.title)}</span></div>` + S.chev.replace("<svg", '<svg class="chev"');
    
    // Adjust animation duration based on text length (10 chars = ~1s)
    const dur = Math.max(8, n.title.length * 0.2);
    bar.querySelector('.notice-text').style.animationDuration = dur + 's';
    
    bar.hidden = false;
    bar.onclick = () => {
      $("nsTitle").textContent = n.title || "নোটিশ";
      const apk = safeUrl(n.apkUrl), link = safeUrl(n.linkUrl);
      $("nsBody").innerHTML = `<div>${esc(n.message).replace(/\n/g, "<br>")}</div>` +
        ((apk || link) ? `<div class="acts">${apk ? `<a class="apk" href="${esc(apk)}" target="_blank" rel="noopener noreferrer">Download APK</a>` : ""}${link ? `<a href="${esc(link)}" target="_blank" rel="noopener noreferrer">Open Link</a>` : ""}</div>` : "");
      $("noticeSheet").classList.add("show");
    };
  } catch (e) {}
}

$("nsClose").onclick = () => $("noticeSheet").classList.remove("show");
$("noticeSheet").addEventListener("click", (e) => { if (e.target === $("noticeSheet")) $("noticeSheet").classList.remove("show"); });

// Tasks
function loadTasks() {
  const list = $("pTasks");
  onSnapshot(query(collection(db, "tasks"), where("active", "==", true)), (snap) => {
    const now = new Date();
    const tasks = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .filter(t => { const e = t.endTime?.toDate?.(); return !e || e > now; })
      .sort((a, b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));
      
    $("cntTasks").textContent = tasks.length;
    
    if (!tasks.length) {
      list.innerHTML = `<div class="x-empty">${S.inbox}এখনো কোনো open task নেই</div>`;
    } else {
      list.innerHTML = tasks.slice(0, 6).map(customTaskRow).join("") +
        `<a class="x-more" href="tasks.html">সব Task দেখুন ${S.chev}</a>`;
    }
    mark("tasks");
  }, (e) => { list.innerHTML = `<div class="x-empty">${esc(e.message)}</div>`; mark("tasks"); });
}

// ✅ LIVE TIMER UPDATE (প্রতি সেকেন্ডে আপডেট হবে)
setInterval(() => {
  document.querySelectorAll('.x-tag.time').forEach(el => {
    const startMs = Number(el.dataset.start) || 0;
    const endMs = Number(el.dataset.end) || 0;
    const st = getFormattedTime(endMs, startMs);
    
    const textEl = el.querySelector('.time-text');
    if (textEl) textEl.textContent = st.t;
    
    el.className = `x-tag time ${st.k}${st.isDanger ? ' danger' : ''}`;
  });
}, 1000);

// Activity
function loadActivity(uid) {
  const list = $("pAct");
  onSnapshot(query(collection(db, "submissions"), where("userId", "==", uid)), (snap) => {
    $("sSubs").textContent = snap.size;
    if (snap.empty) {
      list.innerHTML = `<div class="x-empty">${S.inbox}এখনো কোনো submission নেই</div>`;
      mark("subs");
      return;
    }
    const groups = {};
    snap.docs.forEach(d => {
      const s = d.data();
      if (!s.taskId) return;
      const g = groups[s.taskId] || (groups[s.taskId] = { title: s.taskTitle || "Task", platform: s.taskPlatform || "Other", good: 0, bad: 0, pending: 0, earned: 0, last: 0 });
      if (s.status === "good") { g.good++; g.earned += Number(s.earned) || 0; } // Milestone earned amount used here
      else if (s.status === "bad") g.bad++;
      else g.pending++;
      const t = s.checkedAt?.toMillis?.() || s.submittedAt?.toMillis?.() || 0;
      if (t > g.last) g.last = t;
    });
    const rows = Object.values(groups).sort((a, b) => b.last - a.last).slice(0, 8);
    
    list.innerHTML = rows.map(g => `
      <a href="task-history.html" class="act-row">
        ${logo(g.platform)}
        <div class="x-rb">
          <div class="x-rt">${esc(g.title)}</div>
          <div class="act-chips"><span class="g">${g.good} good</span><span class="b">${g.bad} bad</span>${g.pending ? `<span class="p">${g.pending} pending</span>` : ""}</div>
        </div>
        <span class="act-earn ${g.earned > 0 ? "" : "zero"}">${g.earned > 0 ? "+৳" + g.earned : "৳0"}</span>
      </a>`).join("") + `<a class="x-more" href="task-history.html">পুরো History ${S.chev}</a>`;
    mark("subs");
  }, () => mark("subs"));
}
</script>
