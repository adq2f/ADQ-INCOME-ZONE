<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>নোটিফিকেশন — ADQ Income Zone</title>
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>

  <div class="navbar">
    <div class="logo">
      <div class="mark">A</div>
      <span>ADQ Income Zone</span>
    </div>
    <button class="nav-logout" id="logoutBtn" title="Logout">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </div>

  <div class="container">
    <div class="dash-section-head">
      <h3>🔔 নোটিফিকেশন</h3>
    </div>
    <div id="notifList" class="loading"><div class="spinner"></div>লোড হচ্ছে...</div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" data-page="home"><span class="nav-ic"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span><span class="nav-label">Home</span></a>
    <a href="dashboard.html" data-page="dashboard" class="active"><span class="nav-ic"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg></span><span class="nav-label">Dashboard</span></a>
    <a href="index.html#tasks" data-page="submit"><span class="nav-ic"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></span><span class="nav-label">Submit</span></a>
    <a href="wallet.html" data-page="wallet"><span class="nav-ic"><svg viewBox="0 0 24 24"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></svg></span><span class="nav-label">Wallet</span></a>
    <a href="profile.html" data-page="profile"><span class="nav-ic"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><span class="nav-label">Profile</span></a>
  </nav>

  <script type="module">
    import { auth, db } from "./firebase.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    document.getElementById("logoutBtn").onclick = async () => {
      if (!confirm("লগআউট?")) return;
      await signOut(auth);
      location.href = "index.html";
    };

    onAuthStateChanged(auth, async (user) => {
      if (!user) { location.href = "login.html"; return; }
      const notifications = [];

      // Notices
      try {
        const q = query(collection(db, "notices"), where("active", "==", true));
        const snap = await getDocs(q);
        snap.forEach(d => {
          const n = d.data();
          notifications.push({
            type: "notice", icon: "📢",
            title: n.title, message: n.message,
            sortTime: n.createdAt?.toMillis?.() || Date.now(),
            time: n.createdAt?.toDate?.() || new Date()
          });
        });
      } catch (e) {}

      // Tasks
      try {
        const q = query(collection(db, "tasks"), where("active", "==", true));
        const snap = await getDocs(q);
        snap.forEach(d => {
          const t = d.data();
          notifications.push({
            type: "task", icon: "🎯",
            title: "নতুন Task: " + t.title,
            message: `প্রতি account ৳${t.pricePerAccount}`,
            sortTime: t.createdAt?.toMillis?.() || Date.now(),
            time: t.createdAt?.toDate?.() || new Date()
          });
        });
      } catch (e) {}

      // Submissions
      try {
        const q = query(collection(db, "submissions"), where("userId", "==", user.uid));
        const snap = await getDocs(q);
        snap.forEach(d => {
          const s = d.data();
          if (s.status === "good") {
            notifications.push({
              type: "good", icon: "✅",
              title: "Good account approved",
              message: `UID ${s.uid} — ৳${s.price} যোগ হয়েছে`,
              sortTime: s.checkedAt?.toMillis?.() || s.submittedAt?.toMillis?.() || Date.now(),
              time: s.checkedAt?.toDate?.() || s.submittedAt?.toDate?.() || new Date()
            });
          } else if (s.status === "bad") {
            notifications.push({
              type: "bad", icon: "❌",
              title: "Bad account detected",
              message: `UID ${s.uid} — কোনো reward নেই`,
              sortTime: s.checkedAt?.toMillis?.() || s.submittedAt?.toMillis?.() || Date.now(),
              time: s.checkedAt?.toDate?.() || s.submittedAt?.toDate?.() || new Date()
            });
          }
        });
      } catch (e) {}

      notifications.sort((a, b) => b.sortTime - a.sortTime);
      const list = document.getElementById("notifList");

      if (notifications.length === 0) {
        list.innerHTML = `<div class="dash-empty"><div class="em">🔕</div><p>কোনো notification নেই</p></div>`;
        return;
      }

      list.innerHTML = notifications.map((n, i) => {
        const time = n.time.toLocaleString("bn-BD", {
          day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"
        });
        return `
          <div class="notif-item ${n.type}-type" style="animation-delay:${i * 0.03}s">
            <div class="notif-icon">${n.icon}</div>
            <div class="notif-content">
              <h4>${n.title}</h4>
              <p>${n.message}</p>
              <div class="notif-time">🕐 ${time}</div>
            </div>
          </div>
        `;
      }).join("");
    });
  </script>
</body>
</html>
