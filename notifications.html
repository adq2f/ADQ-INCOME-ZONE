<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>নোটিফিকেশন — ADQ Income Zone</title>
  <link rel="stylesheet" href="style.css?v=28">
  <style>
    /* ===== Premium Notification Cards ===== */
    .notif-premium-item {
      position: relative;
      background: white;
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      box-shadow: 0 4px 16px rgba(15,23,42,0.06);
      border-left: 4px solid #6366f1;
      overflow: hidden;
      animation: notifSlideIn 0.45s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes notifSlideIn {
      from { opacity: 0; transform: translateX(-16px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .notif-premium-item.notice-type { border-left-color: #f59e0b; }
    .notif-premium-item.task-type   { border-left-color: #6366f1; }
    .notif-premium-item.good-type   { border-left-color: #10b981; }
    .notif-premium-item.bad-type    { border-left-color: #ef4444; }

    .notif-premium-item .npi-icon {
      width: 42px; height: 42px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      background: #eef2ff;
    }
    .notif-premium-item.notice-type .npi-icon { background: #fef3c7; }
    .notif-premium-item.task-type   .npi-icon { background: #eef2ff; }
    .notif-premium-item.good-type   .npi-icon { background: #d1fae5; }
    .notif-premium-item.bad-type    .npi-icon { background: #fee2e2; }

    .notif-premium-item .npi-body { flex: 1; min-width: 0; }
    .notif-premium-item .npi-title {
      font-size: 14px; font-weight: 700; color: #0f172a;
      margin-bottom: 3px;
    }
    .notif-premium-item .npi-msg {
      font-size: 12.5px; color: #64748b;
      line-height: 1.5;
      margin-bottom: 6px;
    }
    .notif-premium-item .npi-time {
      font-size: 10.5px; color: #94a3b8;
      font-weight: 600;
    }
    .notif-premium-item.unread::after {
      content: '';
      position: absolute;
      top: 14px; right: 14px;
      width: 8px; height: 8px;
      background: #ef4444;
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(239,68,68,0.2);
      animation: unreadPulse 1.6s ease-in-out infinite;
    }
    @keyframes unreadPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%      { transform: scale(1.3); opacity: 0.6; }
    }
  </style>
</head>
<body>

  <div class="navbar">
    <button class="nav-back" onclick="goBack()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="logo">
      <div class="mark">A</div>
      <span>নোটিফিকেশন</span>
    </div>
    <button class="nav-logout" id="logoutBtn" title="Logout">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </div>

  <div class="container">
    <div class="dash-section-head">
      <h3>🔔 নোটিফিকেশন</h3>
    </div>
    <div id="notifList" class="loading"><div class="spinner"></div>লোড হচ্ছে...</div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" data-page="home"><span class="nav-ic"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span><span class="nav-label">Home</span></a>
    <a href="dashboard.html" data-page="dashboard" class="active"><span class="nav-ic"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg></span><span class="nav-label">Dashboard</span></a>
    <a href="index.html#tasks" data-page="submit"><span class="nav-ic"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></span><span class="nav-label">Submit</span></a>
    <a href="wallet.html" data-page="wallet"><span class="nav-ic"><svg viewBox="0 0 24 24"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></svg></span><span class="nav-label">Wallet</span></a>
    <a href="profile.html" data-page="profile"><span class="nav-ic"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><span class="nav-label">Profile</span></a>
  </nav>

  <script type="module">
    import { auth, db } from "./firebase.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    window.goBack = function() {
      if (document.referrer && document.referrer.includes(window.location.hostname) && history.length > 1) {
        history.back();
      } else {
        location.href = "dashboard.html";
      }
    };

    document.getElementById("logoutBtn").onclick = async () => {
      if (!confirm("লগআউট?")) return;
      await signOut(auth);
      location.href = "index.html";
    };

    onAuthStateChanged(auth, async (user) => {
      if (!user) { location.href = "login.html"; return; }
      const notifications = [];

      // Notices
      try {
        const q = query(collection(db, "notices"), where("active", "==", true));
        const snap = await getDocs(q);
        snap.forEach(d => {
          const n = d.data();
          notifications.push({
            type: "notice", icon: "📢",
            title: n.title, message: n.message,
            sortTime: n.createdAt?.toMillis?.() || Date.now(),
            time: n.createdAt?.toDate?.() || new Date()
          });
        });
      } catch (e) {}

      // Tasks
      try {
        const q = query(collection(db, "tasks"), where("active", "==", true));
        const snap = await getDocs(q);
        snap.forEach(d => {
          const t = d.data();
          notifications.push({
            type: "task", icon: "🎯",
            title: "নতুন Task: " + t.title,
            message: `প্রতি account ৳${t.pricePerAccount}`,
            sortTime: t.createdAt?.toMillis?.() || Date.now(),
            time: t.createdAt?.toDate?.() || new Date()
          });
        });
      } catch (e) {}

      // Submissions
      try {
        const q = query(collection(db, "submissions"), where("userId", "==", user.uid));
        const snap = await getDocs(q);
        snap.forEach(d => {
          const s = d.data();
          if (s.status === "good") {
            notifications.push({
              type: "good", icon: "✅",
              title: "Good account approved",
              message: `UID ${s.uid} — ৳${s.price} যোগ হয়েছে`,
              sortTime: s.checkedAt?.toMillis?.() || s.submittedAt?.toMillis?.() || Date.now(),
              time: s.checkedAt?.toDate?.() || s.submittedAt?.toDate?.() || new Date()
            });
          } else if (s.status === "bad") {
            notifications.push({
              type: "bad", icon: "❌",
              title: "Bad account detected",
              message: `UID ${s.uid} — কোনো reward নেই`,
              sortTime: s.checkedAt?.toMillis?.() || s.submittedAt?.toMillis?.() || Date.now(),
              time: s.checkedAt?.toDate?.() || s.submittedAt?.toDate?.() || new Date()
            });
          }
        });
      } catch (e) {}

      notifications.sort((a, b) => b.sortTime - a.sortTime);
      const list = document.getElementById("notifList");

      if (notifications.length === 0) {
        list.innerHTML = `<div class="dash-empty"><div class="em">🔕</div><p>কোনো notification নেই</p></div>`;
        return;
      }

      list.innerHTML = notifications.map((n, i) => {
        const time = n.time.toLocaleString("bn-BD", {
          day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"
        });
        return `
          <div class="notif-premium-item ${n.type}-type" style="animation-delay:${i * 0.04}s">
            <div class="npi-icon">${n.icon}</div>
            <div class="npi-body">
              <div class="npi-title">${n.title}</div>
              <div class="npi-msg">${n.message}</div>
              <div class="npi-time">🕐 ${time}</div>
            </div>
          </div>
        `;
      }).join("");
    });
  </script>
</body>
</html>
