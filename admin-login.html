<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — ADQ Income Zone</title>
  <link rel="stylesheet" href="style.css?v=28">
  <style>
    body {
      background: linear-gradient(165deg, #1e1b4b 0%, #312e81 45%, #4c1d95 100%);
    }
    .admin-lock-icon {
      width: 90px;
      height: 90px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
      box-shadow: 0 20px 50px rgba(245,158,11,0.5);
      animation: pulseGlow 2s ease-in-out infinite;
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 20px 50px rgba(245,158,11,0.5); }
      50% { box-shadow: 0 20px 60px rgba(245,158,11,0.8); }
    }
    .admin-badge {
      display: inline-block;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-box">
      <div class="admin-lock-icon">🔐</div>
      <div style="text-align:center"><span class="admin-badge">Admin Access</span></div>
      <h1 class="auth-title">Admin Verification</h1>
      <p class="auth-subtitle">এই পেজে ঢুকতে Admin Password দিতে হবে</p>

      <div class="alert alert-error" id="errorBox" style="display:none">
        <div class="badge-icon">✕</div>
        <div id="errorMsg">ভুল password!</div>
      </div>

      <div class="field">
        <span class="field-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </span>
        <input type="password" id="adminPass" placeholder="Admin Password">
        <button type="button" class="field-toggle" onclick="togglePass('adminPass', this)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <button class="btn btn-primary" id="verifyBtn" style="background: linear-gradient(135deg, #f59e0b, #d97706); box-shadow: 0 8px 20px rgba(245,158,11,0.4)">
        🔓 Verify & Enter Admin Panel
      </button>

      <p class="switch-text">
        <a href="dashboard.html">← Back to Dashboard</a>
      </p>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    window.togglePass = function(id, btn) {
      const input = document.getElementById(id);
      input.type = input.type === "password" ? "text" : "password";
      btn.style.color = input.type === "text" ? "#f59e0b" : "";
    };

    onAuthStateChanged(auth, async (user) => {
      if (!user) { location.href = "login.html"; return; }
      const snap = await getDoc(doc(db, "users", user.uid));
      if (!snap.exists() || snap.data().role !== "admin") {
        alert("❌ আপনি admin না!");
        location.href = "dashboard.html";
        return;
      }
    });

    document.getElementById("verifyBtn").onclick = async () => {
      const pass = document.getElementById("adminPass").value;
      const btn = document.getElementById("verifyBtn");
      const errorBox = document.getElementById("errorBox");

      if (!pass) return alert("Password দাও!");

      btn.disabled = true;
      btn.textContent = "Verifying...";
      errorBox.style.display = "none";

      try {
        const snap = await getDoc(doc(db, "settings", "admin_pass"));
        if (!snap.exists()) {
          errorBox.style.display = "flex";
          document.getElementById("errorMsg").textContent = "Admin password set করা হয়নি। Firestore → settings → admin_pass document তৈরি করো (field: password = 'তোমার_password')";
          btn.disabled = false;
          btn.textContent = "🔓 Verify & Enter Admin Panel";
          return;
        }

        const correctPass = snap.data().password;

        if (pass !== correctPass) {
          errorBox.style.display = "flex";
          document.getElementById("errorMsg").textContent = "❌ ভুল password! আবার চেষ্টা করো।";
          btn.disabled = false;
          btn.textContent = "🔓 Verify & Enter Admin Panel";
          return;
        }

        // ✅ Success — 4 hour session
        sessionStorage.setItem("admin_verified", Date.now().toString());

        // Check return path
        const returnPath = sessionStorage.getItem("admin_return");
        if (returnPath) {
          sessionStorage.removeItem("admin_return");
          alert("✅ Admin Verified!");
          location.href = returnPath;
        } else {
          alert("✅ Admin Verified!");
          location.href = "admin.html";
        }
      } catch (e) {
        alert("❌ " + e.message);
        btn.disabled = false;
        btn.textContent = "🔓 Verify & Enter Admin Panel";
      }
    };
  </script>
</body>
</html>
