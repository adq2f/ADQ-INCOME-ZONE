<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Admin Login — ADQ Income Zone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#06060f;--ink:#f4f4ff;--muted:#9a9bb8;--dim:#6f7090;--line:rgba(255,255,255,.09);--cyan:#22d3ee}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
html,body{background:var(--bg)!important}
body{font-family:'Hind Siliguri','Inter',system-ui,sans-serif!important;color:var(--ink);margin:0;padding:0!important;min-height:100vh;min-height:100dvh;overflow-x:hidden;position:relative}
a{text-decoration:none;color:inherit}button{font-family:inherit}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(90px);will-change:transform}
.orb.o1{width:420px;height:420px;background:#4f46e5;top:-140px;left:-120px;opacity:.5;animation:dr1 20s ease-in-out infinite}
.orb.o2{width:380px;height:380px;background:#9333ea;bottom:-160px;right:-120px;opacity:.42;animation:dr2 24s ease-in-out infinite}
@keyframes dr1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,40px) scale(1.1)}}
@keyframes dr2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-40px,-50px) scale(1.08)}}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 20%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 0%,#000 20%,transparent 70%)}
.top{position:sticky;top:0;z-index:50;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;background:rgba(6,6,15,.65);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border-bottom:1px solid var(--line)}
.top-in{max-width:520px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
.mark{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#6366f1,#8b5cf6 55%,#22d3ee);color:#fff;font-family:'Inter';font-weight:900;font-size:16px;box-shadow:0 8px 20px -6px rgba(139,92,246,.8),inset 0 1px 0 rgba(255,255,255,.35)}
.ibtn{width:40px;height:40px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;flex:0 0 40px}
.ibtn:hover{color:#fff;background:rgba(255,255,255,.1)}
.ibtn.danger:hover{background:rgba(239,68,68,.18);border-color:rgba(239,68,68,.45)}
.ibtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.page{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:20px 16px calc(130px + env(safe-area-inset-bottom,0px))}
.sec{margin:26px 2px 12px;font-size:17px;font-weight:700;letter-spacing:-.2px;display:flex;align-items:center;justify-content:space-between}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.025));border:1px solid var(--line)}
.empty{text-align:center;padding:30px 16px;border-radius:22px;border:1.5px dashed rgba(255,255,255,.14);color:var(--muted);font-size:13.5px;font-weight:600}
.empty .em{font-size:30px;margin-bottom:6px}
.skel{height:92px;border-radius:22px;margin-bottom:10px;border:1px solid var(--line);background:linear-gradient(100deg,rgba(255,255,255,.04) 30%,rgba(255,255,255,.1) 50%,rgba(255,255,255,.04) 70%);background-size:200% 100%;animation:shim 1.4s infinite linear}
.skel.big{height:170px;border-radius:28px}
@keyframes shim{to{background-position:-200% 0}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.dock{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:calc(100% - 24px);max-width:500px;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:8px;background:rgba(18,18,40,.78);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);border:1px solid rgba(255,255,255,.12);border-radius:26px;box-shadow:0 20px 50px -10px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.1)}
.dock a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 6px;border-radius:18px;color:var(--dim);font-size:10.5px;font-weight:600;transition:.25s}
.dock a svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:.25s}
.dock a:hover{color:#fff}
.dock a.active{color:#fff;background:linear-gradient(135deg,rgba(99,102,241,.5),rgba(139,92,246,.35));box-shadow:inset 0 0 0 1px rgba(167,139,250,.5),0 8px 20px -8px rgba(139,92,246,.9)}
.dock a.active svg{transform:translateY(-1px) scale(1.08)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.orb,.skel{animation:none}}

.fcard{border-radius:26px;padding:20px;margin-bottom:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.fcard h3{margin:0 0 14px;font-size:17px;font-weight:700}
.lab{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:14px 2px 7px}
.field{position:relative;display:flex;align-items:center;margin-bottom:4px;background:rgba(255,255,255,.05);border:1.5px solid var(--line);border-radius:16px;transition:.25s}
.field:hover{background:rgba(255,255,255,.07)}
.field:focus-within{border-color:rgba(139,92,246,.9);background:rgba(139,92,246,.08);box-shadow:0 0 0 4px rgba(139,92,246,.18),0 8px 24px -10px rgba(139,92,246,.6)}
.field.err{border-color:rgba(239,68,68,.9);box-shadow:0 0 0 4px rgba(239,68,68,.15)}
.f-ic{flex:0 0 48px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:16px;font-weight:800}
.field:focus-within .f-ic{color:#c4b5fd}
.f-ic svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.field input{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--ink);font-family:inherit;font-size:15.5px;font-weight:500;padding:16px 12px 16px 0}
.field input::placeholder{color:#6f7090;font-weight:400}
.field input:-webkit-autofill{-webkit-text-fill-color:var(--ink);-webkit-box-shadow:0 0 0 60px #15152b inset}
.f-tg{flex:0 0 46px;align-self:stretch;background:transparent;border:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
.f-tg:hover{color:#fff}
.f-tg svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cta{position:relative;overflow:hidden;display:block;width:100%;border:none;cursor:pointer;border-radius:16px;padding:16px;color:#fff;font-size:16px;font-weight:700;transition:.25s;text-align:center}
.cta.purple{background:linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#a855f7 100%);box-shadow:0 16px 34px -10px rgba(139,92,246,.9),inset 0 1px 0 rgba(255,255,255,.35)}
.cta.green{background:linear-gradient(135deg,#10b981,#0d9488);box-shadow:0 16px 32px -12px rgba(16,185,129,.9),inset 0 1px 0 rgba(255,255,255,.3)}
.cta::before{content:'';position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);transition:left .7s}
.cta:hover:not(:disabled)::before{left:130%}
.cta:hover:not(:disabled){transform:translateY(-2px)}
.cta:active:not(:disabled){transform:scale(.985)}
.cta:disabled{filter:saturate(.5) brightness(.85);cursor:not-allowed}
.cta.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--muted);box-shadow:none}

body{padding-bottom:0!important}
.shell{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:28px 16px}
.acard{width:100%;max-width:440px;position:relative;text-align:center;background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.025));backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);border-radius:28px;padding:36px 26px 26px;box-shadow:0 30px 80px -20px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.12);animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.acard::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.2px;background:linear-gradient(145deg,rgba(251,191,36,.8),rgba(255,255,255,.08) 40%,rgba(139,92,246,.7));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.ico{width:76px;height:76px;margin:0 auto 18px;border-radius:24px;position:relative;display:flex;align-items:center;justify-content:center;font-size:38px;background:linear-gradient(135deg,#fbbf24,#f59e0b 55%,#d97706);box-shadow:0 16px 38px -8px rgba(245,158,11,.8),inset 0 2px 0 rgba(255,255,255,.4);animation:pg 2.4s ease-in-out infinite alternate}
.ico::after{content:'';position:absolute;inset:-6px;border-radius:28px;border:1px solid rgba(251,191,36,.35)}
.ico.green{background:linear-gradient(135deg,#34d399,#10b981 55%,#059669);box-shadow:0 16px 38px -8px rgba(16,185,129,.8),inset 0 2px 0 rgba(255,255,255,.4)}
.ico.green::after{border-color:rgba(16,185,129,.35)}
.ico.red{background:linear-gradient(135deg,#f87171,#ef4444 55%,#b91c1c);box-shadow:0 16px 38px -8px rgba(239,68,68,.8),inset 0 2px 0 rgba(255,255,255,.4)}
.ico.red::after{border-color:rgba(239,68,68,.35)}
@keyframes pg{from{transform:scale(1)}to{transform:scale(1.05)}}
.atitle{margin:0;font-size:26px;font-weight:700;letter-spacing:-.3px;line-height:1.25}
.asub{margin:8px 0 22px;font-size:14px;color:var(--muted);font-weight:500;line-height:1.6}
.alert{display:none;align-items:flex-start;gap:12px;text-align:left;padding:14px;border-radius:16px;margin-bottom:16px;font-size:13.5px;font-weight:600;line-height:1.55}
.alert.ok{background:linear-gradient(135deg,rgba(16,185,129,.22),rgba(16,185,129,.08));border:1px solid rgba(16,185,129,.5);color:#a7f3d0}
.alert.bad{background:linear-gradient(135deg,rgba(239,68,68,.2),rgba(239,68,68,.06));border:1px solid rgba(239,68,68,.5);color:#fca5a5}
.alert .bi{width:26px;height:26px;flex:0 0 26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff}
.alert.ok .bi{background:#10b981}.alert.bad .bi{background:#ef4444}
.anote{text-align:left;padding:13px 14px;border-radius:16px;margin-bottom:18px;font-size:13px;line-height:1.65;color:#fde9a8;background:linear-gradient(135deg,rgba(251,191,36,.15),rgba(245,158,11,.04));border:1px solid rgba(251,191,36,.38);border-left:4px solid #fbbf24;font-weight:500}
.anote b{color:#fde68a}
.ebadge{display:inline-block;max-width:100%;padding:8px 16px;border-radius:999px;margin-bottom:20px;font-size:13px;font-weight:700;word-break:break-all;color:#c4b5fd;background:rgba(99,102,241,.2);border:1px solid rgba(139,92,246,.45)}
.back{display:inline-block;margin-top:22px;font-size:14px;font-weight:700;color:#c4b5fd;border-bottom:1.5px solid rgba(196,181,253,.35);transition:.2s}
.back:hover{color:#fff;border-color:#fff}
.stt{display:none}.stt.show{display:block}
.spin{width:52px;height:52px;margin:6px auto 16px;border-radius:50%;border:4px solid rgba(255,255,255,.12);border-top-color:#8b5cf6;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.f-lbl{display:block;text-align:left;font-size:12.5px;font-weight:700;color:var(--muted);margin:0 2px 7px}
.fg{margin-bottom:14px}
.strength{display:none;margin:8px 2px 0}
.strength-bars{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.strength-bars i{height:4px;border-radius:4px;background:rgba(255,255,255,.1);transition:background .3s}
.strength-text{margin-top:6px;font-size:12px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between}
.hint{margin:6px 4px 0;font-size:12px;font-weight:600;text-align:left;display:none}
.hint.ok{color:#6ee7b7;display:block}.hint.bad{color:#fca5a5;display:block}
.cta.amber{background:linear-gradient(135deg,#fbbf24,#f59e0b 55%,#d97706);box-shadow:0 16px 34px -10px rgba(245,158,11,.9),inset 0 1px 0 rgba(255,255,255,.4);color:#2a1700}
@media(max-width:420px){.acard{padding:30px 18px 22px;border-radius:24px}.atitle{font-size:23px}}
@media(prefers-reduced-motion:reduce){.acard,.ico,.spin{animation:none}}

.atag{font-style:normal;font-size:10px;font-weight:800;letter-spacing:.8px;color:#2a1700;background:linear-gradient(135deg,#fde68a,#f59e0b);padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:2px}
.top .mark{background:linear-gradient(135deg,#fbbf24,#f59e0b 55%,#d97706);color:#2a1700;box-shadow:0 8px 20px -6px rgba(245,158,11,.8),inset 0 1px 0 rgba(255,255,255,.4)}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="orb o1"></div><div class="orb o2"></div><div class="grid"></div></div>
<div class="shell"><div class="acard" style="text-align:center;max-width:440px;margin:0;padding:36px 26px 26px">
  <div class="ico">🔐</div>
  <span class="atag" style="margin:0 0 12px;display:inline-block;padding:4px 12px;font-size:11px;font-style:normal">ADMIN ACCESS</span>
  <h1 class="atitle">Admin Verification</h1>
  <p class="asub">এই পেজে ঢুকতে Admin Password দিতে হবে</p>

  <div class="alert bad" id="errorBox"><div class="bi">✕</div><div id="errorMsg">ভুল password!</div></div>

  <div class="field"><span class="f-ic"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span><input type="password" id="adminPass" placeholder="Admin Password" autocomplete="off"><button type="button" class="f-tg" aria-label="দেখান" onclick="togglePass('adminPass', this)"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div>

  <button class="cta amber" id="verifyBtn" style="margin-top:16px">🔓 Verify &amp; Enter Admin Panel</button>
  <a href="dashboard.html" class="back">← Back to Dashboard</a>
</div></div>


<script type="module">
    import { auth, db } from "./firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    window.togglePass = function(id, btn) {
      const input = document.getElementById(id);
      input.type = input.type === "password" ? "text" : "password";
      btn.style.color = input.type === "text" ? "#fbbf24" : "";
    };

    // ✅ Check if already verified — skip if session valid
    const SESSION_DURATION = 12 * 60 * 60 * 1000; // 12 hours
    const existingSession = sessionStorage.getItem("admin_verified");
    if (existingSession && (Date.now() - parseInt(existingSession)) < SESSION_DURATION) {
      location.href = "admin.html";
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        location.href = "login.html";
        return;
      }
      try {
        const snap = await getDoc(doc(db, "users", user.uid));
        if (!snap.exists() || snap.data().role !== "admin") {
          alert("❌ আপনি admin না!");
          location.href = "dashboard.html";
          return;
        }
      } catch (e) {
        location.href = "dashboard.html";
        return;
      }
    });

    document.getElementById("verifyBtn").onclick = async () => {
      const pass = document.getElementById("adminPass").value;
      const btn = document.getElementById("verifyBtn");
      const errorBox = document.getElementById("errorBox");

      if (!pass) return alert("Password দাও!");

      btn.disabled = true;
      btn.textContent = "Verifying...";
      errorBox.style.display = "none";

      try {
        const snap = await getDoc(doc(db, "settings", "admin_pass"));
        if (!snap.exists()) {
          errorBox.style.display = "flex";
          document.getElementById("errorMsg").textContent = "Admin password set করা হয়নি।";
          btn.disabled = false;
          btn.textContent = "🔓 Verify & Enter Admin Panel";
          return;
        }

        const correctPass = snap.data().password;

        if (pass !== correctPass) {
          errorBox.style.display = "flex";
          document.getElementById("errorMsg").textContent = "❌ ভুল password!";
          btn.disabled = false;
          btn.textContent = "🔓 Verify & Enter Admin Panel";
          return;
        }

        // ✅ Success — 12 hour session
        sessionStorage.setItem("admin_verified", Date.now().toString());

        const returnPath = sessionStorage.getItem("admin_return");
        if (returnPath) {
          sessionStorage.removeItem("admin_return");
          alert("✅ Admin Verified!");
          location.href = returnPath;
        } else {
          alert("✅ Admin Verified!");
          location.href = "admin.html";
        }
      } catch (e) {
        alert("❌ " + e.message);
        btn.disabled = false;
        btn.textContent = "🔓 Verify & Enter Admin Panel";
      }
    };

    document.getElementById("adminPass").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("verifyBtn").click();
    });
  </script>

</body>
</html>
