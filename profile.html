<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>প্রোফাইল — ADQ Income Zone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
<script src="app-shell.js"></script>
<style>
:root {
  --bg: #06060f; --ink: #f4f4ff; --muted: #9a9bb8; --dim: #6f7090;
  --line: rgba(255,255,255,0.09); --cyan: #22d3ee;
}
* { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
html, body { background: var(--bg) !important; }
body { font-family: 'Hind Siliguri', 'Inter', system-ui, sans-serif !important; color: var(--ink); margin: 0; min-height: 100vh; min-height: 100dvh; overflow-x: hidden; position: relative; }
a { text-decoration: none; color: inherit; }
button { font-family: inherit; }

/* Background */
.p-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.p-orb { position: absolute; border-radius: 50%; filter: blur(90px); will-change: transform; }
.p-orb.o1 { width: 420px; height: 420px; background: #4f46e5; top: -140px; left: -120px; opacity: .5; animation: pDrift1 20s ease-in-out infinite; }
.p-orb.o2 { width: 380px; height: 380px; background: #9333ea; bottom: -160px; right: -120px; opacity: .42; animation: pDrift2 24s ease-in-out infinite; }
@keyframes pDrift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(50px,40px) scale(1.1); } }
@keyframes pDrift2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-40px,-50px) scale(1.08); } }
.p-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px); background-size: 44px 44px; mask-image: radial-gradient(ellipse at 50% 0%, #000 20%, transparent 70%); -webkit-mask-image: radial-gradient(ellipse at 50% 0%, #000 20%, transparent 70%); }

/* Top bar */
.p-top { position: sticky; top: 0; z-index: 50; padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px; background: rgba(6,6,15,.75); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); border-bottom: 1px solid var(--line); }
.p-top-in { max-width: 520px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.p-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
.p-mark { width: 30px; height: 30px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #6366f1, #8b5cf6 55%, #22d3ee); color: #fff; font-family: 'Inter'; font-weight: 900; font-size: 14px; box-shadow: 0 8px 20px -6px rgba(139,92,246,.8), inset 0 1px 0 rgba(255,255,255,.35); }
.p-icon-btn { width: 36px; height: 36px; border-radius: 11px; border: 1px solid var(--line); background: rgba(255,255,255,.05); color: var(--muted); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: .2s; }
.p-icon-btn:hover { color: #fff; background: rgba(255,255,255,.1); }
.p-icon-btn.danger:hover { background: rgba(239,68,68,.18); border-color: rgba(239,68,68,.45); color: #fca5a5; }
.p-icon-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

.p-page { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; padding: 16px 16px calc(100px + env(safe-area-inset-bottom, 0px)); }

/* Hero (Compact) */
.p-hero { text-align: center; margin-bottom: 14px; }
.p-ring { width: 72px; height: 72px; margin: 0 auto 10px; padding: 2.5px; border-radius: 50%; background: conic-gradient(from 200deg, #6366f1, #22d3ee, #a855f7, #f472b6, #6366f1); box-shadow: 0 0 30px -6px rgba(139,92,246,.75); }
.p-avatar { width: 100%; height: 100%; border-radius: 50%; background: #12122a; border: 2.5px solid var(--bg); display: flex; align-items: center; justify-content: center; font-family: 'Inter'; font-size: 28px; font-weight: 900; color: #fff; }
.p-name-row { display: flex; align-items: center; justify-content: center; gap: 6px; }
.p-name { font-size: 20px; font-weight: 700; letter-spacing: -.3px; white-space: nowrap; overflow-x: auto; max-width: 240px; scrollbar-width: none; }
.p-name::-webkit-scrollbar { display: none; }
.p-email { margin-top: 2px; font-size: 12.5px; color: var(--muted); font-weight: 500; }

/* Stats (Compact) */
.p-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.p-stat { position: relative; overflow: hidden; padding: 10px 4px 8px; border-radius: 16px; text-align: center; background: linear-gradient(160deg, rgba(255,255,255,.075), rgba(255,255,255,.025)); border: 1px solid var(--line); }
.p-stat::before { content: ''; position: absolute; top: 0; left: 22%; right: 22%; height: 2px; border-radius: 0 0 4px 4px; background: var(--c); box-shadow: 0 0 10px var(--c); }
.p-stat .num { font-family: 'Inter'; font-size: 18px; font-weight: 900; line-height: 1.15; color: var(--c); }
.p-stat .lbl { font-size: 10.5px; color: var(--muted); font-weight: 600; margin-top: 2px; }
.p-stat.s1 { --c: #818cf8; } .p-stat.s2 { --c: #34d399; } .p-stat.s3 { --c: #fbbf24; }

/* Section head */
.p-sec { margin: 18px 2px 8px; font-size: 15px; font-weight: 700; letter-spacing: -.2px; display: flex; align-items: center; justify-content: space-between; }

/* Achievements (Ultra Compact Pills) */
.p-ach { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: none; }
.p-ach::-webkit-scrollbar { display: none; }
.p-ach-card { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,.04); border: 1px solid var(--line); transition: .3s; }
.p-ach-ic { width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; color: var(--dim); }
.p-ach-ic svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.p-ach-t { font-size: 11.5px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.p-ach-card.unlocked { background: linear-gradient(135deg, rgba(251,191,36,.15), rgba(245,158,11,.05)); border-color: rgba(251,191,36,.4); }
.p-ach-card.unlocked .p-ach-ic { color: #fbbf24; }
.p-ach-card.unlocked .p-ach-t { color: #fde68a; }

/* Menu (Compact) */
.p-menu-group { border-radius: 20px; overflow: hidden; background: linear-gradient(160deg, rgba(255,255,255,.065), rgba(255,255,255,.025)); border: 1px solid var(--line); }
.p-menu { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: transparent; border: none; border-bottom: 1px solid var(--line); color: var(--ink); text-align: left; cursor: pointer; transition: background .2s; }
.p-menu:last-child { border-bottom: none; }
.p-menu:hover { background: rgba(255,255,255,.05); }
.p-menu:active { background: rgba(255,255,255,.09); }
.p-menu-ic { width: 34px; height: 34px; flex: 0 0 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: var(--t); }
.p-menu-ic svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.p-menu-tx { flex: 1; min-width: 0; }
.p-menu-tx h4 { margin: 0 0 1px; font-size: 13.5px; font-weight: 700; }
.p-menu-tx p { margin: 0; font-size: 11px; color: var(--muted); font-weight: 500; }
.p-menu-arrow { color: var(--dim); }
.p-menu-arrow svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

.t-indigo { --t: rgba(99,102,241,.2); color: #818cf8; } .t-green { --t: rgba(16,185,129,.2); color: #34d399; } .t-amber { --t: rgba(245,158,11,.2); color: #fbbf24; } .t-blue { --t: rgba(14,165,233,.2); color: #38bdf8; } .t-red { --t: rgba(239,68,68,.2); color: #f87171; }

.p-logout { margin-top: 10px; border-radius: 20px; border: 1px solid rgba(239,68,68,.4) !important; background: linear-gradient(135deg, rgba(239,68,68,.14), rgba(239,68,68,.04)); }
.p-logout:hover { background: rgba(239,68,68,.2); }
.p-logout h4 { color: #fca5a5; }

/* Premium Badge (Dynamic) */
.premium-badge { width: 20px; height: 20px; flex-shrink: 0; position: relative; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; background: linear-gradient(135deg, #fceabb 0%, #f8b500 50%, #b47b00 100%); box-shadow: 0 4px 10px rgba(245, 158, 11, 0.4), inset 0 -2px 4px rgba(0,0,0,0.3), inset 0 2px 4px rgba(255,255,255,0.8); animation: premiumPulse 2s ease-in-out infinite alternate; overflow: hidden; border: 1px solid #ffd700; }
.premium-badge::before { content: '✓'; color: #ffffff; font-size: 11px; font-weight: 900; position: relative; z-index: 2; text-shadow: 0 2px 4px rgba(180, 123, 0, 0.9); transform: translateY(-0.5px); }
.premium-badge::after { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: linear-gradient(45deg, rgba(255,255,255,0) 20%, rgba(255,255,255,0.9) 50%, rgba(255,255,255,0) 80%); transform: rotate(45deg); animation: premiumShine 3s infinite ease-in-out; }
@keyframes premiumPulse { 0% { box-shadow: 0 4px 10px rgba(245, 158, 11, 0.4), inset 0 -2px 4px rgba(0,0,0,0.3), inset 0 2px 4px rgba(255,255,255,0.8); transform: scale(1); } 100% { box-shadow: 0 8px 20px rgba(245, 158, 11, 0.8), inset 0 -2px 4px rgba(0,0,0,0.3), inset 0 2px 4px rgba(255,255,255,0.8); transform: scale(1.05); } }
@keyframes premiumShine { 0% { left: -100%; } 20% { left: 100%; } 100% { left: 100%; } }
.premium-badge.silver { background: linear-gradient(135deg, #ffffff, #94a3b8, #64748b); border-color: #e2e8f0; }
.premium-badge.purple { background: linear-gradient(135deg, #d8b4fe, #a855f7, #6b21a8); border-color: #e9d5ff; }
.premium-badge.blue { background: linear-gradient(135deg, #93c5fd, #3b82f6, #1d4ed8); border-color: #bfdbfe; }
.premium-badge.green { background: linear-gradient(135deg, #6ee7b7, #10b981, #047857); border-color: #a7f3d0; }
.premium-badge.red { background: linear-gradient(135deg, #fca5a5, #ef4444, #b91c1c); border-color: #fecaca; }
.premium-badge.bronze { background: linear-gradient(135deg, #fdba74, #ea580c, #9a3412); border-color: #fed7aa; }

a:focus-visible, button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
</style>
</head>
<body>

<div class="p-bg" aria-hidden="true"><div class="p-orb o1"></div><div class="p-orb o2"></div><div class="p-grid"></div></div>

<header class="p-top">
  <div class="p-top-in">
    <button class="p-icon-btn" onclick="goBack()" aria-label="Back">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="p-brand"><div class="p-mark">A</div><span>My Profile</span></div>
    <button class="p-icon-btn danger" id="logoutBtn" aria-label="Logout">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </div>
</header>

<main class="p-page">

  <section class="p-hero">
    <div class="p-ring"><div class="p-avatar" id="avatar">U</div></div>
    <div class="p-name-row">
      <div class="p-name" id="username">Loading...</div>
      <div id="userBadgeDisplay" style="display:none;"><span class="premium-badge" id="userBadgeIcon"></span></div>
    </div>
    <div class="p-email" id="email">...</div>
  </section>

  <div class="p-stats">
    <div class="p-stat s1"><div class="num" id="statSubs">0</div><div class="lbl">Subs</div></div>
    <div class="p-stat s2"><div class="num" id="statGood">0</div><div class="lbl">Good</div></div>
    <div class="p-stat s3"><div class="num" id="statBalance">৳0</div><div class="lbl">Balance</div></div>
  </div>

  <div class="p-sec">Achievements</div>
  <div class="p-ach" id="achievementsList"></div>

  <div class="p-sec">Settings</div>

  <div class="p-menu-group">
    <a href="leaderboard.html" class="p-menu t-amber">
      <div class="p-menu-ic">
        <svg viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 010-5H6"/><path d="M18 9h1.5a2.5 2.5 0 000-5H18"/><path d="M4 22h16"/><path d="M18 2H6v7a6 6 0 0012 0V2z"/></svg>
      </div>
      <div class="p-menu-tx"><h4>Leaderboard</h4><p>কে টপে আছে দেখুন</p></div>
      <div class="p-menu-arrow"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>
    </a>
    <a href="wallet.html" class="p-menu t-green">
      <div class="p-menu-ic">
        <svg viewBox="0 0 24 24"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></svg>
      </div>
      <div class="p-menu-tx"><h4>Wallet &amp; Balance</h4><p>ব্যালেন্স ও লেনদেন</p></div>
      <div class="p-menu-arrow"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>
    </a>
    <a href="task-history.html" class="p-menu t-indigo">
      <div class="p-menu-ic">
        <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      </div>
      <div class="p-menu-tx"><h4>My Submissions</h4><p>সব submission ও রেজাল্ট</p></div>
      <div class="p-menu-arrow"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>
    </a>
    <button class="p-menu t-blue" id="changeUsernameBtn">
      <div class="p-menu-ic">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <div class="p-menu-tx"><h4>নাম পরিবর্তন</h4><p>username আপডেট করুন</p></div>
      <div class="p-menu-arrow"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>
    </button>
    <a href="reset-request.html" class="p-menu t-amber">
      <div class="p-menu-ic">
        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <div class="p-menu-tx"><h4>পাসওয়ার্ড রিসেট</h4><p>ইমেইলে রিসেট লিংক</p></div>
      <div class="p-menu-arrow"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>
    </a>
  </div>

  <button class="p-menu p-logout t-red" id="logoutMenuBtn">
    <div class="p-menu-ic">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </div>
    <div class="p-menu-tx"><h4>লগআউট</h4><p>নিরাপদে বেরিয়ে যান</p></div>
    <div class="p-menu-arrow"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>
  </button>
</main>

<script type="module">
    import { auth, db } from "./firebase.js";
    import { onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { doc, getDoc, updateDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    window.goBack = function() {
      if (document.referrer && document.referrer.includes(window.location.hostname) && history.length > 1) {
        history.back();
      } else {
        location.href = "dashboard.html";
      }
    };

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function getBadgeClass(color) {
      if (!color) return '';
      if (color.includes("#94a3b8") || color.includes("silver")) return 'silver';
      if (color.includes("#a855f7")) return 'purple';
      if (color.includes("#3b82f6")) return 'blue';
      if (color.includes("#10b981")) return 'green';
      if (color.includes("#ef4444")) return 'red';
      if (color.includes("#ea580c")) return 'bronze';
      return ''; // Golden
    }

    let currentUser = null, userData = null;

    document.getElementById("logoutBtn").onclick = doLogout;
    document.getElementById("logoutMenuBtn").onclick = doLogout;

    async function doLogout() {
      if (!confirm("লগআউট?")) return;
      await signOut(auth);
      location.href = "index.html";
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) { location.href = "login.html"; return; }
      currentUser = user;

      try {
        const snap = await getDoc(doc(db, "users", user.uid));
        if (!snap.exists()) return;
        userData = snap.data();

        document.getElementById("username").textContent = userData.username || "User";
        document.getElementById("email").textContent = user.email;
        document.getElementById("avatar").textContent = (userData.username || "U").charAt(0).toUpperCase();
        
        document.getElementById("statBalance").textContent = "৳" + (userData.balance || 0);
        document.getElementById("statGood").textContent = userData.totalGood || 0;

        if (userData.customBadge) {
          document.getElementById("userBadgeDisplay").style.display = "block";
          const badgeClass = getBadgeClass(userData.customBadgeColor);
          document.getElementById("userBadgeIcon").className = `premium-badge ${badgeClass}`;
        }

        const q = query(collection(db, "submissions"), where("userId", "==", user.uid));
        const subSnap = await getDocs(q);
        document.getElementById("statSubs").textContent = subSnap.size;

        // Load Achievements
        loadAchievements(userData.totalGood || 0, userData.balance || 0, subSnap.size);

      } catch (e) {
        console.error("Profile load error:", e);
      }
    });

    // 🏆 Achievements Logic (Compact Pill style with SVGs)
    function loadAchievements(good, balance, totalSubs) {
      const list = document.getElementById("achievementsList");
      
      const iconMedal = `<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>`;

      const achievements = [
        { id: "starter", title: "Starter", unlocked: good >= 1 },
        { id: "rising", title: "Rising Star", unlocked: good >= 10 },
        { id: "pro", title: "Pro Worker", unlocked: good >= 50 },
        { id: "worker", title: "Hard Worker", unlocked: totalSubs >= 100 },
        { id: "earner", title: "Money Maker", unlocked: balance >= 1000 }
      ];

      list.innerHTML = achievements.map(a => `
        <div class="p-ach-card ${a.unlocked ? 'unlocked' : ''}">
          <div class="p-ach-ic">${iconMedal}</div>
          <div class="p-ach-t">${a.title}</div>
        </div>
      `).join("");
    }

    document.getElementById("changeUsernameBtn").onclick = async () => {
      const newName = prompt("নতুন নাম লিখুন:", userData.username);
      if (!newName || newName.trim().length < 3) { 
        if (newName !== null) alert("নাম কমপক্ষে ৩ অক্ষর হতে হবে!"); 
        return; 
      }
      
      try {
        const cleanName = newName.trim();
        await updateDoc(doc(db, "users", currentUser.uid), { username: cleanName });
        await updateProfile(currentUser, { displayName: cleanName });
        
        document.getElementById("username").textContent = cleanName;
        document.getElementById("avatar").textContent = cleanName.charAt(0).toUpperCase();
        userData.username = cleanName;
        
        alert("✅ নাম সফলভাবে পরিবর্তন হয়েছে!");
      } catch (e) { 
        alert("❌ সমস্যা হয়েছে: " + e.message); 
      }
    };
  </script>
</body>
</html>
