<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Live Chat — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#06060f;--ink:#f4f4ff;--muted:#9a9bb8;--dim:#6f7090;--line:rgba(255,255,255,.09);--cyan:#22d3ee}
    *{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
    html,body{background:var(--bg)!important}
    body{font-family:'Hind Siliguri','Inter',system-ui,sans-serif!important;color:var(--ink);margin:0;padding:0!important;min-height:100vh;min-height:100dvh;overflow-x:hidden;position:relative}
    a{text-decoration:none;color:inherit}button{font-family:inherit}
    
    /* Background */
    .bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
    .orb{position:absolute;border-radius:50%;filter:blur(90px);will-change:transform}
    .orb.o1{width:420px;height:420px;background:#4f46e5;top:-140px;left:-120px;opacity:.5;animation:dr1 20s ease-in-out infinite}
    .orb.o2{width:380px;height:380px;background:#9333ea;bottom:-160px;right:-120px;opacity:.42;animation:dr2 24s ease-in-out infinite}
    @keyframes dr1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,40px) scale(1.1)}}
    @keyframes dr2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-40px,-50px) scale(1.08)}}
    .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 20%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 0%,#000 20%,transparent 70%)}
    
    /* Top */
    .top{position:sticky;top:0;z-index:50;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;background:rgba(6,6,15,.65);backdrop-filter:blur(6px) saturate(160%);-webkit-backdrop-filter:blur(6px) saturate(160%);border-bottom:1px solid var(--line)}
    .top-in{max-width:520px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
    .mark{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#fbbf24,#f59e0b 55%,#d97706);color:#2a1700;font-family:'Inter';font-weight:900;font-size:16px;box-shadow:0 8px 20px -6px rgba(245,158,11,.8),inset 0 1px 0 rgba(255,255,255,.4)}
    .ibtn{width:40px;height:40px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;flex:0 0 40px}
    .ibtn:hover{color:#fff;background:rgba(255,255,255,.1)}
    .ibtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
    
    /* Page */
    .page{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:20px 16px calc(130px + env(safe-area-inset-bottom,0px))}
    .glass{background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.025));border:1px solid var(--line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
    
    /* Online Toggle */
    .otr{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 18px;border-radius:24px;margin-bottom:14px}
    .otr h4{margin:0 0 3px;font-size:15.5px;font-weight:700}
    .otr p{margin:0;font-size:12px;color:var(--muted);line-height:1.5}
    .switch{position:relative;width:54px;height:30px;flex:0 0 54px;display:inline-block}
    .switch input{opacity:0;width:0;height:0;position:absolute;margin:0}
    .slider{position:absolute;inset:0;cursor:pointer;background:rgba(255,255,255,.14);border:1px solid var(--line);border-radius:30px;transition:.3s}
    .slider::before{content:"";position:absolute;height:22px;width:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.3s;box-shadow:0 2px 6px rgba(0,0,0,.35)}
    .switch input:checked+.slider{background:linear-gradient(135deg,#10b981,#0d9488);border-color:transparent;box-shadow:0 0 18px -2px rgba(16,185,129,.8)}
    .switch input:checked+.slider::before{transform:translateX(24px)}

    /* Chat List */
    .chat-list{display:flex;flex-direction:column;gap:10px}
    .chat-row{display:flex;align-items:center;gap:12px;padding:14px;border-radius:20px;margin-bottom:2px;transition:.25s;cursor:pointer;position:relative}
    .chat-row.unread{border-left:4px solid #ef4444;background:linear-gradient(90deg,rgba(239,68,68,.12),rgba(255,255,255,.025) 40%)}
    .chat-row:hover{transform:translateX(4px);border-color:rgba(139,92,246,.4)}
    .chat-av{width:46px;height:46px;flex:0 0 46px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-family:'Inter';font-size:18px;background:linear-gradient(135deg,#6366f1,#8b5cf6)}
    .chat-info{flex:1;min-width:0}
    .chat-info h4{margin:0 0 2px;font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:6px}
    .chat-info p{margin:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .chat-badge{background:#ef4444;color:#fff;min-width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;padding:0 6px}
    .chat-del{width:34px;height:34px;border-radius:10px;border:none;background:rgba(239,68,68,.15);color:#fca5a5;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;flex-shrink:0}
    .chat-del:hover{background:#ef4444;color:#fff;transform:scale(1.05)}

    /* Chat Panel */
    .chat-panel{position:fixed;inset:0;background:#06060f;z-index:2000;display:none;flex-direction:column}
    .chat-panel.open{display:flex}
    .chat-panel .chat-body{background:transparent;flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
    .chat-msg{max-width:80%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.55;word-wrap:break-word;animation:msgIn .35s cubic-bezier(.34,1.56,.64,1)}
    @keyframes msgIn{from{opacity:0;transform:translateY(8px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
    .chat-msg.user{align-self:flex-end;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border-bottom-right-radius:5px;box-shadow:0 10px 22px -10px rgba(139,92,246,.9)}
    .chat-msg.admin{align-self:flex-start;background:rgba(255,255,255,.08);color:#f4f4ff;border:1px solid rgba(255,255,255,.1);border-bottom-left-radius:5px}
    .chat-msg .msg-time{display:block;font-size:10px;opacity:.65;margin-top:4px}
    .ai-tag{font-size:9px;background:rgba(255,255,255,.15);color:#c4b5fd;padding:2px 6px;border-radius:6px;margin-left:6px;font-weight:bold;vertical-align:middle}

    /* Input Bar */
    .chat-input-bar{padding:12px 14px;background:rgba(255,255,255,.04);border-top:1px solid rgba(255,255,255,.1);display:flex;gap:8px;align-items:center;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
    .chat-input-bar input{flex:1;padding:12px 16px;border:1.5px solid rgba(255,255,255,.12);border-radius:999px;font-size:14px;font-family:inherit;outline:none;margin:0;transition:.2s;background:rgba(255,255,255,.06);color:#fff}
    .chat-input-bar input:focus{border-color:rgba(139,92,246,.9);background:rgba(139,92,246,.1);box-shadow:0 0 0 4px rgba(139,92,246,.18)}
    .chat-send{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white;border:none;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 22px -8px rgba(139,92,246,.95);transition:.2s;flex-shrink:0}
    .chat-send:hover{transform:scale(1.08)}
    .chat-send:disabled{background:rgba(255,255,255,.12);box-shadow:none;cursor:not-allowed}
    
    /* Scroll Animation */
    .scroll-reveal{animation:fadeInUp .6s cubic-bezier(.2,.8,.2,1) forwards;opacity:0}
    @keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    
    .empty{text-align:center;padding:30px 16px;border-radius:22px;border:1.5px dashed rgba(255,255,255,.14);color:var(--muted);font-size:13.5px;font-weight:600}
    .empty .em{font-size:30px;margin-bottom:6px}
  </style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="orb o1"></div><div class="orb o2"></div><div class="grid"></div></div>

<header class="top">
  <div class="top-in">
    <button class="ibtn" onclick="location.href='admin.html'" aria-label="Back">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="brand"><div class="mark">⚡</div><span>Live Chat Inbox</span></div>
    <div style="width:40px"></div>
  </div>
</header>

<main class="page">
  <div class="otr glass">
    <div style="min-width:0">
      <h4>🟢 Admin Online Status</h4>
      <p>User-রা দেখবে আপনি online আছেন কিনা</p>
    </div>
    <label class="switch">
      <input type="checkbox" id="onlineToggle">
      <span class="slider"></span>
    </label>
  </div>

  <div id="inboxList" class="chat-list"><div class="empty"><div class="em">⏳</div>লোড হচ্ছে...</div></div>
</main>

<div class="chat-panel" id="adminChatPanel">
  <div class="top" style="padding-top:calc(env(safe-area-inset-top,0px) + 12px)">
    <div class="top-in">
      <button class="ibtn" onclick="closeAdminChat()">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="brand" style="gap:12px">
        <div class="chat-av" id="acUserAvatar" style="width:36px;height:36px;flex-basis:36px;font-size:15px">U</div>
        <div style="min-width:0">
          <div style="font-size:15px;font-weight:700;line-height:1.2" id="acUserName">User</div>
          <div style="font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis" id="acUserEmail">email</div>
        </div>
      </div>
      <div style="width:40px"></div>
    </div>
  </div>
  <div class="chat-body" id="adminChatBody"></div>
  <div class="chat-input-bar">
    <input type="text" id="adminChatInput" placeholder="রিপ্লাই লিখুন..." maxlength="500">
    <button class="chat-send" id="adminChatSend">➤</button>
  </div>
</div>

<script type="module">
  import { auth, db } from "./firebase.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import {
    doc, getDoc, setDoc, collection, query, orderBy, onSnapshot,
    updateDoc, increment, addDoc, serverTimestamp, deleteDoc, getDocs
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  let currentAdmin = null;
  let activeChatId = null;
  let unsubMsgs = null;
  let unsubInbox = null;

  // স্ক্রল অ্যানিমেশন ফাংশন
  function applyScrollAnimations() {
    const elements = document.querySelectorAll('.chat-row, .otr');
    elements.forEach((el, index) => {
      if (!el.classList.contains('scroll-reveal')) {
        el.style.opacity = "0";
        el.style.animationDelay = (index * 0.05) + "s";
        el.classList.add("scroll-reveal");
      }
    });
  }

  onAuthStateChanged(auth, async (user) => {
    if (!user) { location.href = "login.html"; return; }
    const uSnap = await getDoc(doc(db, "users", user.uid));
    if (!uSnap.exists() || uSnap.data().role !== "admin") {
      alert("❌ Admin না!"); location.href = "dashboard.html"; return;
    }
    currentAdmin = user;

    const osSnap = await getDoc(doc(db, "settings", "online_status"));
    const isOnline = osSnap.exists() ? osSnap.data().adminOnline === true : false;
    document.getElementById("onlineToggle").checked = isOnline;

    document.getElementById("onlineToggle").onchange = async (e) => {
      await setDoc(doc(db, "settings", "online_status"), {
        adminOnline: e.target.checked,
        adminLastSeen: new Date(),
        adminName: uSnap.data().username || "ADQ Admin"
      }, { merge: true });
    };

    loadInbox();
  });

  function loadInbox() {
    const list = document.getElementById("inboxList");
    if (unsubInbox) unsubInbox();

    const q = query(collection(db, "chats"), orderBy("lastMessageAt", "desc"));
    unsubInbox = onSnapshot(q, (snap) => {
      if (snap.empty) {
        list.innerHTML = `<div class="empty"><div class="em">📭</div>এখনো কোনো chat নেই</div>`;
        return;
      }
      list.innerHTML = snap.docs.map(d => {
        const c = d.data();
        const unread = c.unreadForAdmin || 0;
        const initial = (c.username || "U").charAt(0).toUpperCase();
        const time = c.lastMessageAt?.toDate?.().toLocaleTimeString("bn-BD", { hour: "2-digit", minute: "2-digit" }) || "";
        
        return `
          <div class="chat-row glass ${unread > 0 ? 'unread' : ''}" id="row-${d.id}">
            <div class="chat-av" onclick="openAdminChat('${d.id}','${escapeAttr(c.username||'User')}','${escapeAttr(c.userEmail||'')}','${initial}')">${initial}</div>
            <div class="chat-info" onclick="openAdminChat('${d.id}','${escapeAttr(c.username||'User')}','${escapeAttr(c.userEmail||'')}','${initial}')">
              <h4>${escapeHtml(c.username || 'User')}</h4>
              <p>${escapeHtml(c.lastMessage || '')} · ${time}</p>
            </div>
            ${unread > 0 ? `<div class="chat-badge" onclick="openAdminChat('${d.id}','${escapeAttr(c.username||'User')}','${escapeAttr(c.userEmail||'')}','${initial}')">${unread}</div>` : ''}
            <button class="chat-del" onclick="deleteChat('${d.id}', event)" title="Delete Chat">🗑️</button>
          </div>
        `;
      }).join("");
      
      setTimeout(applyScrollAnimations, 100);
    });
  }

  // 🗑️ চ্যাট ডিলিট করার ফাংশন (ডেটাবেস ক্লিন রাখতে)
  window.deleteChat = async (chatId, event) => {
    event.stopPropagation(); // যাতে চ্যাট ওপেন না হয়ে যায়
    if (!confirm("এই ইউজারের সম্পূর্ণ চ্যাট ডিলিট করবেন? (এটি আর ফেরত আসবে না)")) return;
    
    try {
      // ১. চ্যাটের ভেতরের সব মেসেজ ডিলিট করা
      const msgsRef = collection(db, "chats", chatId, "messages");
      const msgsSnap = await getDocs(msgsRef);
      for (const d of msgsSnap.docs) {
        await deleteDoc(doc(db, "chats", chatId, "messages", d.id));
      }
      // ২. চ্যাটের মূল ডকুমেন্ট ডিলিট করা
      await deleteDoc(doc(db, "chats", chatId));
      
      alert("✅ চ্যাট ডিলিট হয়ে গেছে!");
    } catch (e) {
      alert("❌ ডিলিট করতে সমস্যা: " + e.message);
    }
  };

  window.openAdminChat = async (chatId, username, email, initial) => {
    activeChatId = chatId;
    document.getElementById("adminChatPanel").classList.add("open");
    document.getElementById("acUserName").textContent = username;
    document.getElementById("acUserEmail").textContent = email;
    document.getElementById("acUserAvatar").textContent = initial;

    await updateDoc(doc(db, "chats", chatId), { unreadForAdmin: 0 });

    if (unsubMsgs) unsubMsgs();
    const body = document.getElementById("adminChatBody");
    const msgsRef = collection(db, "chats", chatId, "messages");
    const q = query(msgsRef, orderBy("createdAt", "asc"));
    
    unsubMsgs = onSnapshot(q, (snap) => {
      const msgs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      body.innerHTML = msgs.length ? msgs.map(m => {
        const t = m.createdAt?.toDate?.();
        const time = t ? t.toLocaleTimeString("bn-BD", { hour: "2-digit", minute: "2-digit" }) : "";
        
        // 🤖 AI ব্যাজ যোগ করা হয়েছে
        const aiBadge = m.isAI ? `<span class="ai-tag">🤖 AI</span>` : '';
        
        return `<div class="chat-msg ${m.sender}">${escapeHtml(m.text)} ${aiBadge}<span class="msg-time">${time}</span></div>`;
      }).join("") : `<div class="empty"><div class="em">💬</div>কোনো মেসেজ নেই</div>`;
      body.scrollTop = body.scrollHeight;
    });

    document.getElementById("adminChatSend").onclick = async () => {
      const input = document.getElementById("adminChatInput");
      const text = input.value.trim();
      if (!text) return;
      document.getElementById("adminChatSend").disabled = true;
      try {
        await addDoc(collection(db, "chats", chatId, "messages"), {
          sender: "admin",
          senderName: "Admin",
          text,
          createdAt: serverTimestamp(),
          readByAdmin: true,
          readByUser: false
        });
        await updateDoc(doc(db, "chats", chatId), {
          lastMessage: text,
          lastMessageAt: serverTimestamp(),
          lastSender: "admin",
          unreadForUser: increment(1)
        });
        input.value = "";
      } catch (e) { alert("❌ " + e.message); }
      document.getElementById("adminChatSend").disabled = false;
    };

    document.getElementById("adminChatInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") document.getElementById("adminChatSend").click();
    });
  };

  window.closeAdminChat = () => {
    document.getElementById("adminChatPanel").classList.remove("open");
    if (unsubMsgs) unsubMsgs();
    activeChatId = null;
  };

  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
  }
  function escapeAttr(s) {
    return String(s ?? "").replace(/'/g, "\\'").replace(/"/g, "&quot;");
  }
</script>
</body>
</html>
