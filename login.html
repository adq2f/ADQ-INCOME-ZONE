<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>লগইন — ADQ Income Zone</title>
  <link rel="stylesheet" href="style.css?v=28">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-box">
      <div class="auth-logo-mark">💰</div>
      <h1 class="auth-title">স্বাগতম</h1>
      <p class="auth-subtitle">আপনার অ্যাকাউন্টে প্রবেশ করুন</p>

      <div id="successBox" class="alert alert-success" style="display:none">
        <div class="badge-icon">✓</div>
        <div>রেজিস্ট্রেশন সফল! এখন লগইন করুন।</div>
      </div>

      <div class="field">
        <span class="field-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></span>
        <input type="email" id="email" placeholder="ইমেইল এড্রেস" autocomplete="off">
      </div>

      <div class="field">
        <span class="field-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
        <input type="password" id="password" placeholder="পাসওয়ার্ড" autocomplete="off">
        <button type="button" class="field-toggle" onclick="togglePass('password', this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;margin:4px 0 18px;font-size:13px;color:var(--text-muted)">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
          <input type="checkbox" style="width:16px;height:16px;margin:0;accent-color:var(--brand)"> মনে রাখুন
        </label>
        <a href="reset-request.html" style="color:var(--brand);text-decoration:none;font-weight:500">🔐 Password Reset Request →</a>
      </div>

      <button class="btn btn-primary" id="loginBtn">প্রবেশ করুন</button>

      <p class="switch-text">অ্যাকাউন্ট নেই?<a href="signup.html">রেজিস্ট্রেশন করুন</a></p>
    </div>
  </div>

  <script type="module">
    import { auth } from "./firebase.js";
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    window.togglePass = function(id, btn) {
      const input = document.getElementById(id);
      input.type = input.type === "password" ? "text" : "password";
      btn.style.color = input.type === "text" ? "#6366f1" : "";
    };

    if (new URLSearchParams(location.search).get("registered") === "1") {
      document.getElementById("successBox").style.display = "flex";
    }

    document.getElementById("loginBtn").onclick = async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const btn = document.getElementById("loginBtn");

      if (!email || !password) return alert("সব ঘর পূরণ করুন!");
      btn.disabled = true;
      btn.textContent = "লগইন হচ্ছে...";

      try {
        // ✅ Session কখনো clear করো না
        await signInWithEmailAndPassword(auth, email, password);
        location.href = "dashboard.html";
      } catch (e) {
        let msg = e.message;
        if (e.code === "auth/invalid-email") msg = "ইমেইল সঠিক নয়!";
        else if (e.code === "auth/user-not-found") msg = "অ্যাকাউন্ট নেই!";
        else if (e.code === "auth/wrong-password" || e.code === "auth/invalid-credential") msg = "ইমেইল বা পাসওয়ার্ড ভুল!";
        else if (e.code === "auth/too-many-requests") msg = "অনেকবার ভুল হয়েছে। পরে চেষ্টা করুন।";
        alert("❌ " + msg);
        btn.disabled = false;
        btn.textContent = "প্রবেশ করুন";
      }
    };
  </script>
</body>
</html>
