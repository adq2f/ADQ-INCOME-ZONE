<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#06060f">
<title>ADQ Income Zone</title>
<script src="app-shell.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
.x-app{justify-content:center;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.l-hero{position:relative;overflow:hidden;border-radius:30px;padding:26px 22px 22px;background:linear-gradient(135deg,#4338ca 0%,#7c3aed 52%,#c026d3 110%);box-shadow:0 28px 60px -20px rgba(124,58,237,.85),inset 0 1px 0 rgba(255,255,255,.3)}
.l-hero::before{content:'';position:absolute;top:-60%;left:-20%;width:90%;height:160%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 62%);pointer-events:none}
.l-hero>*{position:relative}
.l-logo{width:56px;height:56px;border-radius:18px;margin-bottom:14px;display:flex;align-items:center;justify-content:center;font:900 26px 'Inter',sans-serif;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3)}
.l-hero h1{margin:0 0 8px;font-size:27px;line-height:1.25;font-weight:700;letter-spacing:-.5px}
.l-hero h1 span{color:#fde68a}
.l-hero p{margin:0;font-size:13.5px;line-height:1.65;color:rgba(255,255,255,.9);font-weight:500}
.l-feats{display:grid;gap:8px;margin:14px 0}
.l-f{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:18px;font-size:13.5px;font-weight:600}
.l-f i{width:38px;height:38px;flex:0 0 38px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--g)}
.l-f i svg{width:19px;height:19px}
.l-f small{display:block;font-size:11.5px;color:#9a9bb8;font-weight:500;margin-top:1px}
.l-cta{display:grid;grid-template-columns:1.3fr 1fr;gap:10px}
.l-btn{display:flex;align-items:center;justify-content:center;padding:15px;border-radius:16px;font-size:15px;font-weight:700;color:#fff;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);transition:.25s}
.l-btn.solid{background:linear-gradient(135deg,#6366f1,#8b5cf6 55%,#a855f7);border-color:transparent;box-shadow:0 16px 34px -10px rgba(139,92,246,.9),inset 0 1px 0 rgba(255,255,255,.35)}
.l-btn:hover{transform:translateY(-2px)}
</style>
</head>
<body class="x-body">
<div class="x-bg" aria-hidden="true"><div class="o o1"></div><div class="o o2"></div></div>

<div class="x-app">
  <section class="l-hero">
    <div class="l-logo">A</div>
    <h1>প্রতিটি অ্যাকাউন্টে <span>আয় করুন</span></h1>
    <p>টাস্ক সাবমিট করুন, Good অ্যাকাউন্টে টাকা পান আর বন্ধুদের refer করে কমিশন নিন।</p>
  </section>

  <div class="l-feats">
    <div class="l-f x-glass"><i style="--g:linear-gradient(135deg,#6366f1,#a855f7)" id="f1"></i><div>৩০ সেকেন্ডে রেজিস্ট্রেশন<small>সহজ ও দ্রুত শুরু</small></div></div>
    <div class="l-f x-glass"><i style="--g:linear-gradient(135deg,#10b981,#0d9488)" id="f2"></i><div>bKash · Nagad · Rocket · Binance<small>পছন্দের মেথডে withdraw</small></div></div>
    <div class="l-f x-glass"><i style="--g:linear-gradient(135deg,#f59e0b,#ef4444)" id="f3"></i><div>Refer Commission<small>বন্ধুর প্রতিটি Good এ কমিশন</small></div></div>
  </div>

  <div class="l-cta">
    <a href="signup.html" class="l-btn solid">অ্যাকাউন্ট খুলুন</a>
    <a href="login.html" class="l-btn">লগইন</a>
  </div>
</div>

<script type="module">
import { auth } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

window.adqHold = true;
const S = window.ADQ.svg;
document.getElementById("f1").innerHTML = S.bolt;
document.getElementById("f2").innerHTML = S.wallet;
document.getElementById("f3").innerHTML = S.gift;

// লগইন থাকলে সরাসরি dashboard-এ (Home ট্যাব আর নেই)
onAuthStateChanged(auth, (user) => {
  if (user) { location.replace("dashboard.html"); return; }
  window.adqReady && window.adqReady();
});
</script>
</body>
</html>
