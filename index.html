<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ADQ Income Zone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=35">
  <style>
    :root {
      --bg: #06060f; --ink: #f4f4ff; --muted: #9a9bb8; --dim: #6f7090;
      --line: rgba(255,255,255,0.09); --violet: #8b5cf6; --indigo: #6366f1;
      --cyan: #22d3ee; --gold: #fbbf24; --ok: #10b981; --bad: #ef4444;
    }
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    html, body { background: var(--bg) !important; }
    body { font-family: 'Hind Siliguri', 'Inter', sans-serif !important; color: var(--ink); margin: 0; min-height: 100vh; min-height: 100dvh; overflow-x: hidden; position: relative; }
    a { text-decoration: none; }

    /* Background */
    .h-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .h-orb { position: absolute; border-radius: 50%; filter: blur(90px); will-change: transform; }
    .h-orb.o1 { width: 420px; height: 420px; background: #4f46e5; top: -140px; left: -120px; opacity: .5; animation: hDrift1 20s ease-in-out infinite; }
    .h-orb.o2 { width: 380px; height: 380px; background: #9333ea; bottom: -160px; right: -120px; opacity: .45; animation: hDrift2 24s ease-in-out infinite; }
    @keyframes hDrift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(50px,40px) scale(1.1); } }
    @keyframes hDrift2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-40px,-50px) scale(1.08); } }
    .h-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px); background-size: 44px 44px; mask-image: radial-gradient(ellipse at 50% 0%, #000 20%, transparent 70%); -webkit-mask-image: radial-gradient(ellipse at 50% 0%, #000 20%, transparent 70%); }

    /* Top Bar */
    .h-top { position: sticky; top: 0; z-index: 50; padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px; background: rgba(6,6,15,0.65); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); border-bottom: 1px solid var(--line); }
    .h-top-in { max-width: 520px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
    .h-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; letter-spacing: -.2px; }
    .h-mark { width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #6366f1, #8b5cf6 55%, #22d3ee); color: #fff; font-family: 'Inter'; font-weight: 900; font-size: 17px; box-shadow: 0 8px 20px -6px rgba(139,92,246,.8), inset 0 1px 0 rgba(255,255,255,.35); }
    .h-icon-btn { width: 40px; height: 40px; border-radius: 13px; border: 1px solid var(--line); background: rgba(255,255,255,0.05); color: var(--muted); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: .2s; }
    .h-icon-btn:hover { color: #fff; background: rgba(255,255,255,.1); }

    /* Page */
    .h-page { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; padding: 18px 16px calc(120px + env(safe-area-inset-bottom, 0px)); }

    /* Search & Filter */
    .h-filters { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .h-search { flex: 1; min-width: 200px; position: relative; }
    .h-search input { width: 100%; padding: 14px 16px 14px 42px; border-radius: 14px; border: 1px solid var(--line); font-size: 14px; outline: none; background: rgba(255,255,255,0.05); color: #fff; transition: 0.3s; }
    .h-search input:focus { border-color: var(--violet); box-shadow: 0 0 0 4px rgba(139,92,246,0.15); }
    .h-search input::placeholder { color: var(--dim); }
    .h-search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; stroke: var(--muted); }
    .h-filter select { padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); font-size: 14px; font-weight: 600; outline: none; background: rgba(255,255,255,0.05); color: #fff; cursor: pointer; }
    .h-filter select option { background: #12122a; color: #fff; }

    /* Task Card */
    .h-task { position: relative; display: flex; flex-direction: column; gap: 14px; padding: 20px; margin-bottom: 16px; border-radius: 24px; overflow: hidden; background: linear-gradient(160deg, rgba(255,255,255,.075), rgba(255,255,255,.025)); border: 1px solid var(--line); transition: .3s; }
    .h-task:hover { transform: translateY(-4px); border-color: rgba(139,92,246,.55); box-shadow: 0 20px 44px -18px rgba(139,92,246,.7); }
    .h-task-h { display: flex; align-items: center; gap: 14px; }
    .h-task-logo { width: 60px; height: 60px; border-radius: 18px; flex: 0 0 60px; padding: 10px; display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 26px -8px rgba(0,0,0,.6); }
    .h-task-logo svg { width: 100%; height: 100%; }
    .h-task-t { flex: 1; min-width: 0; }
    .h-task-t h3 { font-size: 17px; font-weight: 800; color: var(--ink); margin: 0 0 4px; line-height: 1.25; }
    .h-badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
    .h-badge.open { background: rgba(16,185,129,.2); color: #6ee7b7; }
    .h-badge.upcoming { background: rgba(245,158,11,.2); color: #fde68a; }
    .h-badge.closed { background: rgba(239,68,68,.2); color: #fca5a5; }
    .h-task-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .h-meta-box { background: rgba(255,255,255,.04); border-radius: 12px; padding: 10px; text-align: center; border: 1px solid rgba(255,255,255,.06); }
    .h-meta-box .v { font-size: 15px; font-weight: 900; color: var(--ink); font-family: 'Inter'; }
    .h-meta-box .l { font-size: 10px; color: var(--muted); font-weight: 700; text-transform: uppercase; margin-top: 2px; }
    .h-task-f { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
    .h-price { font-size: 20px; font-weight: 900; color: #34d399; font-family: 'Inter'; line-height: 1; }
    .h-price span { font-size: 12px; color: var(--muted); font-weight: 600; }
    .h-submit-btn { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; padding: 10px 20px; border-radius: 12px; font-size: 13px; font-weight: 800; text-decoration: none; box-shadow: 0 8px 20px rgba(99,102,241,0.3); transition: 0.3s; }
    .h-submit-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(99,102,241,0.5); }

    /* Dock */
    .h-dock { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); width: calc(100% - 24px); max-width: 500px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; padding: 8px; background: rgba(18,18,40,.78); backdrop-filter: blur(24px) saturate(170%); -webkit-backdrop-filter: blur(24px) saturate(170%); border: 1px solid rgba(255,255,255,.12); border-radius: 26px; box-shadow: 0 20px 50px -10px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.1); }
    .h-dock a { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 2px 6px; border-radius: 18px; color: var(--dim); font-size: 10px; font-weight: 600; transition: .25s; }
    .h-dock a svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: .25s; }
    .h-dock a:hover { color: #fff; }
    .h-dock a.active { color: #fff; background: linear-gradient(135deg, rgba(99,102,241,.5), rgba(139,92,246,.35)); box-shadow: inset 0 0 0 1px rgba(167,139,250,.5), 0 8px 20px -8px rgba(139,92,246,.9); }
    .h-dock a.active svg { transform: translateY(-1px) scale(1.08); }
  </style>
</head>
<body>

  <header class="h-top">
    <div class="h-top-in">
      <div class="h-brand"><div class="h-mark">A</div><span>ADQ Income Zone</span></div>
      <button class="h-icon-btn" id="logoutBtn" style="display:none" title="Logout">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
      <a href="login.html" id="loginBtnTop" style="padding:8px 16px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white;border-radius:10px;text-decoration:none;font-size:13px;font-weight:700;">Login</a>
    </div>
  </header>

  <main class="h-page">
    <div id="noticeArea"></div>

    <div class="dash-section-head" style="margin-top: 10px; margin-bottom: 16px;">
      <h3 style="font-size: 20px; font-weight: 900; color: #fff;">🎯 Available Tasks</h3>
    </div>

    <div class="h-filters">
      <div class="h-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>

      <div class="h-filter">
        <select id="taskFilter">

          <option value="open">🟢 Open</option>
          <option value="upcoming">⏳ Upcoming</option>

    </div>

    <div id="taskList" class="loading"><div class="spinner"></div>লোড হচ্ছে...</div>
  </main>

  <nav class="h-dock">
    <a href="index.html" class="active"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Home</span></a>

  </nav>

    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { initChatWidget } from "./chat-widget.js";
    import { initPremiumPopups } from "./premium-popup.js";

    initChatWidget();
    initPremiumPopups();

      Instagram: { color: "linear-gradient(45deg,#F58529,#DD2A7B,#8134AF)", svg: `<svg viewBox="0 0 24 24" fill="white"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>` },
      LinkedIn: { color: "#0A66C2", svg: `<svg viewBox="0 0 24 24" fill="white"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>` },
      TikTok: { color: "#000", svg: `<svg viewBox="0 0 24 24" fill="white"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>` },
      Gmail: { color: "#EA4335", svg: `<svg viewBox="0 0 24 24" fill="white"><path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z"/></svg>` },

      Other: { color: "#64748b", svg: `<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>` }
    };

    let allTasks = [];

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById("logoutBtn").style.display = "flex";
        document.getElementById("loginBtnTop").style.display = "none";
        document.getElementById("logoutBtn").onclick = async () => {
          if (!confirm("লগআউট?")) return;
          await signOut(auth);
          location.reload();
        };
      }
    });

    async function loadNotice() {
      try {
        const q = query(collection(db, "notices"), where("active", "==", true));
        const snap = await getDocs(q);
        if (snap.empty) return;
        const n = snap.docs.map(d => d.data()).sort((a, b) =>
          (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0)
        )[0];

        const timeStr = n.createdAt?.toDate?.().toLocaleString("bn-BD", {
          day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"
        }) || "";

        const apkBtn = n.apkUrl
          ? `<a href="${n.apkUrl}" class="pn-btn pn-btn-apk" target="_blank" rel="noopener noreferrer">⬇️ Download APK</a>` : "";
        const linkBtn = n.linkUrl
          ? `<a href="${n.linkUrl}" class="pn-btn pn-btn-link" target="_blank" rel="noopener noreferrer">🔗 Open Link</a>` : "";

        document.getElementById("noticeArea").innerHTML = `
          <div class="premium-notice">
            <div class="pn-head">
              <div class="pn-bell">🔔</div>
              <div class="pn-title">${n.title}</div>
            </div>
            <div class="pn-msg">${n.message}</div>
            ${(apkBtn || linkBtn) ? `<div class="pn-actions">${apkBtn}${linkBtn}</div>` : ""}
            <div class="pn-time">🕐 ${timeStr}</div>
          </div>
        `;
      } catch (e) {}
    }

    async function loadTasks() {
      const list = document.getElementById("taskList");
      try {
        const q = query(collection(db, "tasks"), where("active", "==", true));
        const snap = await getDocs(q);
        if (snap.empty) {
          list.innerHTML = `<div class="dash-empty"><div class="em">📭</div><p>এখনো কোনো task নেই</p></div>`;
          return;
        }
        allTasks = snap.docs.map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));
        
        renderTasks();
      } catch (e) {
        list.innerHTML = `<div class="dash-empty"><p style="color:#ef4444">${e.message}</p></div>`;
      }
    }

    function renderTasks() {
      const list = document.getElementById("taskList");
      const search = (document.getElementById("taskSearch").value || "").toLowerCase();
      const filter = document.getElementById("taskFilter").value;

      let filtered = allTasks;

      if (search) {
        filtered = filtered.filter(t => (t.title || "").toLowerCase().includes(search));
      }

      const now = new Date();
      filtered = filtered.filter(t => {
        const start = t.startTime?.toDate?.();
        const end = t.endTime?.toDate?.();
        let status = "open";
        if (start && now < start) status = "upcoming";
        else if (end && now > end) status = "closed";

        if (filter === "open" && status !== "open") return false;
        if (filter === "upcoming" && status !== "upcoming") return false;
        return true;
      });

      if (filtered.length === 0) {
        list.innerHTML = `<div class="dash-empty"><div class="em">🔍</div><p>কোনো টাস্ক খুঁজে পাওয়া যায়নি</p></div>`;
        return;
      }

      list.innerHTML = filtered.map((t, i) => {
        const platformKey = t.platform || "Other";
        const platform = PLATFORM_ICONS[platformKey] || PLATFORM_ICONS.Other;
        const fieldCount = (t.fields || []).length;
        
        const start = t.startTime?.toDate?.();
        const end = t.endTime?.toDate?.();
        let status = "open", statusLabel = "🟢 Open";
        if (start && now < start) { status = "upcoming"; statusLabel = "⏳ Upcoming"; }
        else if (end && now > end) { status = "closed"; statusLabel = "🔴 Closed"; }

        let timeLeft = "—";
        if (end) {
          const diffMs = end - now;
          if (diffMs > 0) {
            const hrs = Math.floor(diffMs / 3600000);
            const mins = Math.floor((diffMs % 3600000) / 60000);
            if (hrs > 24) timeLeft = `${Math.floor(hrs / 24)}d ${hrs % 24}h`;
            else if (hrs > 0) timeLeft = `${hrs}h ${mins}m`;
            else timeLeft = `${mins}m`;
          }
        }

        return `
          <div class="h-task" style="animation-delay:${i * 0.05}s">
            <div class="h-task-h">
              <div class="h-task-logo" style="background: ${platform.color}">${platform.svg}</div>
              <div class="h-task-t">
                <h3>${t.title}</h3>
                <span class="h-badge ${status}">${statusLabel}</span>
              </div>
            </div>
            <div class="h-task-meta">
              <div class="h-meta-box"><div class="v">${timeLeft}</div><div class="l">Time Left</div></div>
              <div class="h-meta-box"><div class="v">${fieldCount}</div><div class="l">Fields Needed</div></div>
            </div>
            <div class="h-task-f">
              <div>
                <div class="h-price">৳${t.pricePerAccount} <span>/ account</span></div>
                ${t.referCommission > 0 ? `<div style="font-size: 11px; color: #f59e0b; font-weight: 700; margin-top: 4px;">🎁 ৳${t.referCommission} Refer Commission</div>` : ''}
              </div>
              <a href="task.html?id=${t.id}" class="h-submit-btn">Submit Now →</a>
            </div>
          </div>
        `;
      }).join("");
    }

    document.getElementById("taskSearch").addEventListener("input", renderTasks);
    document.getElementById("taskFilter").addEventListener("change", renderTasks);

    loadNotice();
    loadTasks();
  </script>
</body>
</html>
