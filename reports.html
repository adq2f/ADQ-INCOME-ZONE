<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports — ADQ Income Zone</title>
  <link rel="stylesheet" href="style.css?v=8">
  <style>
    .report-user-card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 14px;
      box-shadow: 0 4px 20px rgba(15,23,42,0.06);
      border-left: 4px solid #6366f1;
      animation: fadeInUp 0.5s var(--ease) both;
    }
    .report-user-card .head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      gap: 10px;
    }
    .report-user-card h3 {
      font-size: 16px;
      color: #0f172a;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .report-user-card .date {
      font-size: 12px;
      color: #94a3b8;
    }
    .report-user-card .platform-badge {
      background: #eef2ff;
      color: #4f46e5;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
    .report-user-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 12px 0;
    }
    .rus {
      background: #f8fafc;
      padding: 12px 8px;
      border-radius: 12px;
      text-align: center;
    }
    .rus .v { font-size: 18px; font-weight: 800; font-family: 'Inter'; }
    .rus .l { font-size: 10px; color: #64748b; font-weight: 700; text-transform: uppercase; margin-top: 2px; }
    .rus.g .v { color: #10b981; }
    .rus.b .v { color: #ef4444; }
    .rus.t .v { color: #f59e0b; }
    .report-user-earned {
      background: linear-gradient(135deg, #d1fae5, #a7f3d0);
      color: #065f46;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <div class="logo">
      <div class="mark">A</div>
      <span>ADQ Income Zone</span>
    </div>
    <button class="nav-logout" id="logoutBtn" title="Logout">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </div>

  <div class="container">
    <div class="dash-section-head">
      <h3>📊 Daily Reports</h3>
    </div>
    <p style="font-size:13px;color:#64748b;margin-bottom:16px">
      Admin প্রতিদিন result publish করলে এখানে দেখতে পাবে।
    </p>
    <div id="reportList" class="loading"><div class="spinner"></div>লোড হচ্ছে...</div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" data-page="home"><span class="nav-ic"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span><span class="nav-label">Home</span></a>
    <a href="dashboard.html" data-page="dashboard" class="active"><span class="nav-ic"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg></span><span class="nav-label">Dashboard</span></a>
    <a href="index.html#tasks" data-page="submit"><span class="nav-ic"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></span><span class="nav-label">Submit</span></a>
    <a href="wallet.html" data-page="wallet"><span class="nav-ic"><svg viewBox="0 0 24 24"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></svg></span><span class="nav-label">Wallet</span></a>
    <a href="profile.html" data-page="profile"><span class="nav-ic"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><span class="nav-label">Profile</span></a>
  </nav>

  <script type="module">
    import { auth, db } from "./firebase.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    document.getElementById("logoutBtn").onclick = async () => {
      if (!confirm("লগআউট?")) return;
      await signOut(auth);
      location.href = "index.html";
    };

    onAuthStateChanged(auth, async (user) => {
      if (!user) { location.href = "login.html"; return; }

      const list = document.getElementById("reportList");
      try {
        const snap = await getDocs(collection(db, "reports"));
        if (snap.empty) {
          list.innerHTML = `<div class="dash-empty"><div class="em">📊</div><p>এখনো কোনো report publish হয়নি</p></div>`;
          return;
        }
        const reports = snap.docs.map(d => d.data())
          .sort((a, b) => (b.publishedAt?.toMillis?.() || 0) - (a.publishedAt?.toMillis?.() || 0));

        list.innerHTML = reports.map((r, i) => {
          const dateStr = r.date ? new Date(r.date).toLocaleDateString("bn-BD", { day: "numeric", month: "long", year: "numeric" }) : "";
          const icons = { Facebook: "📘", Twitter: "🐦", Instagram: "📷", LinkedIn: "💼", TikTok: "🎵", Gmail: "📧", WhatsApp: "💬", Other: "🔗" };
          const ic = icons[r.platform] || "🔗";

          return `
            <div class="report-user-card" style="animation-delay:${i * 0.05}s">
              <div class="head">
                <div>
                  <h3>${r.taskTitle}</h3>
                  <div class="date">📅 ${dateStr}</div>
                </div>
                <span class="platform-badge">${ic} ${r.platform || "Task"}</span>
              </div>
              <div class="report-user-stats">
                <div class="rus g"><div class="v">${r.goodCount || 0}</div><div class="l">Good</div></div>
                <div class="rus b"><div class="v">${r.badCount || 0}</div><div class="l">Bad</div></div>
                <div class="rus t"><div class="v">${r.pendingCount || 0}</div><div class="l">Pending</div></div>
              </div>
              <div class="report-user-earned">
                💰 Total Earned: ৳${r.totalEarned || 0} (${r.goodCount || 0} × ৳${r.pricePerAccount || 0})
              </div>
            </div>
          `;
        }).join("");
      } catch (e) {
        list.innerHTML = `<p style="color:red">${e.message}</p>`;
      }
    });
  </script>
</body>
</html>
